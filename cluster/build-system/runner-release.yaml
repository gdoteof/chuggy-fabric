# The runner packages, kasofsk/chuggy-linux and kasofsk/chuggy-darwin, released
# on GitHub at every commit of each one's `main` that moves its version: the
# Task that does it, the triggers that start it, and what holds each to that.
#
# WHY IT IS HERE. A ticket that releases a runner package lands as a pull
# request merge that moves `package.json`'s version, and nothing then released
# it: a person packed the tarball, wrote the notes and published the release,
# and the pin in kasofsk/chuggy waited for them. The release is a function of
# one commit of a public repository, as the worker contract's is, so this is
# contract-publish.yaml for a runner package, and each rule below that file
# also has is argued there: three steps in one pod, the token in the last
# alone, which runs a file of this repository over a handoff it checks; RBAC
# as what holds the Secrets to this Task, with a policy that guards against a
# typo; the Secrets optional; the scripts release-pipeline-scripts'; /source
# marked safe by `GIT_CONFIG_*` in the two steps that run git.
#
# WHAT DIFFERS. `runner-prepare.sh` packs with `npm pack` and reads the
# release's notes from the release commit's message, and `runner-release.mjs`
# releases under the tag `v<version>`, titled with the tag, with those notes.
# A run is of one package, its `package` parameter, and the repository it
# releases on is that package's under kasofsk: admission holds both to the two
# packages and to the source each is fetched from.
#
# ONE TOKEN A PACKAGE. modules/github-app-token.nix mints a token for one
# repository, so the host mints the portal App's for each package's repository
# alone, with `contents: write`, into `chuggy-runner-release-token-<package>`
# in this namespace, and the Task's volume names the one of its run's
# package. A run for one package is never in a pod with the other's token.
#
# WHAT THIS DOES NOT PROMISE, beside what contract-publish.yaml says of its
# own: the tag is made at the commit of `main` the trigger runs, which is the
# merge that moved the version unless `main` moved again within the minute,
# and a release made then packs that later commit. A release is published
# before kasofsk/chuggy pins it, and no pool installs one it is not pinned to:
# the pin, `just pin-runner-release`, is what a pool is updated by.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: publish-runner-release
  namespace: chuggy-build
spec:
  params:
    - name: url
      description: The repository the package is released from, as its GitRepository fetches it.
      type: string
    - name: commit
      description: The full hash of the commit to release. It is the commit the release's tag is made at.
      type: string
    - name: package
      description: The runner package, which is also the name of its repository under kasofsk.
      type: string
  volumes:
    - name: scripts
      configMap:
        name: release-pipeline-scripts
    - name: tmp
      emptyDir: {}
    - name: source
      emptyDir: {}
    - name: handoff
      emptyDir: {}
    - name: publisher
      secret:
        secretName: chuggy-runner-release-token-$(params.package)
        defaultMode: 0444
        items:
          - { key: token, path: token }
        optional: true
  steps:
    - name: fetch
      image: node:24.22.0-trixie@sha256:03795b45b3153ccaf7459e36c09d4e7ad6bdc08c5c2c2df1fce7e9f465c9103f
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, /scripts/fetch.sh]
      env:
        - { name: URL, value: $(params.url) }
        - { name: COMMIT, value: $(params.commit) }
        - { name: DIRECTORY, value: /source }
        - { name: GIT_CONFIG_COUNT, value: "1" }
        - { name: GIT_CONFIG_KEY_0, value: safe.directory }
        - { name: GIT_CONFIG_VALUE_0, value: /source }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        seccompProfile: { type: RuntimeDefault }
      computeResources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 1Gi }
      volumeMounts:
        - { name: scripts, mountPath: /scripts, readOnly: true }
        - { name: tmp, mountPath: /tmp }
        - { name: source, mountPath: /source }
    - name: prepare
      image: node:24.22.0-trixie@sha256:03795b45b3153ccaf7459e36c09d4e7ad6bdc08c5c2c2df1fce7e9f465c9103f
      imagePullPolicy: IfNotPresent
      command: [/bin/sh, /scripts/runner-prepare.sh]
      env:
        - { name: SOURCE, value: /source }
        - { name: OUT, value: /handoff }
        - { name: URL, value: $(params.url) }
        - { name: COMMIT, value: $(params.commit) }
        - { name: PACKAGE, value: $(params.package) }
        - { name: REPOSITORY, value: kasofsk/$(params.package) }
        - { name: HOME, value: /tmp/home }
        - { name: npm_config_cache, value: /tmp/npm }
        - { name: GIT_CONFIG_COUNT, value: "1" }
        - { name: GIT_CONFIG_KEY_0, value: safe.directory }
        - { name: GIT_CONFIG_VALUE_0, value: /source }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        seccompProfile: { type: RuntimeDefault }
      computeResources:
        requests: { cpu: 250m, memory: 512Mi }
        limits: { memory: 2Gi }
      volumeMounts:
        - { name: scripts, mountPath: /scripts, readOnly: true }
        - { name: tmp, mountPath: /tmp }
        - { name: source, mountPath: /source }
        - { name: handoff, mountPath: /handoff }
    - name: release
      image: node:24.22.0-trixie-slim@sha256:7f486cabe892bff8fef04c0f7da8dba84a560be3e4e2740b7a86afc57ebec315
      imagePullPolicy: IfNotPresent
      command: [node, /scripts/runner-release.mjs]
      env:
        - { name: OUT, value: /handoff }
        - { name: COMMIT, value: $(params.commit) }
        - { name: PACKAGE, value: $(params.package) }
        - { name: REPOSITORY, value: kasofsk/$(params.package) }
        - { name: TOKEN, value: /var/run/chuggy/publisher/token }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        seccompProfile: { type: RuntimeDefault }
      computeResources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 256Mi }
      volumeMounts:
        - { name: scripts, mountPath: /scripts, readOnly: true }
        - { name: handoff, mountPath: /handoff, readOnly: true }
        - { name: publisher, mountPath: /var/run/chuggy/publisher, readOnly: true }
---
# A GUARD AGAINST A TYPO, NOT THE HOLD, as contract-publish.yaml's of the same
# shape: a pod that reaches either package's Secret, by a volume, a
# projection, an environment value or `envFrom`, is refused unless it carries
# the label Tekton gives a pod of the Task above.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runner-release-token-has-one-reader
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: chuggy-build }
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: reaches
      expression: >-
        (has(object.spec.volumes) ? object.spec.volumes : []).exists(volume,
          (has(volume.secret) && volume.secret.secretName in ["chuggy-runner-release-token-chuggy-linux", "chuggy-runner-release-token-chuggy-darwin"])
          || (has(volume.projected) && volume.projected.sources.exists(source,
            has(source.secret) && source.secret.name in ["chuggy-runner-release-token-chuggy-linux", "chuggy-runner-release-token-chuggy-darwin"])))
        || variables.containers.exists(container,
          (has(container.env) && container.env.exists(entry,
            has(entry.valueFrom) && has(entry.valueFrom.secretKeyRef)
            && entry.valueFrom.secretKeyRef.name in ["chuggy-runner-release-token-chuggy-linux", "chuggy-runner-release-token-chuggy-darwin"]))
          || (has(container.envFrom) && container.envFrom.exists(source,
            has(source.secretRef) && source.secretRef.name in ["chuggy-runner-release-token-chuggy-linux", "chuggy-runner-release-token-chuggy-darwin"])))
  validations:
    - expression: >-
        !variables.reaches
        || (has(object.metadata.labels) && "tekton.dev/task" in object.metadata.labels
        && object.metadata.labels["tekton.dev/task"] == "publish-runner-release")
      message: >-
        the runner release tokens are mounted by pods labelled as the Task
        publish-runner-release and by no other pod
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runner-release-token-has-one-reader
spec:
  policyName: runner-release-token-has-one-reader
  validationActions: [Deny]
---
# THE TRIGGERS: each minute, for each package, whether a release of it is
# started. image-trigger.sh over the package's source and the Task above, with
# `package` as the parameter a run is of, so each CronJob reads, keeps and
# deletes the runs of its own package and none of the other's.
#
# ONE ServiceAccount FOR THE TWO, as the worker image triggers share one: `get`
# on the two sources it compares, by name, in `flux-system`; `list`, `create`
# and `delete` on TaskRuns in `chuggy-build`. It cannot read a run's pods or
# logs, a Secret anywhere, or any other source.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-release-trigger
  namespace: chuggy-release-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-release-trigger-reads-sources
  namespace: flux-system
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [chuggy-linux, chuggy-darwin]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-release-trigger-reads-sources
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-release-trigger-reads-sources
subjects:
  - kind: ServiceAccount
    name: runner-release-trigger
    namespace: chuggy-release-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-release-trigger-runs
  namespace: chuggy-build
rules:
  - apiGroups: [tekton.dev]
    resources: [taskruns]
    verbs: [list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-release-trigger-runs
  namespace: chuggy-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-release-trigger-runs
subjects:
  - kind: ServiceAccount
    name: runner-release-trigger
    namespace: chuggy-release-trigger
---
# THE RUN, LESS WHAT THE TRIGGER WRITES INTO IT, as contract-publish.yaml's
# policy of the same shape argues: `spec` below is the run files' without their
# parameters, as CEL in the form the API server stores it after Tekton's
# webhook has rewritten it, and tests/release-pipeline.py writes the same from
# the two files and refuses a difference. A run carries no label but the one
# Tekton's defaulting writes, and no annotation.
#
# THE PACKAGE IS ONE OF TWO, AND THE ADDRESS IS ITS REPOSITORY'S. The Task
# releases on `kasofsk/<package>` with that package's token, so a run for
# another value is a pod mounting a Secret no host mints, and a run whose
# address is another repository's would pack one repository and release it on
# another.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runner-release-creates-a-release-run
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [tekton.dev]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [taskruns]
  matchConditions:
    - name: created-by-the-runner-release-trigger
      expression: request.userInfo.username == "system:serviceaccount:chuggy-release-trigger:runner-release-trigger"
  variables:
    - name: spec
      expression: |-
        {
          "taskRef": dyn({"name": "publish-runner-release", "kind": "Task"}),
          "timeout": dyn("30m0s"),
          "serviceAccountName": dyn("builder"),
          "podTemplate": dyn({
            "automountServiceAccountToken": dyn(false),
            "nodeSelector": dyn({
              "chuggy.dev/node-role": "builder",
              "kubernetes.io/os": "linux",
              "kubernetes.io/arch": "amd64"
            }),
            "tolerations": dyn([
              {"key": "chuggy.dev/node-role", "operator": "Equal", "value": "builder", "effect": "NoSchedule"}
            ])
          })
        }
    - name: params
      expression: >-
        has(object.spec.params) ? object.spec.params : []
  validations:
    - expression: object.apiVersion == "tekton.dev/v1"
      message: >-
        a run the runner release trigger creates is a tekton.dev/v1 TaskRun,
        and in another version what is held here goes by other names
    - expression: >-
        !has(object.metadata.labels) || object.metadata.labels
        == {"app.kubernetes.io/managed-by": "tekton-pipelines"}
      message: >-
        a run the runner release trigger creates carries no label but the one
        Tekton's defaulting writes on every run, and a run's labels are its
        pod's labels
    - expression: "!has(object.metadata.annotations)"
      message: >-
        a run the runner release trigger creates carries no annotation, and a
        run's annotations are its pod's annotations
    - expression: object.spec.all(field, field == "params" || field in variables.spec)
      message: >-
        a run the runner release trigger creates sets nothing its run files do
        not, and a task, a step's overrides or a pod template of its own is a
        pod of its writer's choosing
    - expression: variables.spec.all(field, field in object.spec && object.spec[field] == variables.spec[field])
      message: >-
        a run the runner release trigger creates is of its run files' Task,
        within their time, and its pod runs where and as what they say
    - expression: variables.params.map(param, param.name) == ["url", "commit", "package"]
      message: >-
        a run the runner release trigger creates passes the parameters its run
        files pass, each once
    - expression: >-
        variables.params.exists(param, param.name == "package" && type(param.value) == string
        && param.value in ["chuggy-linux", "chuggy-darwin"]
        && variables.params.exists(url, url.name == "url"
        && url.value == "https://github.com/kasofsk/" + param.value + ".git"))
      message: >-
        a run the runner release trigger creates releases chuggy-linux or
        chuggy-darwin, from that package's repository
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runner-release-creates-a-release-run
spec:
  policyName: runner-release-creates-a-release-run
  validationActions: [Deny]
---
# WHAT A RUN IS FOR IS WHAT ITS SOURCE HOLDS. Each binding below gives the
# policy one package's source, and a run fetched from that source's address
# must be for the commit of the artifact it holds; a run from the other
# address is the other binding's to judge, and the policy above holds every
# run to one of the two. A source that is not there is `Allow`, for the reason
# contract-publish.yaml gives of its own.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: runner-release-releases-what-a-source-holds
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
  matchConstraints:
    resourceRules:
      - apiGroups: [tekton.dev]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [taskruns]
  matchConditions:
    - name: created-by-the-runner-release-trigger
      expression: request.userInfo.username == "system:serviceaccount:chuggy-release-trigger:runner-release-trigger"
  validations:
    - expression: >-
        !(has(object.spec.params)
        && object.spec.params.exists(param, param.name == "url" && param.value == params.spec.url))
        || (has(params.status.artifact)
        && object.spec.params.exists(param, param.name == "commit" && type(param.value) == string
        && params.status.artifact.revision.endsWith("@sha1:" + param.value)))
      messageExpression: >-
        "a run the runner release trigger creates from the address GitRepository "
        + params.metadata.name + " fetches is for the commit it holds"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runner-release-releases-what-chuggy-linux-holds
spec:
  policyName: runner-release-releases-what-a-source-holds
  validationActions: [Deny]
  paramRef:
    name: chuggy-linux
    namespace: flux-system
    parameterNotFoundAction: Allow
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: runner-release-releases-what-chuggy-darwin-holds
spec:
  policyName: runner-release-releases-what-a-source-holds
  validationActions: [Deny]
  paramRef:
    name: chuggy-darwin
    namespace: flux-system
    parameterNotFoundAction: Allow
---
# WHERE THE TRIGGERS' PODS MAY GO: the cluster's DNS and the API server's
# port, as release-trigger.yaml's `release-trigger-egress` argues, selected by
# the label the two CronJobs share.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-release-trigger-egress
  namespace: chuggy-release-trigger
spec:
  podSelector:
    matchLabels: { app: runner-release-trigger }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
      ports:
        - { protocol: TCP, port: 6443 }
---
# Each minute, whether GitRepository `chuggy-linux` holds a commit the newest
# release run of chuggy-linux did not run for. The timing and the retry are the
# contract publish trigger's, for the reasons contract-publish.yaml gives, and
# tests/release-pipeline.py holds every trigger to one timing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: runner-release-chuggy-linux-trigger
  namespace: chuggy-release-trigger
  labels: { app: runner-release-trigger }
spec:
  schedule: "* * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 45
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels: { app: runner-release-trigger }
        spec:
          serviceAccountName: runner-release-trigger
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 5
          nodeSelector:
            kubernetes.io/os: linux
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: trigger
              image: ghcr.io/fluxcd/flux-cli:v2.6.4@sha256:d6734ea180b0f5135e6a343482da1a669c526ef85525da53a6415c6a9f359861
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, /trigger/image-trigger.sh]
              env:
                # kubectl keeps a discovery cache under it.
                - { name: HOME, value: /tmp }
                - { name: SOURCES_NAMESPACE, value: flux-system }
                - { name: SOURCE, value: chuggy-linux }
                - { name: RUNS_NAMESPACE, value: chuggy-build }
                - { name: TASK, value: publish-runner-release }
                - { name: SUBJECT_PARAM, value: package }
                - { name: IMAGE, value: chuggy-linux }
                - { name: RUN_MANIFEST, value: /trigger/runner-release-chuggy-linux-run.yaml }
                - { name: RETRY_DELAY_SECONDS, value: "600" }
                - { name: KEEP_RUNS, value: "10" }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: trigger, mountPath: /trigger, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: trigger
              configMap:
                name: image-trigger
            - name: tmp
              emptyDir: {}
---
# The same for GitRepository `chuggy-darwin` and the runs of chuggy-darwin.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: runner-release-chuggy-darwin-trigger
  namespace: chuggy-release-trigger
  labels: { app: runner-release-trigger }
spec:
  schedule: "* * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 45
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels: { app: runner-release-trigger }
        spec:
          serviceAccountName: runner-release-trigger
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 5
          nodeSelector:
            kubernetes.io/os: linux
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: trigger
              image: ghcr.io/fluxcd/flux-cli:v2.6.4@sha256:d6734ea180b0f5135e6a343482da1a669c526ef85525da53a6415c6a9f359861
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, /trigger/image-trigger.sh]
              env:
                # kubectl keeps a discovery cache under it.
                - { name: HOME, value: /tmp }
                - { name: SOURCES_NAMESPACE, value: flux-system }
                - { name: SOURCE, value: chuggy-darwin }
                - { name: RUNS_NAMESPACE, value: chuggy-build }
                - { name: TASK, value: publish-runner-release }
                - { name: SUBJECT_PARAM, value: package }
                - { name: IMAGE, value: chuggy-darwin }
                - { name: RUN_MANIFEST, value: /trigger/runner-release-chuggy-darwin-run.yaml }
                - { name: RETRY_DELAY_SECONDS, value: "600" }
                - { name: KEEP_RUNS, value: "10" }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: trigger, mountPath: /trigger, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: trigger
              configMap:
                name: image-trigger
            - name: tmp
              emptyDir: {}
