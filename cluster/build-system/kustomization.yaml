# Tekton, the namespace builds run in, the release pipeline with its trigger,
# the triggers that build the site's image and the docs', the triggers that
# build the worker image, its runtime and the chat image, the job that admits a
# worker built, the job that admits the site's image built, the Task and
# trigger that release the worker contract, the Task and triggers that release
# the runner packages, and the Task that builds an image for two platforms.
#
# A FILE THAT IS NOT IN `resources` IS NOT APPLIED. The manifests here left
# out on purpose say so in their own headers: release-run.yaml,
# chug-gy-image-run.yaml, chuggy-docs-image-run.yaml, contract-publish-run.yaml, the two
# runner-release-*-run.yaml, worker-image-run.yaml,
# worker-runtime-image-run.yaml and chat-image-run.yaml, which a trigger
# creates, and
# track-record-image-run.yaml, which a person does. admit-worker.sh and
# arm64-builder.sh are a person's to run, and nothing here runs them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vendor/tekton-v1.12.0/release.yaml
  - platform.yaml
  - release-pipeline.yaml
  - release-trigger.yaml
  - image-trigger.yaml
  - worker-image-trigger.yaml
  - worker-admit.yaml
  - chug-gy-admit.yaml
  - contract-publish.yaml
  - runner-release.yaml
  - two-platform-image.yaml

configMapGenerator:
  # What the pipeline's steps run. The name carries no hash because a Task is
  # not a kind kustomize rewrites a ConfigMap's name in, so a hashed name is
  # one no Task would mount. release-pipeline.yaml says what that leaves a
  # run in flight to.
  - name: release-pipeline-scripts
    namespace: chuggy-build
    files:
      - fetch.sh
      - build.sh
      - index.sh
      - publish.sh
      - report.sh
      - contract-gh.sh
      - contract-prepare.sh
      - contract-release.mjs
      - runner-prepare.sh
      - runner-release.mjs
    options:
      disableNameSuffixHash: true
  # What the release trigger runs, and the run it creates. Hashed, and
  # kustomize rewrites the CronJob's volume to the name.
  - name: release-trigger
    namespace: chuggy-release-trigger
    files:
      - trigger.sh
      - release-run.yaml
  # What an image trigger runs, and the run each creates. Hashed the same way.
  - name: image-trigger
    namespace: chuggy-release-trigger
    files:
      - image-trigger.sh
      - chug-gy-image-run.yaml
      - chuggy-docs-image-run.yaml
      - contract-publish-run.yaml
      - runner-release-chuggy-linux-run.yaml
      - runner-release-chuggy-darwin-run.yaml
      - worker-image-run.yaml
      - worker-runtime-image-run.yaml
      - chat-image-run.yaml
  # What each admission runs, one script a step, the last of them shared.
  # Hashed the same way.
  - name: worker-admit
    namespace: chuggy-admit
    files:
      - worker-admit-read.sh
      - worker-admit-prepare.sh
      - admit-publish.sh
  - name: chug-gy-admit
    namespace: chuggy-admit
    files:
      - chug-gy-admit-read.sh
      - chug-gy-admit-prepare.sh
      - admit-publish.sh
