# Tekton, the namespace builds run in, the release pipeline with its trigger,
# the trigger that builds the site's image, the triggers that build the worker
# image and its runtime, the job that admits a worker built, the Task and
# trigger that release the worker contract, and the Task that builds an image
# for two platforms.
#
# A FILE THAT IS NOT IN `resources` IS NOT APPLIED. The manifests here left
# out on purpose say so in their own headers: release-run.yaml,
# chug-gy-image-run.yaml, contract-publish-run.yaml, worker-image-run.yaml and
# worker-runtime-image-run.yaml, which a trigger creates, and
# track-record-image-run.yaml, which a person does. admit-worker.sh and
# arm64-builder.sh are a person's to run, and nothing here runs them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vendor/tekton-v1.12.0/release.yaml
  - platform.yaml
  - release-pipeline.yaml
  - release-trigger.yaml
  - image-trigger.yaml
  - worker-image-trigger.yaml
  - worker-admit.yaml
  - contract-publish.yaml
  - two-platform-image.yaml

configMapGenerator:
  # What the pipeline's steps run. The name carries no hash because a Task is
  # not a kind kustomize rewrites a ConfigMap's name in, so a hashed name is
  # one no Task would mount. release-pipeline.yaml says what that leaves a
  # run in flight to.
  - name: release-pipeline-scripts
    namespace: chuggy-build
    files:
      - fetch.sh
      - build.sh
      - index.sh
      - publish.sh
      - report.sh
      - contract-gh.sh
      - contract-prepare.sh
      - contract-release.mjs
    options:
      disableNameSuffixHash: true
  # What the release trigger runs, and the run it creates. Hashed, and
  # kustomize rewrites the CronJob's volume to the name.
  - name: release-trigger
    namespace: chuggy-release-trigger
    files:
      - trigger.sh
      - release-run.yaml
  # What an image trigger runs, and the run each creates. Hashed the same way.
  - name: image-trigger
    namespace: chuggy-release-trigger
    files:
      - image-trigger.sh
      - chug-gy-image-run.yaml
      - contract-publish-run.yaml
      - worker-image-run.yaml
      - worker-runtime-image-run.yaml
  # What the worker admission runs, one script a step. Hashed the same way.
  - name: worker-admit
    namespace: chuggy-admit
    files:
      - worker-admit-read.sh
      - worker-admit-prepare.sh
      - worker-admit-publish.sh
