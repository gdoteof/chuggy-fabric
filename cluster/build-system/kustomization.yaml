# Tekton, the namespace builds run in, and the release pipeline with its
# trigger.
#
# A FILE THAT IS NOT IN `resources` IS NOT APPLIED. Two manifests here are
# left out on purpose and say so in their own headers: release-run.yaml,
# which the trigger creates, and worker-image-run.yaml, which a person does.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vendor/tekton-v1.12.0/release.yaml
  - platform.yaml
  - release-pipeline.yaml
  - release-trigger.yaml

configMapGenerator:
  # What the pipeline's steps run. The name carries no hash because a Task is
  # not a kind kustomize rewrites a ConfigMap's name in, so a hashed name is
  # one no Task would mount. release-pipeline.yaml says what that leaves a
  # run in flight to.
  - name: release-pipeline-scripts
    namespace: chuggy-build
    files:
      - fetch.sh
      - build.sh
      - publish.sh
      - report.sh
    options:
      disableNameSuffixHash: true
  # What the trigger runs, and the run it creates. Hashed, and kustomize
  # rewrites the CronJob's volume to the name.
  - name: release-trigger
    namespace: chuggy-release-trigger
    files:
      - trigger.sh
      - release-run.yaml
