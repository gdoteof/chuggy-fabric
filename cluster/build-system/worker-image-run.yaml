# One build of chuggy's worker image, for linux/amd64 and linux/arm64, and the
# only manifest for one.
#
# NOT APPLIED. It is not in kustomization.yaml's `resources`: Flux applying a
# run would start one at every reconcile. The generator there puts this file in
# the image trigger's ConfigMap beside image-trigger.sh, and the CronJob
# `worker-image-trigger` writes the three values into it and creates it each
# time GitRepository `chuggy-worker` holds inputs the newest build did not
# build. A person who starts one does it through that script, by
# `kubectl create job --from=cronjob/worker-image-trigger` in
# `chuggy-release-trigger`, which starts a build only where the inputs differ
# from the newest run's; to build the same inputs again, delete the newest run.
# So a run has one shape whoever started it.
#
# EACH `@name@` IS A VALUE THE TRIGGER READ off the Flux source: the address it
# fetches, the commit it holds, and the digest of the archive of the inputs
# (worker-image-trigger.yaml says what those are). The digest is written as the
# run's one annotation, which is what the next comparison reads this run by.
# The `commit` parameter is what the Task checks out and tags by.
#
# THE WORKER IS HALF A RELEASE. worker-runtime-image-run.yaml is the other
# half, from the same Task at the same commit, and the two are admitted
# together by a change to cluster/chuggy/chuggy-scheduler.yaml: this run's
# `digest` result is the offered image and the session policy's, the other's
# is CHUG_SCHEDULER_WORKER_RUNTIME. cluster/build-system/admit-worker.sh writes
# that change. The digest is an index's, and docker on each runner pulls the
# half of its platform.
#
# THE TWO-PLATFORM TASK, AND THE SAME PLACEMENT AS A RELEASE'S BUILDS.
# two-platform-image.yaml says where each half is built, and `arm64-builder`
# is the Mac's daemon as arm64-builder.sh publishes it. release-run.yaml argues
# the pod template; a TaskRun carries it at the top of its spec. `target` is
# the Dockerfile stage; empty builds the last, which is the worker, and it is
# passed so that this run and the runtime's pass the same names. `taskRef.kind`
# and the timeout are written as Tekton's webhook would write them, because
# admission compares what that wrote.
#
# THE TIMEOUT BOUNDS A HANG. The two halves run at once, and it is set well
# above the longer of them, cold.
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: worker-image-
  namespace: chuggy-build
  annotations:
    fabric.chuggy.dev/worker-inputs: "@source-inputs@"
spec:
  taskRef:
    name: build-two-platform-image
    kind: Task
  params:
    - name: url
      value: "@source-url@"
    - name: commit
      value: "@source-commit@"
    - name: image
      value: registry.chuggy-registry.svc.cluster.local:5000/chuggy/worker
    - name: dockerfile
      value: images/worker/Dockerfile
    - name: target
      value: ""
    - name: arm64-builder
      value: tcp://192.168.0.175:1234
  timeout: 3h0m0s
  serviceAccountName: builder
  podTemplate:
    automountServiceAccountToken: false
    nodeSelector:
      chuggy.dev/node-role: builder
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
    tolerations:
      - key: chuggy.dev/node-role
        operator: Equal
        value: builder
        effect: NoSchedule
