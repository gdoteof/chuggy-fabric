# One build of the site's image, started by hand.
#
# NOT APPLIED, and in no ConfigMap either, as track-record-image-run.yaml is
# not. An operator writes the commit in and creates it:
#
#   sed 's/@chug-gy-commit@/<full commit hash>/' cluster/build-system/chug-gy-image-run.yaml |
#     kubectl create --filename -
#
# The run's `digest` result is what cluster/chug-gy/chug-gy.yaml names the
# image at, and a commit writing it there is what deploys it.
#
# NOT UNDER `chuggy/` IN THE REGISTRY. tests/rollout-order.py reads an image
# under that prefix as a release's, and refuses one outside the release layers.
#
# THE SAME TASK AND THE SAME PLACEMENT AS A RELEASE'S BUILDS. release-run.yaml
# argues the pod template; a TaskRun carries it at the top of its spec.
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: chug-gy-image-
  namespace: chuggy-build
spec:
  taskRef:
    name: build-image
  params:
    - name: url
      value: https://github.com/kasofsk/chug.gy.git
    - name: commit
      value: "@chug-gy-commit@"
    - name: image
      value: registry.chuggy-registry.svc.cluster.local:5000/chug-gy/web
    - name: dockerfile
      value: Dockerfile
  timeout: 1h
  serviceAccountName: builder
  podTemplate:
    automountServiceAccountToken: false
    nodeSelector:
      chuggy.dev/node-role: builder
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
    tolerations:
      - key: chuggy.dev/node-role
        operator: Equal
        value: builder
        effect: NoSchedule
