apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: shipwright-build-selfsigned
  namespace: shipwright-build
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shipwright-build-webhook
  namespace: shipwright-build
spec:
  secretName: shipwright-build-webhook-cert
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - shp-build-webhook
    - shp-build-webhook.shipwright-build
    - shp-build-webhook.shipwright-build.svc
    - shp-build-webhook.shipwright-build.svc.cluster.local
  issuerRef:
    apiGroup: cert-manager.io
    kind: Issuer
    name: shipwright-build-selfsigned
