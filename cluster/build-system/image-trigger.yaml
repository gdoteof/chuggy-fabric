# The image trigger: each minute, whether a build of the site's image is
# started.
#
# THE RELEASE TRIGGER'S NAMESPACE, BECAUSE THE SAME ARGUMENT PLACES IT THERE:
# release-trigger.yaml says why a thing that reads the API server is not in
# `chuggy-build`, and that namespace is where the tokens and the one route are.
# A ServiceAccount of its own, so that what each token can do is said once.
#
# WHAT ITS TOKEN CAN DO IS THREE VERBS AND ONE READ. `get` on the one source it
# compares, by name, in `flux-system`; `list`, `create` and `delete` on
# TaskRuns in `chuggy-build`. It cannot read a run's pods or logs, a Secret
# anywhere, or any other source.
#
# WHAT `create` CREATES IS HELD BY ADMISSION, as the release trigger's is. A
# TaskRun may carry a task of its own, a pod template of its own and any
# parameters, and `chuggy-build` admits a privileged pod, so the verb by itself
# is any pod that namespace admits. The two policies below admit from this
# ServiceAccount a run whose `spec` is chug-gy-image-run.yaml's, for an image
# and a Dockerfile that file names, at the address and the commit the source
# holds, with no label and no annotation. So what the token can start is the
# run the trigger would start.
#
# image-trigger.sh, in the ConfigMap kustomization.yaml generates beside
# chug-gy-image-run.yaml, argues what it decides.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-trigger
  namespace: chuggy-release-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-trigger-reads-sources
  namespace: flux-system
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [chug-gy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-trigger-reads-sources
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-trigger-reads-sources
subjects:
  - kind: ServiceAccount
    name: image-trigger
    namespace: chuggy-release-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-trigger-runs
  namespace: chuggy-build
rules:
  - apiGroups: [tekton.dev]
    resources: [taskruns]
    verbs: [list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-trigger-runs
  namespace: chuggy-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-trigger-runs
subjects:
  - kind: ServiceAccount
    name: image-trigger
    namespace: chuggy-release-trigger
---
# THE RUN, LESS WHAT THE TRIGGER WRITES INTO IT. `spec` below is
# chug-gy-image-run.yaml's without its parameters, as CEL, and `images` is
# the one image that file builds, with its Dockerfile. tests/release-pipeline.py
# writes the same from that file and refuses a difference, so neither moves
# alone.
#
# IT READS A RUN AS THE API SERVER WILL STORE IT, after Tekton's webhook has
# rewritten it: a `taskRef` with no `kind` is given `Task`, and `1h` is
# written `1h0m0s`. The run file writes both as stored.
#
# THE PARAMETERS ARE HELD HERE AND BELOW. The four names, each once, are held
# here; `image` and `dockerfile` to the file's values here, because a run for
# another image or another Dockerfile is any build a commit can describe; `url`
# and `commit` to the source below.
#
# ONLY `tekton.dev/v1`, and NOTHING BUT THE TRIGGER'S ServiceAccount IS HELD BY
# THIS POLICY, for the reasons release-trigger.yaml gives of its own.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-trigger-creates-an-image-run
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [tekton.dev]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [taskruns]
  matchConditions:
    - name: created-by-the-image-trigger
      expression: request.userInfo.username == "system:serviceaccount:chuggy-release-trigger:image-trigger"
  variables:
    - name: spec
      expression: |-
        {
          "taskRef": dyn({"name": "build-image", "kind": "Task"}),
          "timeout": dyn("1h0m0s"),
          "serviceAccountName": dyn("builder"),
          "podTemplate": dyn({
            "automountServiceAccountToken": dyn(false),
            "nodeSelector": dyn({
              "chuggy.dev/node-role": "builder",
              "kubernetes.io/os": "linux",
              "kubernetes.io/arch": "amd64"
            }),
            "tolerations": dyn([
              {"key": "chuggy.dev/node-role", "operator": "Equal", "value": "builder", "effect": "NoSchedule"}
            ])
          })
        }
    - name: images
      expression: |-
        {"registry.chuggy-registry.svc.cluster.local:5000/chug-gy/web": "Dockerfile"}
    - name: params
      expression: >-
        has(object.spec.params) ? object.spec.params : []
  validations:
    - expression: object.apiVersion == "tekton.dev/v1"
      message: >-
        a run the image trigger creates is a tekton.dev/v1 TaskRun, and in
        another version what is held here goes by other names
    - expression: "!has(object.metadata.labels)"
      message: >-
        a run the image trigger creates carries no label, and a run's labels
        are its pod's labels
    - expression: "!has(object.metadata.annotations)"
      message: >-
        a run the image trigger creates carries no annotation, and a run's
        annotations are its pod's annotations
    - expression: object.spec.all(field, field == "params" || field in variables.spec)
      message: >-
        a run the image trigger creates sets nothing chug-gy-image-run.yaml does
        not, and a task, a step's overrides or a pod template of its own is a
        pod of its writer's choosing
    - expression: variables.spec.all(field, field in object.spec && object.spec[field] == variables.spec[field])
      message: >-
        a run the image trigger creates is of chug-gy-image-run.yaml's Task,
        within its time, and its pod runs where and as what that file says
    - expression: variables.params.map(param, param.name) == ["url", "commit", "image", "dockerfile"]
      message: >-
        a run the image trigger creates passes the parameters
        chug-gy-image-run.yaml passes, each once
    - expression: >-
        variables.params.exists(param, param.name == "image" && type(param.value) == string && param.value in variables.images)
        && variables.params.exists(param, param.name == "dockerfile" && type(param.value) == string
        && variables.params.exists(image, image.name == "image" && variables.images[string(image.value)] == param.value))
      message: >-
        a run the image trigger creates builds an image chug-gy-image-run.yaml
        names, from the Dockerfile it names for that image
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-trigger-creates-an-image-run
spec:
  policyName: image-trigger-creates-an-image-run
  validationActions: [Deny]
---
# WHAT A RUN IS FOR IS WHAT THE SOURCE HOLDS, as release-trigger.yaml's policy
# of the same shape argues: `url` is the address the source fetches, and
# `commit` the commit of the artifact it holds. A source that moved between
# the trigger's read and its create is refused here, and the next minute reads
# again.
#
# A SOURCE THAT IS NOT THERE REFUSES THE TRIGGER, NOT EVERYONE. The release
# policy's bindings say `parameterNotFoundAction: Deny`, and a release source
# that is gone then refuses every PipelineRun, which are the release's own. A
# TaskRun is every build's: a release run's own tasks are TaskRuns, and a
# `chug-gy` source that is gone must not hold a release. So the binding below
# says `Allow`, which skips this policy for a run created while the source is
# not there. The trigger creates none then, because it reads the source first
# and a read that fails is a failure; and the policy above still holds the
# run's shape, so what a token could start without a source is a build of the
# named image from the named Dockerfile at a commit of its choosing, which is
# an image under `chug-gy/` in `registry` and nothing a layer applies.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-trigger-builds-what-a-source-holds
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
  matchConstraints:
    resourceRules:
      - apiGroups: [tekton.dev]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [taskruns]
  matchConditions:
    - name: created-by-the-image-trigger
      expression: request.userInfo.username == "system:serviceaccount:chuggy-release-trigger:image-trigger"
  variables:
    - name: named
      expression: >-
        {"chug-gy": {"address": "url", "commit": "commit"}}[params.metadata.name]
  validations:
    - expression: >-
        has(params.status.artifact) && has(object.spec.params)
        && object.spec.params.exists(param, param.name == variables.named.address && param.value == params.spec.url)
        && object.spec.params.exists(param, param.name == variables.named.commit && type(param.value) == string
        && params.status.artifact.revision.endsWith("@sha1:" + param.value))
      messageExpression: >-
        "a run the image trigger creates is for the address and the commit GitRepository "
        + params.metadata.name + " holds"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-trigger-builds-what-chug-gy-holds
spec:
  policyName: image-trigger-builds-what-a-source-holds
  validationActions: [Deny]
  paramRef:
    name: chug-gy
    namespace: flux-system
    parameterNotFoundAction: Allow
---
# WHERE THE TRIGGER'S POD MAY GO: the cluster's DNS and the API server's port,
# as release-trigger.yaml's `release-trigger-egress` argues. The same rule
# again, selected by this trigger's label, because a policy's selector names
# one label and each trigger carries its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: image-trigger-egress
  namespace: chuggy-release-trigger
spec:
  podSelector:
    matchLabels: { app: image-trigger }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
      ports:
        - { protocol: TCP, port: 6443 }
---
# THE SITE'S IMAGE. Each minute, whether GitRepository `chug-gy` holds a
# commit the newest build of `chug-gy/web` did not build. Its timing is the
# release trigger's, for the reasons release-trigger.yaml gives of each value,
# and tests/release-pipeline.py holds the two to one timing.
#
# NOT SUSPENDED: each minute's Job starts a build where the source holds a
# commit the newest run did not build. Nobody is asked, and nothing is
# deployed: cluster/chug-gy/chug-gy.yaml names the image by digest, and a
# commit writing the digest this build reports is what deploys it.
#
# THE FIELD IS THE LAYER'S, and README.md's "The site's image" has the
# annotation that takes this object from the layer first, which is how the
# trigger is stopped.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chug-gy-image-trigger
  namespace: chuggy-release-trigger
  labels: { app: image-trigger }
spec:
  schedule: "* * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 45
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels: { app: image-trigger }
        spec:
          serviceAccountName: image-trigger
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 5
          nodeSelector:
            kubernetes.io/os: linux
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: trigger
              image: ghcr.io/fluxcd/flux-cli:v2.6.4@sha256:d6734ea180b0f5135e6a343482da1a669c526ef85525da53a6415c6a9f359861
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, /trigger/image-trigger.sh]
              env:
                # kubectl keeps a discovery cache under it.
                - { name: HOME, value: /tmp }
                - { name: SOURCES_NAMESPACE, value: flux-system }
                - { name: SOURCE, value: chug-gy }
                - { name: RUNS_NAMESPACE, value: chuggy-build }
                - { name: TASK, value: build-image }
                - { name: IMAGE, value: registry.chuggy-registry.svc.cluster.local:5000/chug-gy/web }
                - { name: RUN_MANIFEST, value: /trigger/chug-gy-image-run.yaml }
                - { name: RETRY_DELAY_SECONDS, value: "300" }
                - { name: KEEP_RUNS, value: "10" }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: trigger, mountPath: /trigger, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: trigger
              configMap:
                name: image-trigger
            - name: tmp
              emptyDir: {}
