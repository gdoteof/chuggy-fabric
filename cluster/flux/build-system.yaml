# Pinned Tekton, the namespace builds run in, and the release pipeline with its
# trigger.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: build-system
  namespace: flux-system
spec:
  interval: 5m
  path: ./cluster/build-system
  sourceRef:
    kind: GitRepository
    name: fabric
  prune: true
  wait: true
  timeout: 3m
