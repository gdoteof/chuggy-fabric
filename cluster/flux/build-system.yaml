# The pinned build controllers and the builder profile.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: build-system
  namespace: flux-system
spec:
  dependsOn:
    - name: build-prerequisites
  interval: 5m
  path: ./cluster/build-system
  sourceRef:
    kind: GitRepository
    name: fabric
  prune: true
  wait: true
  timeout: 3m
