# The first half of a chuggy release: a dump of the database, then its schema.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: chuggy-migrate
  namespace: flux-system
spec:
  # `apps` applies what the Job stands on: the namespace, PostgreSQL, the claim
  # the dump is written to and the policies that admit the pod. It also applies
  # everything else in cluster/apps/, and its `wait` holds all of it. So
  # anything `apps` reads as unhealthy -- a HelmRelease in `monitoring`, the
  # `sirdocalot` Kustomization it carries -- holds a release, whether or not
  # the release touches it.
  #
  # READY IS ALL IT WAITS FOR. `apps` reads git and this layer reads a release,
  # and across two sources kustomize-controller holds neither to the revision
  # the other applied. A commit to cluster/apps/ is applied on its own, minutes
  # before the release made with it and whether or not one follows; a release
  # is applied over whatever `apps` last applied. So a change there that the
  # running release cannot live under, or that the next one needs first, goes
  # in two commits: the one both releases run under, then the other.
  dependsOn:
    - name: apps
  interval: 5m
  # The overlay cluster/build-system/publish.sh writes into a release, over
  # the copy of cluster/chuggy-migrate/ beside it. This repository's own
  # directory names no release, and no layer applies it.
  path: ./release/chuggy-migrate
  sourceRef:
    kind: OCIRepository
    name: chuggy-release
  prune: true
  # A Job's pod template is immutable, and the Job is named for chuggy's commit
  # alone. A release that changes cluster/chuggy-migrate/ and not that commit
  # is an edit to the Job under a name that did not change: an apply the API
  # server rejects, and without this the layer stays failed on it. With it
  # kustomize-controller deletes the Job and creates it again, and the Job
  # runs again. A Job that failed and was not edited is not that case: nothing
  # is rejected, so nothing is created again.
  force: true
  # kstatus reads a Job as current once it has completed and as failed once it
  # has failed, so this layer is Ready only after the dump and the migration
  # both succeeded. `chuggy` depends on exactly that.
  wait: true
  # What one reconcile waits for the Job: the wait for PostgreSQL, the dump and
  # the migration. It bounds a hang and is not the Job's deadline -- a Job still
  # running when it elapses is left running, and the next reconcile waits on it
  # again.
  timeout: 30m
