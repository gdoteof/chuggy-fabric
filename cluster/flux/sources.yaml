# The sources that are declared by a commit, beside the layers: the two of a
# release, the one the site's image is built from, and the one the worker
# image is.
#
# HERE AND NOT IN A LAYER, because the root that applies this directory waits
# on nothing: a source with no artifact yet holds nothing else up. In a layer
# it would be that layer's health.
#
# `modules/flux.nix` generates the other two, `fabric` and `fabric-release`,
# because which repository a host follows is a host input.
---
# chuggy's `main`. No layer applies it: the release trigger reads the commit
# it holds, in cluster/build-system/trigger.sh. The repository is public, so
# it names no Secret.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: chuggy
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/kasofsk/chuggy.git
  ref:
    branch: main
---
# chuggy's `main`, less everything the worker image is not built from. No layer
# applies it: the worker image triggers read it, in
# cluster/build-system/worker-image-trigger.yaml, and build the worker and the
# runtime at the commit it holds when its digest has moved.
#
# THE DIGEST IS WHAT THEY COMPARE, NOT THE REVISION. `revision` is the commit
# and moves with every push to `main`; `digest` is the archive's, and the
# archive holds only what `ignore` leaves, written the same for the same bytes
# (source-controller zeroes the times and owners it records). So the digest
# moves when a byte of the worker's inputs does and not otherwise, which is
# when a worker is built.
#
# THE INPUTS ARE THE FILES images/worker/Dockerfile READS FROM THE CONTEXT:
# the directory images/worker/ (the Dockerfile, core.json which pins the core
# the runtime ships, core.sh), package-lock.json (the Playwright version the
# `worker` stage installs) and .claude/settings.json (the roster of practices
# the `worker` stage installs). The final stage also runs the whole tree's
# gates and keeps only their verdict, so a change elsewhere can turn that
# verdict red and does not change the image: a build that fails there is
# retried until the tree is green or the inputs move. A file the Dockerfile
# starts reading that is not listed here is a change this source does not see,
# and tests cannot see it: it lives in kasofsk/chuggy.
#
# `ignore` IS GITIGNORE SYNTAX, and what it excludes is excluded from the
# archive. Everything is excluded, then the three are put back. The repository
# is public, so it names no Secret.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: chuggy-worker
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/kasofsk/chuggy.git
  ref:
    branch: main
  ignore: |
    /*
    !/images
    /images/*
    !/images/worker
    !/package-lock.json
    !/.claude
    /.claude/*
    !/.claude/settings.json
---
# The site's `main`. No layer applies it either: the image trigger reads the
# commit it holds, in cluster/build-system/image-trigger.sh, and builds the
# site's image at it. Public, so it names no Secret.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: chug-gy
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/kasofsk/chug.gy.git
  ref:
    branch: main
---
# The releases cluster/build-system/publish.sh pushes, of which this holds the
# highest.
#
# `chuggy-migrate` and `chuggy` read it and no other layer does, and
# tests/flux-layers.py holds each to that.
#
# FAILING, IT IS NOT ASKED AGAIN AT ITS INTERVAL. `interval` is how often a
# source that is Ready looks again. One that failed -- the registry down, or
# holding no version -- is retried by source-controller after a delay that
# doubles with each failure, up to its `--max-retry-delay`, which
# cluster/flux-system/gotk-components.yaml leaves at the controller's default.
# So a release published while it is failing is read at the next retry and
# not within the interval; `flux reconcile source oci chuggy-release` asks at
# once.
#
# THE RANGE IS EVERY VERSION. Of the tags that are semantic versions it takes
# the highest; a tag that is not one, which a commit's own tag is not, is
# passed over. A release is pinned by a commit that adds `ref.digest`, which
# is read before `ref.semver`.
#
# `insecure` because the registry is plain HTTP, reached by its Service name:
# cluster/apps/release-registry.yaml, which this controller and the pipeline's
# `publish` step are the only pods admitted to.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: chuggy-release
  namespace: flux-system
spec:
  interval: 1m
  url: oci://release-registry.chuggy-registry.svc.cluster.local:5000/chuggy/release
  insecure: true
  ref:
    semver: "*"
