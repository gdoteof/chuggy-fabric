# The pinned certificate controller Shipwright requires.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: build-prerequisites
  namespace: flux-system
spec:
  interval: 5m
  path: ./cluster/build-prerequisites
  sourceRef:
    kind: GitRepository
    name: fabric
  prune: true
  wait: true
  timeout: 3m
