# What cluster/chug-gy/ declares: chuggy's public site, which no part of a
# chuggy release uses and which uses no part of one.
#
# READ FROM THE SITE'S OWN RELEASE, NOT FROM GIT. A run of the site pipeline
# publishes cluster/chug-gy as the fabric commit carries it, with an overlay
# under ./release/chug-gy that writes the image's digest in, and OCIRepository
# `chug-gy-release` holds the highest version published: so a push to the
# site's `main` reaches here with no commit to this repository, as a chuggy
# release does. cluster/build-system/site-pipeline.yaml and site-trigger.yaml
# argue the run and what starts it.
#
# A LAYER OF ITS OWN, AND NOTHING DEPENDS ON IT, for the reason
# track-record.yaml gives: in `apps` its health would be that layer's, and a
# site that did not come up would hold every chuggy release. Here it holds
# nothing, and tests/flux-layers.py refuses a layer that waits on it.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: chug-gy
  namespace: flux-system
spec:
  # NO `dependsOn`: its namespace is its own, and Traefik, its IngressClass
  # and the `local-path` StorageClass are k3s's. What it takes from `apps` is
  # the registry its image is pulled through, and a pod that finds the
  # registry down retries the pull itself.
  interval: 5m
  path: ./release/chug-gy
  sourceRef:
    kind: OCIRepository
    name: chug-gy-release
  # No `deletionPolicy: Orphan`: the one claim here holds requests for an
  # invite, which are read and answered as they arrive, so deleting the layer
  # deleting its claim costs nothing a person has not already seen.
  prune: true
  wait: true
  timeout: 3m
