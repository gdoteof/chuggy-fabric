# The immutable build requests materialized from release handoffs.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: builds
  namespace: flux-system
spec:
  dependsOn:
    - name: build-system
  interval: 5m
  path: ./builds
  sourceRef:
    kind: GitRepository
    name: fabric
  prune: true
  wait: true
  # Health timeout for a materialized BuildRun.
  timeout: 75m
  # A BuildRun is current only when it succeeded, built the commit its
  # `fabric.chuggy.dev/source-commit` annotation pins and reported a well-formed
  # image digest. A success missing either is failed, not in progress.
  healthCheckExprs:
    - apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      inProgress: >-
        !has(status.conditions) ||
        status.conditions.filter(e, e.type == 'Succeeded').all(e, e.status == 'Unknown')
      failed: >-
        has(status.conditions) &&
        (status.conditions.filter(e, e.type == 'Succeeded').exists(e, e.status == 'False') ||
        (status.conditions.filter(e, e.type == 'Succeeded').exists(e, e.status == 'True') &&
        (!has(status.source) || !has(status.source.git) ||
        status.source.git.commitSha != metadata.annotations['fabric.chuggy.dev/source-commit'] ||
        !has(status.output) || !has(status.output.digest) ||
        !status.output.digest.matches('^sha256:[0-9a-f]{64}$'))))
      current: >-
        has(status.conditions) &&
        status.conditions.filter(e, e.type == 'Succeeded').exists(e, e.status == 'True') &&
        has(status.source) && has(status.source.git) &&
        status.source.git.commitSha == metadata.annotations['fabric.chuggy.dev/source-commit'] &&
        has(status.output) && has(status.output.digest) &&
        status.output.digest.matches('^sha256:[0-9a-f]{64}$')
