# What makes the cluster reconcile itself.
#
# gotk-components.yaml installs the controllers; this points them at a repo.
# Both are dropped into k3s's auto-deploy directory by modules/flux.nix, so a
# fresh box installs Flux and starts syncing without anyone running kubectl.
#
# The repo is public, which is why there is no secretRef here. That is the whole
# reason bootstrap is this short -- a private repo would need a deploy key on
# every box before Flux could read anything.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fabric
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/gdoteof/chuggy-fabric.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  # This path carries its own kustomization.yaml, which it did not need until a
  # generated ConfigMap had to be named after its content. That file enumerates
  # every manifest, so a file added to the directory and not to it is one this
  # Kustomization stops applying -- and `prune` below then deletes it.
  path: ./cluster/apps
  sourceRef:
    kind: GitRepository
    name: fabric
  # Deleting a file deletes the resource. Without this, removals in git are
  # silently ignored and the cluster accumulates things nobody declared.
  prune: true
  wait: true
  timeout: 3m
