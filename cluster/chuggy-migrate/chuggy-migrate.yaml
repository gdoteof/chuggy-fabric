# The schema, applied by the one command in kasofsk/chuggy that applies it.
#
# `src/roots/migrate.ts` plans the ledger already in the database against the
# one this image declares and refuses to touch a database that is not a prefix
# of it. Nothing else in that tree applies the schema, and nothing in this
# repository knows what the schema is -- which is the point: the image carries
# its own migrations and this file only says which database and as whom.
#
# AND BEFORE IT, A DUMP. The pod below takes one of the database it is about to
# change and migrates only if it could: `dump`, further down, and dump.sh.
#
# THIS COMMAND DOES NOT EXIST BEFORE kasofsk/chuggy#242. The image tag below
# must be built from a commit that carries it; a tag that does not has no
# `src/roots/migrate.ts` and the container exits on a module that is not there.
#
# ------------------------------------------------------------ the ordering ----
#
# THE SERVICES WAIT FOR THIS JOB. `cluster/flux/` declares three layers over one
# source: `apps`, then `chuggy-migrate`, which applies this directory, then
# `chuggy`, which applies the services of a release. Each depends on the one
# before and waits for what it applied to be healthy, so the services of a
# release are applied only once this Job has completed for that release. Inside
# the pod the order is the kubelet's: the wait for PostgreSQL, the dump, the
# migration, each started only when the one before it exited 0.
#
# WHEN THE DUMP OR THE MIGRATION FAILS, THE SERVICES STAY AS THEY WERE. `chuggy`
# applies nothing while `chuggy-migrate` is not Ready, so every Deployment keeps
# the pods and the image it had. Nothing restores the dump either: it is kept
# for a person to restore from.
#
# WHEN THE MIGRATION SUCCEEDS, THE RELEASE BEFORE THIS ONE RUNS ON ITS SCHEMA
# FOR A WHILE. The pods `chuggy` has not rolled yet are the previous release's,
# and from this Job's commit until that roll they run against the schema this
# release declares. Nothing here holds a migration to being one they can run
# on.
#
# THE PROCESSES ASSERT THE SCHEMA TOO, AND THAT IS NOT WHAT ORDERS THEM. Every
# command asserts `schema-compatible` before it serves -- the applied ledger
# against the contract its own image declares -- and reports a mismatch as
# could-not-run. That makes any order CORRECT: a pod started ahead of its schema
# exits rather than serves. It does not make any order AVAILABLE. A Deployment
# whose strategy is `Recreate` has stopped the pods of the release before by the
# time the new ones find their schema missing, and a migration that never
# commits leaves it with none. The layers are what keep the old pods running
# until the migration has succeeded.
#
# WHAT THE ORDER COSTS is that each of the three can hold a release alone.
# While `apps` is not Ready -- over any object it applies, which is everything
# in cluster/apps/ -- this Job is not applied. While this Job is failed, no
# change to the services is applied, one that is not a release included.
# cluster/flux/chuggy-migrate.yaml and cluster/flux/chuggy.yaml say so where
# each dependency is declared.
#
# ----------------------------------------------- the name tracks the template ----
#
# A Job's pod template is immutable, so the API server rejects an apply that
# changes it under a name that did not change. A release does not meet that:
# the name changes with the release or its image transport, so Flux creates a
# new object and prunes the old one in the same pass. An edit that is not a
# release does meet it -- an edit to this file, or to dump.sh, whose ConfigMap
# is named by a hash of its content that the volume below follows -- and for
# that cluster/flux/chuggy-migrate.yaml sets `force`: kustomize-controller
# deletes the Job and creates it again. EITHER WAY THE JOB RUNS AGAIN, the dump
# first. A migration with nothing pending applies nothing and says so; a dump
# is another pair of files on the volume.
#
# It also makes the run visible. `kubectl -n chuggy get jobs` names the exact
# image whose schema this database was last brought to.
#
# NO `ttlSecondsAfterFinished`. A completed Job that deletes itself is one Flux
# re-creates on its next reconcile, so the migration would run every five
# minutes forever. It is idempotent -- a second run applies nothing and says so
# -- but a rerun loop is not what an idempotent command is for.
#
# WHICH MAKES A FAILED JOB TERMINAL, AND THAT NEEDS A HUMAN. The two properties
# above are for a CHANGED Job. When nothing about it changes and the run
# exhausts `backoffLimit` below -- which at 0 is its single pod failing, in the
# dump or in the migration -- this object is `Failed` and stays that way: Flux
# re-applies a byte-identical Job every five minutes, the API server accepts it
# as unchanged, `force` has nothing rejected to act on, and NOTHING RUNS AGAIN.
# There is no self-healing path.
#
# THE KUSTOMIZATION DOES NOT STAY GREEN, AND SAYING IT DID WOULD COST THE ONE
# SIGNAL THERE IS. The `chuggy-migrate` Kustomization sets `wait: true`, which
# `cluster/flux/chuggy-migrate.yaml` declares, and which health-checks every
# object this directory applies with kstatus, and kstatus reads a Job carrying
# `Failed=True` as failed rather than as merely finished. So `chuggy-migrate`
# goes `Ready=False` with this Job in its message, `chuggy` behind it reads
# `DependencyNotReady`, and both stay there until a human clears it.
#
# NO OTHER WORKLOAD IS IN THAT SIGNAL, AND NOTHING CARRIES IT ANYWHERE. This
# directory applies the Job and the script it mounts and nothing else, so a
# Deployment that never becomes available holds `chuggy` red and not this
# layer. But Alertmanager is off and notification-controller is not installed,
# so it is read by looking.
#
# The recovery is to read the pod, fix the cause, and delete the Job so the
# next reconcile builds it afresh:
#
#   kubectl -n chuggy logs job/chuggy-migrate-<release> -c dump
#   kubectl -n chuggy logs job/chuggy-migrate-<release> -c migrate
#   kubectl -n chuggy delete job chuggy-migrate-<release>
#
# NOTHING HAS PUT THIS RIG IN THAT STATE. It is a possibility argued from the
# mechanism, not something observed, and it is worth saying which because the
# obvious argument for it is wrong: a database BEHIND the ledger this image
# declares is the case that SUCCEEDS. A ledger that is a prefix of what the
# image declares means the run applies the difference and exits 0, and that is
# the case this rig is in: its ledger is at 18 and the tag below declares 19, so
# this Job applies migration 19 -- the requirement columns migrations 12 and 15
# gained after this database ran them -- and exits 0.
#
# THE FAILURE MODE THAT MATTERS IS NEITHER OF THOSE. Everything above is about a
# Job that fails. The one worth this much text is a Job that SUCCEEDS while
# applying nothing, and leaves no state in Kubernetes that is wrong afterwards
# for anyone to find.
#
# Migration 17 of the image below is
# `GRANT EXECUTE ON FUNCTION project_capacity_account(text,text) TO chuggy_api`.
# That function is owned by `chuggy_boundary_owner`, and it is issued by
# `chuggy_owner`, the role this Job connects as. Where `chuggy_owner` is not a
# member of the owning role, that is a GRANT by a role holding no grant option
# on the object. PostgreSQL answers that in one of two ways, and WHICH ONE
# decides whether anybody ever hears about it:
#
#   ERROR    if the granting role holds NO privilege on the object at all.
#            The statement raises, the runner's single transaction rolls back,
#            and `migrate.ts` exits 1 having applied nothing.
#
#   WARNING  `no privileges were granted`, if it holds ANY privilege -- and
#            INHERITED privilege counts. The statement SUCCEEDS having granted
#            nothing, and everything after it commits.
#
# A DATABASE WITHOUT THAT MEMBERSHIP IS ON THE WARNING BRANCH, by a route that
# is easy to miss. `chuggy_owner` appears nowhere in the function's ACL, which
# names only `chuggy_boundary_owner` and `chuggy_ticket_service`. But
# `chuggy_owner` IS a member of `chuggy_ticket_service`, so it inherits EXECUTE,
# so it holds a privilege, so the check is satisfied. `has_function_privilege`
# on that role for EXECUTE is true while the same call `WITH GRANT OPTION` is
# false: that pair is the discriminator, and it is the query to run before
# assuming which branch any particular statement is on.
#
# Membership in every service group is deliberate -- `postgres-roles.sql` has a
# section headed "WHY chuggy_owner IS A MEMBER OF EVERY GROUP" -- so a correctly
# provisioned database is on the warning branch by construction. The loud branch
# is the accident, not the rule.
#
# THEN THE RUN EXITS 0 AND THE JOB IS `Complete`, the ledger advances, the grant
# does not land, and the API's selector-context reads fail at runtime with
# `permission denied for function project_capacity_account` -- a failure with no
# signal at the layer that caused it.
#
# AND DELETING THE JOB DOES NOT FIX IT. That is the property that makes this
# worth this much text. The ledger row committed, so the applied ledger is still
# a prefix of what this image declares, so a re-run has nothing pending and
# applies nothing. The recovery above is the recovery for a FAILED migration;
# this one has no recovery inside Kubernetes at all. It takes
# `GRANT chuggy_boundary_owner TO chuggy_owner` and then a statement that
# re-issues migration 17's grant by hand, because no migration will do it again.
#
# THIS RIG IS PAST THAT BRANCH, because prerequisite 1 was run here:
# `chuggy_owner` is a member of `chuggy_boundary_owner`, `WITH GRANT OPTION` on
# that function is true for it, and the function's ACL carries
# `chuggy_api=X/chuggy_boundary_owner`.
#
# THE ORDERING IS THEREFORE A PREREQUISITE AND NOT A NOTE.
# `deploy/rig/postgres/postgres-roles.sql` is where that membership grant is
# issued -- in a copy of the file that carries it, which not every commit on
# kasofsk/chuggy#242 does; the README's prerequisite 1 pre-filters the checkout
# for it rather than trusting a commit id and then reads `pg_auth_members` to
# see that it landed, and the selected release image carries it. It has to
# be run BEFORE this Job ever does -- once the Job has committed a ledger row for 17, running
# the roles file afterwards leaves the grant missing and the ledger claiming
# otherwise. Nothing here can express that: this object is applied on the first
# reconcile after the tag lands, and the roles file is run by a human against
# the server. The README's "Before any of it runs" is where it lives, because
# there is nowhere else it could.
#
# An image that is simply absent from the registry does NOT land here. That pod
# sits in `ImagePullBackOff` and the Job stays `Active`, so publishing the image
# is enough and nothing needs deleting. THAT AND THE ABSENT
# `activeDeadlineSeconds` ARE ONE DECISION, not two: a deadline ends a Job by
# the wall clock whatever its pod is doing, so it would turn that wait into the
# terminal `Failed` state above for a cause a `ctr images import` clears on its
# own. What it costs is that a migration wedged on a lock waits forever, which
# is the trade a single-node rig with one operator can make.
#
# WHILE IT WAITS, THE SERVICES ARE HELD AS THEY ARE FOR A FAILURE. A Job that
# is still `Active` has not completed, so each reconcile of `chuggy-migrate`
# gives up at that layer's `timeout` and the next one waits again, and `chuggy`
# applies nothing until one of them sees the Job complete.
#
# THE WAIT FOR THE DATABASE IS BOUNDED ALL THE SAME, and does not cost that
# trade back. Its clock starts when the initContainer starts, so it cannot run
# while a pod is still waiting for its image; the argument is beside the
# container that carries it.
#
# ----------------------------------------------------------- the credential ----
#
# `chuggy_owner`, and no `role=` option: it is a login role in its own right and
# it is the role that owns the relations. Every other workload in this namespace
# connects as a login role and then becomes a group; this one is the exception,
# and it is the exception because a migration must own what it creates.
#
# It holds CREATEROLE, which is what lets the migration create its own group
# roles. That is not superuser, and kasofsk/chuggy's `deploy/rig/postgres/postgres-roles.sql`
# carries the argument for why the difference is load-bearing.
#
# THE POD HOLDS A SECOND CREDENTIAL, AND THAT ONE IS THE SUPERUSER'S. `dump`
# connects as `postgres`, for the reason dump.sh gives. The password is in that
# container's environment and no other's, and `tests/rollout-order.py` holds
# that across everything this repository renders.
#
# OWNING THE RELATIONS IS NOT ENOUGH ON ITS OWN. Part of what the schema
# declares is owned by `chuggy_boundary_owner` rather than by this role -- that
# is the separation the boundary functions exist for -- so a migration statement
# that grants on one of them is granting on an object this credential neither
# owns nor holds grant option for. What makes those statements legal is
# MEMBERSHIP in that role, which the roles file grants and which this Job cannot
# grant itself. A database rolled out before the file carried it is the silent
# failure argued above -- the one that reports success.
#
# The database is `chuggy`, which every object in this namespace that holds a
# chuggy role names. The one it must never be is `chuggy_suite_fixtures`, which
# cluster/chuggy/chuggy-api.yaml describes: its ledger stops at 2, and 2 is a
# valid prefix of this Job's, so nothing here would refuse it -- the Job would
# apply 3 upward to the fixtures and fail partway through on the rows that
# stopped it.
---
apiVersion: batch/v1
kind: Job
metadata:
  # The suffix changes whenever the immutable pod template's release transport does.
  name: chuggy-migrate-c9e35a22-registry
  namespace: chuggy
  annotations:
    fabric.chuggy.dev/source-commit: c9e35a22
  labels: { app: chuggy-migrate }
spec:
  # ONE ATTEMPT, because retrying this JOB was never what could survive the race
  # it used to be budgeted for. This Job's pod is a newly labelled
  # `chuggy.dev/postgres-client` pod, and cluster/chuggy/chuggy-api.yaml records
  # that such a pod's first connection loses a race with the policy controller
  # and arrives as `ECONNREFUSED`. A budget answers that only if a later attempt
  # is better placed than the first, and none is: kube-router admits a POD IP,
  # and `restartPolicy: Never` means a losing attempt is REPLACED by a new pod
  # whose IP is as new as the first one's was. Every attempt draws the same hand
  # at the same moment of its own pod's life, so the delay between them buys
  # nothing.
  #
  # MEASURED HERE, against `postgres-admits-labelled-clients` as this rig runs
  # it today. A Job whose container connects once and exits produced five
  # consecutive pods with five distinct IPs, over 2m42s, every one refused, and
  # the Job ended `Failed`. A pod that instead asked again inside the same
  # sandbox was admitted on its second attempt, two seconds in. The retry UNIT
  # was wrong and not the count, which is what the initContainer below fixes.
  #
  # WITH THE WAIT IN THE POD, NOTHING IS LEFT FOR A RETRY TO FIX. A pod that
  # gets past the wait and then fails, fails for a reason a second pod meets
  # identically -- a lock it cannot take, a statement the schema refuses, a
  # ledger this image is behind. A pod that does not get past the wait is
  # looking at a database that is genuinely down, and a second pod would spend
  # the same bound discovering it again. So: one pod to read, and the terminal
  # `Failed` state above reached in about a minute rather than five.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: chuggy-migrate
        # postgres-network-policy.yaml admits this label and this namespace and
        # nothing else. Without it the connection is refused by the policy and
        # the migration reports a database that is down.
        chuggy.dev/postgres-client: "true"
    spec:
      # A pod that fails is kept and a new one is made, so the failure is still
      # there to read. `OnFailure` would restart the container in place and
      # overwrite the log of the attempt that explained itself.
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # THE WAIT THE RETRY BUDGET COULD NOT BE. What kube-router admits is
        # this pod's IP, and it needs a few seconds after that IP appears; a
        # container that keeps asking keeps the IP it is admitted for and gets
        # in. That is the same reason chuggy-api recovers on a kubelet RESTART
        # -- same sandbox, same address -- and the reason a replacement Job pod
        # never could. So the wait belongs here: same pod, same IP, and finished
        # before the migration opens anything.
        #
        # `postgres:18.3-trixie` because the control-plane image is node and
        # carries nothing that can ask -- no `pg_isready`, no `psql`, no `nc`.
        # It is the tag postgres.yaml already runs, so the node holds it for the
        # same reason it holds the server, and it is NOT one of the release lines
        # a re-pin moves.
        #
        # DNS and 5432 are the whole of what this needs, which is what
        # chuggy-control-plane-network-policy.yaml's `chuggy-migrate-egress`
        # permits. The wait adds no destination that rule does not already
        # allow.
        #
        # `-U` IS REQUIRED AND IS NOT A CREDENTIAL. `pg_isready` sends a startup
        # packet and never authenticates, but libpq will not assemble a conninfo
        # without a user name and `runAsUser: 1000` has no passwd entry to take
        # one from. Without it every attempt exits 3, `no attempt`, and the wait
        # would never succeed however long it were given -- a wait that cannot
        # end well is worse than no wait, so this is the part to keep true.
        #
        # BOUNDED, AND THE BOUND IS NOT `activeDeadlineSeconds`. Thirty attempts
        # and then a non-zero exit, so a database that is genuinely down ends as
        # a failed Job rather than as a Job that hangs. That does not reopen the
        # deadline argued against above, because the two clocks start in
        # different places: a deadline runs from the moment the Job is CREATED
        # and so runs through `ImagePullBackOff`, which is exactly the wait that
        # must be allowed to outlast it; this one cannot start until the image
        # is on the node and the container is running.
        - name: wait-for-postgres
          image: postgres:18.3-trixie
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 30); do
                pg_isready -h postgres.chuggy.svc.cluster.local -U chuggy_owner -t 2 && exit 0
                sleep 2
              done
              exit 1
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
        # THE DUMP, AND THE MIGRATION DOES NOT START WITHOUT IT. An initContainer
        # that exits non-zero fails the pod before `migrate` is created, so a
        # dump that could not be taken or read back is a migration that did not
        # run. dump.sh is the whole of what it does and states its own rules;
        # kustomization.yaml generates the ConfigMap it is mounted from.
        #
        # AFTER THE WAIT, for the wait's own reason: by then this pod's IP is
        # admitted, and this container is the same pod. It opens nothing the
        # wait did not -- DNS and 5432 on the server, which is what
        # `chuggy-migrate-egress` permits and what `postgres-admits-labelled-clients`
        # admits this pod's label for.
        #
        # THE SUPERUSER, IN THIS CONTAINER AND NO OTHER. dump.sh argues why the
        # dump needs it. The migration does not, and holds `chuggy_owner` for
        # the reason given above, so the Secret is in this container's
        # environment and must stay out of the pod's and out of `migrate`'s.
        #
        # THE SAME IMAGE AS THE WAIT, and here its version is load-bearing:
        # `pg_dump` refuses a server newer than itself, and this is the tag
        # postgres.yaml runs the server from.
        #
        # WHAT IT WRITES IS AS OF ITS OWN START. The services are still running
        # the release before this one and still writing, so a restore from this
        # dump is without whatever they wrote after it began.
        - name: dump
          image: postgres:18.3-trixie
          imagePullPolicy: IfNotPresent
          command: [bash, /etc/chuggy-migrate/dump.sh]
          env:
            - name: PGHOST
              value: postgres.chuggy.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-superuser, key: password }
            - name: CHUG_DUMP_DIR
              value: /dumps
            # How many dumps the volume holds once this one is written.
            - name: CHUG_DUMP_KEEP
              value: "30"
            # The Job controller labels the pod with the Job's name, and the
            # files are named for it: a dump says which release took it.
            - name: CHUG_DUMP_JOB
              valueFrom:
                fieldRef: { fieldPath: "metadata.labels['job-name']" }
          volumeMounts:
            - { name: dumps, mountPath: /dumps }
            - { name: dump-script, mountPath: /etc/chuggy-migrate, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: registry.chuggy.internal/chuggy/api@sha256:efe95d1170a2669b9b91683ffa5dcf8da3bc4343aa83176a428e68719c24c307
          imagePullPolicy: IfNotPresent
          # Exec form with node as PID 1, for the reason the image's Dockerfile
          # gives: the process is handed SIGTERM itself rather than through a
          # shell that would swallow it. `npm run` would be that shell.
          command:
            [
              node,
              --experimental-strip-types,
              src/roots/migrate.ts,
            ]
          env:
            # Defined before the URL that expands it, which is the ordering
            # Kubernetes resolves `$(...)` in.
            - name: CHUG_PG_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  { name: chuggy-postgres-credentials, key: owner-password }
            - name: CHUG_MIGRATE_DATABASE_URL
              value: postgres://chuggy_owner:$(CHUG_PG_OWNER_PASSWORD)@postgres.chuggy.svc.cluster.local:5432/chuggy
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
      # A statement that rewrites a table can outlast a short budget, and the
      # command's own statement timeout is longer than this by default. Killing
      # the pod mid-transaction does not corrupt anything -- PostgreSQL rolls
      # the transaction back -- but it loses the report of what was applied.
      terminationGracePeriodSeconds: 120
      volumes:
        # chuggy-dumps.yaml declares the claim and argues the volume under it.
        # The directory is the host's, owned by the uid this pod runs as and
        # closed to every other, which is why this pod sets NO `fsGroup`: with
        # one the kubelet would hand the directory to that group and widen the
        # mode `chuggy.state.dumps` set.
        - name: dumps
          persistentVolumeClaim: { claimName: chuggy-dumps }
        - name: dump-script
          configMap: { name: chuggy-dump-script }
