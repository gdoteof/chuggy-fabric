# The ticket service: the single journaled actor that drives a project's
# tickets through authoring, work, evaluation and completion.
#
# One responsibility, one pod, one command out of the shared image, one database
# role. The five files beside this one -- selector, scheduler, finalizer,
# worker plane, and the API -- are the same arrangement with a different command
# and role, and the parts they share are argued here rather than six times.
#
# ------------------------------------------------------- the shared image ----
#
# The retained API image copies the whole of `src/` and sets a default CMD
# of the API root alone, so it already contains every control-plane command.
# The name is the only thing that is still API-specific, and correcting it is
# kasofsk/chuggy's work -- revised PR 2 of kasofsk/chuggy#197 renames it to the
# control-plane image. Nothing in this repository can rename an image somebody
# else builds, so every workload here selects its command from the image under
# the name it has.
#
# SEVEN `image:` LINES CARRY THE DIGEST AND THEY MOVE TOGETHER: this, the selector,
# the scheduler, the finalizer, the worker plane, the migration Job and
# chuggy-api.yaml. A bump
# that misses one runs a mixed control plane against one database. What catches
# the shape of that which matters is the `schema-compatible` precondition -- a
# process whose image declares a different ledger than the database carries
# refuses to serve -- and what it does not catch is a bump that changed no
# schema. The release-images check requires all seven references to agree.
#
# RE-PINNING TOUCHES MORE THAN THOSE SEVEN. The migration Job's `metadata.name`
# repeats the tag, for the reason chuggy-migrate.yaml gives, and three comments
# name it in prose -- one in chuggy-migrate.yaml, one in chuggy-api.yaml, one in
# the README's prerequisite 1. Ten occurrences over seven files. The prose
# ones break nothing when they go stale; they instead leave the repository
# asserting a commit that is no longer the one running.
#
# k3s maps the logical registry name to retained cluster storage;
# chuggy-api.yaml carries that argument and it is not repeated.
#
# THE TAG BELOW MUST CARRY `src/roots/migrate.ts`, which arrives on
# kasofsk/chuggy#242 and is what applies the schema these pods then serve --
# and it must be one whose checkout also carries the two membership grants the
# README's prerequisite 1 pre-filters for, because part of that branch does not.
# The login roles those pods present are already on this rig, and so are those
# two memberships: the roles file has been re-run here.
#
# --------------------------------------------------- the credential, again ----
#
# `chuggy_ticket_service` is NOLOGIN. The pod authenticates as
# `chuggy_ticket_service_login` and becomes the group through
# `?options=-c%20role%3Dchuggy_ticket_service`, and the command asserts at
# start-up that `current_user` is exactly that group. chuggy-api.yaml explains
# why the option is in the manifest and not in the Secret; the same reasoning
# applies here and to every workload in this namespace.
#
# THE URL IS INSIDE A JSON DOCUMENT HERE, which the API's is not, because this
# command reads its whole configuration from one variable. Kubernetes expands
# `$(NAME)` anywhere in an env value, JSON included, so the password still
# arrives from the Secret and the shape of the connection is still public.
#
# A PASSWORD LANDS INSIDE A URL INSIDE A JSON STRING, AND EACH LAYER HAS ITS OWN
# FORBIDDEN SET. Written outwards, which is the order the value is read in and
# the order the failures arrive in:
#
#   `"` and `\` break the JSON first, and break it loudly -- the parse refuses
#   the document and the diagnostic points at this manifest.
#
#   `@`, `/`, `?`, `#`, `[` and `]` end the userinfo early, so the connection
#   goes somewhere else, or nowhere, with an error naming neither this file nor
#   the password.
#
#   `%` is the quiet one. `pg-connection-string` percent-decodes the userinfo,
#   so `%41` authenticates as a string the Secret does not hold and the server
#   only says the password is wrong, while `%zz` throws `URI malformed` from a
#   stack with nothing about a credential in it.
#
#   `$` never reaches any of them: the kubelet expands `$(NAME)` in this value,
#   so a `$(` inside a password is substituted or left verbatim by the same rule
#   that puts the password here at all.
#
# The generator is the machine layer's and hex is what it emits, which satisfies
# every line above at once. This is the constraint that rests on that, and it is
# stated here because no check enforces it. THE SAME CONSTRAINT BINDS EVERY
# VALUE THAT ARRIVES THIS WAY, credential or not: chuggy-selector.yaml expands
# two hand-written bearer tokens into a JSON document exactly like this one.
#
# ------------------------------------------------------ the configuration ----
#
# EVERY BOUND THIS OMITS IS ONE THE PROCESS OWNS THE DEFAULT FOR. The command's
# schema makes its `ticket` block optional precisely so a deployment that has no
# opinion does not restate one, and a restated default is a second copy that
# drifts. What is written below is what the schema requires and nothing else.
#
# `domain` is the exception, because it is required and has no default: these
# are the constants the deciders are instantiated with, and they bound the
# universe a release may draw from. They are sized for a rig that dogfoods one
# repository, not offered as a recommendation -- what a configuration is proved
# at lives in kasofsk/chuggy's `model/`, and nothing here proves anything about
# these.
#
# CONFIGURATION LIVES IN THE POD TEMPLATE AND NOT IN A ConfigMap. A change to
# any value below changes the template, and changing the template is what makes
# Kubernetes replace the pod. That is gdoteof/chuggy-fabric#7 answered by
# construction for this workload: there is no mounted file that can change
# under a process that read it once. cluster/apps/kustomization.yaml is the
# other half of that answer, for the two workloads that do need files.
#
# ------------------------------------------------------ what has no probe ----
#
# NOTHING HERE ANSWERS A HEALTH REQUEST, AND THAT IS A REAL GAP. This command
# runs a loop; it opens no listener, so there is no port for a kubelet to ask.
# What it does instead is leave: an unmet precondition exits 3, a runtime
# failure exits 1, a configuration it cannot parse exits 2, and each of those
# is a CrashLoopBackOff with the reason on stderr.
#
# So a process that is *wedged* -- alive, connected, and making no progress --
# is invisible to Kubernetes here, and no restart will come. Closing that needs
# a health listener in kasofsk/chuggy's service runtime, which is that tree's
# change and not a probe this file could add. Until then the signal is the log
# and the rows the pass writes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # The namespace is declared in dev2-access.yaml, which owns it.
  name: chuggy-ticket-service
  namespace: chuggy
  annotations:
    fabric.chuggy.dev/source-commit: 6911fe1
  labels: { app: chuggy-ticket-service }
spec:
  replicas: 1
  # Recreate, not the rolling default. There is no traffic to keep serving
  # while a new pod warms up -- this workload answers nothing -- so a rollout
  # that briefly runs two of them buys nothing and costs a second pool of
  # connections against a database sized for this rig.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: chuggy-ticket-service }
  template:
    metadata:
      labels:
        app: chuggy-ticket-service
        # What postgres-network-policy.yaml admits, together with this
        # namespace. Drop this label and every connection is refused with
        # nothing anywhere to say the label is why.
        #
        # EXPECT `RESTARTS 1` ON EVERY ROLLOUT: that file documents the race
        # between a new pod and the policy controller, and it is not a fault.
        chuggy.dev/postgres-client: "true"
    spec:
      # This process calls no Kubernetes API. The scheduler is the only
      # workload in this namespace that does.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numeric, because runAsNonRoot is checked against a number and the
        # kubelet cannot tell that the image's `node` user is not root.
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: ticket-service
          image: registry.chuggy.internal/chuggy/api@sha256:e25c115206301ce27bc6998efb4fb6e430d267f5c0063d5c7382337d0ff0f878
          imagePullPolicy: IfNotPresent
          command:
            [
              node,
              --experimental-strip-types,
              src/roots/ticketService.ts,
            ]
          env:
            - name: CHUG_TICKET_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {
                    name: chuggy-postgres-credentials,
                    key: ticket-service-password,
                  }
            # The lease holder's name. Taken from the pod rather than written
            # here so that two live processes can never claim one project under
            # one identity -- which is what a fixed string would allow during
            # any rollout that overlapped, and what a lease exists to prevent.
            - name: CHUG_POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: CHUG_TICKET_SERVICE_CONFIG
              value: |
                {
                  "database": {
                    "url": "postgres://chuggy_ticket_service_login:$(CHUG_TICKET_SERVICE_PASSWORD)@postgres.chuggy.svc.cluster.local:5432/chuggy?options=-c%20role%3Dchuggy_ticket_service"
                  },
                  "runtime": {
                    "idleIntervalMilliseconds": 1000,
                    "shutdownDrainMilliseconds": 15000
                  },
                  "pass": {
                    "projectsPerPassMax": 8,
                    "projectLeaseSeconds": 30
                  },
                  "domain": {
                    "nTickets": 64,
                    "nTasks": 8,
                    "reworkPolicy": { "type": "BudgetedRework", "value": 2 },
                    "gas": 1000,
                    "finalizationPricing": "DeadlineOnly",
                    "maxStages": 4
                  },
                  "owner": "$(CHUG_POD_NAME)",
                  "source": {
                    "scratchDirectory": "/var/lib/chuggy/git",
                    "identity": {
                      "name": "chuggy ticket service",
                      "email": "ticket-service@chuggy.vteng.io"
                    },
                    "environment": {
                      "HOME": "/var/lib/chuggy/git",
                      "TMPDIR": "/var/lib/chuggy/git"
                    },
                    "sources": [
                      {
                        "repository": "http://git.chuggy-git.svc.cluster.local./chuggy.git",
                        "path": "/var/run/chuggy/repository-credentials/chuggy-git"
                      }
                    ],
                    "credentialUsername": "chuggy"
                  }
                }
          volumeMounts:
            - name: git-scratch
              mountPath: /var/lib/chuggy/git
            - name: repository-credentials
              mountPath: /var/run/chuggy/repository-credentials
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            # Nothing here writes a file. The command holds a pool and a loop.
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
      # Longer than the drain above, which is what it is for: SIGTERM starts a
      # drain bounded by `shutdownDrainMilliseconds`, and this is what keeps the
      # kubelet from killing the process in the middle of one. A drain that
      # expires is reported as a failure by the command itself.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: git-scratch
          emptyDir: {}
        - name: repository-credentials
          secret:
            secretName: chuggy-git-sync
            defaultMode: 0444
            items:
              - key: password
                path: chuggy-git
