# The network boundary around the three unauthenticated administrative APIs,
# declared for the reason postgres-network-policy.yaml is declared: without it
# any pod on the cluster may create an identity, mint a session for it, register
# an OAuth2 client, or make itself an administrator of every project, and
# nothing would report that as a failure.
#
# One policy and not three. Ingress only, and the same set of pods either way,
# so there is one question here and one object to answer it.
#
# NO EGRESS RULE. Naming Egress would mean enumerating DNS, PostgreSQL and the
# edge, and none of these is a service whose outbound reach is the worry --
# what makes the administrative ports dangerous is who may call IN. Adding an
# egress rule later is a change to this object, not a second one.
#
# WHAT SELECTING A POD DOES NOT BOUND. Every exemption recorded in
# postgres-network-policy.yaml applies here unchanged and for the same reasons:
# `kubectl exec` and `kubectl port-forward` never touch the pod network, and
# k3s's kube-router accepts node-local sources ahead of the policy chain, so
# the node and every host-network pod on it reach these ports whatever they are
# labelled.
#
# THE THIRD OF THOSE IS BOUNDED BY ADMISSION, NOT BY ANYTHING HERE. A pod is
# host-network because a field says so, and who may set that field is what
# `pod-security.kubernetes.io/enforce` decides. Without a baseline label on the
# namespace a caller creates pods in, `create pods` -- which ClusterRole `edit`
# carries -- is one field away from the node-local ACCEPT and therefore past
# every rule below. cluster/apps/dev2-access.yaml labels `chuggy` for exactly
# that reason and says so; a namespace added later without the label reopens
# this, and nothing in this file would report it.
#
# The other two are bounded by who may exec in `ory`, which is nobody outside
# the operator today.
#
# NOTHING HERE DEPENDS ON THAT CNI BEHAVIOUR TO WORK. The exemption is a leak
# and not a mechanism: every probe in `ory` is on a port this policy admits
# from anywhere, so replacing kube-router tightens enforcement and breaks no
# workload. ory-kratos.yaml and ory-keto.yaml record the choices that keep it
# that way, and tests/keto.py holds Keto's.
#
# It also does not bound the stores themselves. `hydra`, `kratos` and `keto`
# are databases on the `chuggy` PostgreSQL, and `edit` in `chuggy` carries
# pods/exec, which lands on a `trust` socket as superuser. Closing these ports
# closes one of two roads to the same place; ory-namespace.yaml states the
# other, which is inherent to sharing the server.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ory-admin-apis-are-namespace-local
  namespace: ory
spec:
  # Hydra, Kratos and Keto, and not ory-ui: the UI serves one port and it is
  # public. An expression rather than three policies because the rule is the
  # same rule -- AND A POD WHOSE `app` IS NOT IN THIS LIST IS SELECTED BY NO
  # POLICY IN `ory`, which is not a denial but the whole pod network on every
  # port it listens on.
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [hydra, kratos, keto]
  policyTypes:
    - Ingress
  ingress:
    # From anywhere on the pod network. Traefik is what actually calls the first
    # two, but naming it here would couple this file to the ingress controller's
    # namespace and labels for no gain: those ports face the open internet
    # through the tunnel already.
    #
    # KETO'S READ PORT IS NOT PUBLISHED AND IS STILL HERE, because it is where
    # Keto serves both health endpoints and a kubelet probe matches no
    # podSelector. Narrowing it to the API's pod would leave this deployment's
    # liveness resting on the node-local ACCEPT the header above says nothing
    # depends on. What it costs is disclosure and not authority: this port
    # checks, expands and lists the permission graph, and writes none of it.
    - ports:
        - protocol: TCP
          port: 4444 # hydra-public
        - protocol: TCP
          port: 4433 # kratos-public
        - protocol: TCP
          port: 4466 # keto-read
    # The ports that administer, from this namespace only. A bare podSelector is
    # scoped to the policy's own namespace, so this is ory-ui reaching
    # hydra-admin for consent and kratos-admin for identities, and Kratos
    # reaching hydra-admin to resolve a login challenge -- and nothing outside
    # `ory` writing a relationship.
    #
    # These are pod ports, not Service ports. They coincide here because every
    # Service targets the container port by name and the numbers match; a future
    # Service that renumbers would not move this rule with it. tests/keto.py
    # resolves that pairing for Keto's two.
    #
    # A SCRAPE WOULD NEED A THIRD ELEMENT. Hydra publishes Prometheus metrics on
    # its admin port and Keto on a port no Service names, so a ServiceMonitor
    # added in `monitoring` fails here -- silently, as a target that never comes
    # up. Admit it the way flux-system/allow-scraping does, by namespace and
    # metrics port, rather than by widening this element.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4445 # hydra-admin
        - protocol: TCP
          port: 4434 # kratos-admin
        - protocol: TCP
          port: 4467 # keto-write
