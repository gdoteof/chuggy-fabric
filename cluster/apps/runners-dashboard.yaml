# Each runner reporting to chuggy's pool plane, on one page: what it is,
# whether its machine is healthy, what it is doing and how long its image
# pulls and runs take, read from the `chuggy_runner_*` series the pool plane
# serves of each runner whose report it holds.
#
# THE DASHBOARD'S UID IS AN ADDRESS. `/d/chuggy-runners` is the page, and a
# link handed to someone is not this file's to change: renaming the uid breaks
# every one already given out.
#
# WHO OPENS ON ME, AND IS A VIEW, NOT A BOUNDARY. Every selector matches
# `owner=~"$owner"`, and Who opens on Me, `${__user.login}`, which
# monitoring.yaml's `login_attribute_path` makes the subject the plane cuts a
# personal runner's `owner` from. A project's pool carries no owner and a
# personal runner no project, so Everyone with a Project is that project's
# pools, and Everyone alone is every runner. Every member signed in can query
# every series whatever this page shows.
#
# A RUNNER THAT STOPS REPORTING READS AS OFFLINE: Offline here is no report,
# not no poll. The plane serves a runner's series only while it holds a report
# younger than kasofsk/chuggy's `workerPoolReportAgeMsMax`, so a runner that
# stops reporting leaves the scrape rather than reading zero. Each table keys
# its rows on the last report seen in the selected time, so that runner keeps
# its row, with what is measured now left blank. Live and Offline are that
# report's age against the same bound, in the tables and the stats alike, and
# the Jobs and Sessions stats count the Live runners' latest reports: the plane
# keeps its reports in memory, so a runner it lost in a release reads Live
# until its report is older than the bound, not Offline or idle until it
# reports again.
#
# EVERY QUERY AGGREGATES BY THE RUNNER'S OWN LABELS, or by `host` where it
# reads the machine every runner on it measures alike, so a label Prometheus
# adds at the scrape draws no second line. Two machines reporting one host
# name read as one. A counter is read only through `increase`: a runner's
# counts start again when it does, and `increase` takes the fall for a
# restart. What a runner counted before its first report is in no range.
#
# A POOL-PLANE RELEASE CAN DROP A REPORT PERIOD OF COUNTS. Its ServiceMonitor
# keeps `pod` and `instance`, so a new pod's series are new series, and
# `increase` counts nothing between the old pod's last scraped report and the
# new pod's first: a report period's counts of each runner, two where the old
# pod's last report went unscraped. The plane serves no `_created`, so
# created timestamps do not recover them. The metrics plane's remedy,
# `labeldrop` with a `Recreate` rollout, would cut every runner's polls at each
# release of the one replica they all poll, so each total says it can fall
# short instead.
#
# It is a plain ConfigMap for the reason release-dashboard.yaml's is: the
# sidecar finds it by label and nothing mounts it. dashboards/runners.py writes
# this file whole; tests/runners-dashboard.py holds it to that writer and to
# what its own header lists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chuggy-runners-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  chuggy-runners.json: |-
    {
      "uid": "chuggy-runners",
      "title": "Chuggy runners",
      "description": "Each runner reporting to chuggy: what it is, whether its machine is healthy, what it is doing and how long its pulls and runs take. A runner reports only where its own configuration turns reporting on. Offline is a runner seen in the selected time that has not reported in over 3 minutes. What a runner counted before its first report is in no total, and a pool-plane release can drop a report period of counts. Who opens on your own runners; Everyone widens it to every runner, and a Project to that project's pools. It is a view, not a boundary.",
      "tags": [
        "chuggy"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "graphTooltip": 1,
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "tenant",
            "label": "Tenant",
            "description": "The tenants of the runners seen.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(chuggy_runner_last_report_timestamp_seconds, tenant)",
            "definition": "label_values(chuggy_runner_last_report_timestamp_seconds, tenant)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "project",
            "label": "Project",
            "description": "The projects whose pools were seen. A member's own runners are in none.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\"}, project)",
            "definition": "label_values(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\"}, project)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "owner",
            "label": "Who",
            "description": "Your own runners, or every runner, every project's pools among them.",
            "type": "custom",
            "query": "Me : ${__user.login},Everyone : .*",
            "multi": false,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": "Me",
              "value": "${__user.login}"
            },
            "options": [
              {
                "selected": true,
                "text": "Me",
                "value": "${__user.login}"
              },
              {
                "selected": false,
                "text": "Everyone",
                "value": ".*"
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "At a glance",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Live",
          "description": "Runners whose last report is at most 3 minutes old.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count((time() - max by (tenant, project, pool, owner, personal_runner, host) (last_over_time(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range]))) <= 180)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Offline",
          "description": "Runners seen in the selected time whose last report is over 3 minutes old.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count((time() - max by (tenant, project, pool, owner, personal_runner, host) (last_over_time(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range]))) > 180)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Jobs",
          "description": "Jobs the Live runners run, as each last reported, and the most they take at once.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by (tenant, project, pool, owner, personal_runner, host) (last_over_time(chuggy_runner_jobs_running{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range]) and (time() - last_over_time(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range])) <= 180))",
              "legendFormat": "Running",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by (tenant, project, pool, owner, personal_runner, host) (last_over_time(chuggy_runner_jobs_max{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range]) and (time() - last_over_time(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range])) <= 180))",
              "legendFormat": "Most",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Sessions",
          "description": "Sessions the Live runners run, as each last reported, and the most they take at once.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by (tenant, project, pool, owner, personal_runner, host) (last_over_time(chuggy_runner_sessions_running{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range]) and (time() - last_over_time(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range])) <= 180))",
              "legendFormat": "Running",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by (tenant, project, pool, owner, personal_runner, host) (last_over_time(chuggy_runner_sessions_max{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range]) and (time() - last_over_time(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range])) <= 180))",
              "legendFormat": "Most",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Failed polls",
          "description": "Polls that never reached the plane over the selected time. A pool-plane release can drop a report period of counts.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(chuggy_runner_polls_failed_total{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Refusals",
          "description": "Assignments the runners refused over the selected time. A pool-plane release can drop a report period of counts.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(chuggy_runner_refusals_total{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Runners",
          "description": "Every runner seen in the selected time; Offline has not reported in over 3 minutes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - max by (tenant, project, pool, owner, personal_runner, host) (last_over_time(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range]))",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (tenant, project, pool, owner, personal_runner, host) (last_over_time(chuggy_runner_last_report_timestamp_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range])) * 1000",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (tenant, project, pool, owner, personal_runner, host) (last_over_time(chuggy_runner_last_poll_timestamp_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"}[$__range])) * 1000",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (tenant, project, pool, owner, personal_runner, host) (chuggy_runner_uptime_seconds{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"})",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (tenant, project, pool, owner, personal_runner, host, package, version) (chuggy_runner_info{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\"})",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "personal_runner": true,
                  "Value #E": true
                },
                "indexByName": {
                  "host": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4,
                  "package": 5,
                  "version": 6,
                  "tenant": 7,
                  "project": 8,
                  "pool": 9,
                  "owner": 10
                },
                "renameByName": {
                  "host": "Machine",
                  "Value #A": "Status",
                  "Value #B": "Last report",
                  "Value #C": "Last poll",
                  "Value #D": "Uptime",
                  "package": "Runner",
                  "version": "Version",
                  "tenant": "Tenant",
                  "project": "Project",
                  "pool": "Pool",
                  "owner": "Member"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
