# The network boundary around the control-plane pods: the five processes and the
# migration Job, declared here because they are.
#
# postgres-network-policy.yaml bounds what may reach the database. This is the
# other direction and the other end: what may reach these processes, and where
# each of them may reach. They are separate files because they are separate
# questions with separate podSelectors, and one object claiming both would be
# honest about neither.
#
# WHAT SELECTING A POD DOES NOT BOUND is argued in full in
# postgres-network-policy.yaml -- `kubectl exec`, `kubectl port-forward` and the
# node's own address all reach a selected pod without crossing anything below,
# and the third is kube-router's own doing rather than something Kubernetes
# guarantees. Those three are about INGRESS, and one of them is load-bearing
# rather than merely true: the kubelet probes chuggy-api from the node, which is
# why the ingress rule below does not have to admit it.
#
# NONE OF THE THREE CARRIES OVER TO THE EGRESS OBJECTS, and saying they did
# would understate what those rules are worth. A process started by `kubectl
# exec` runs in the pod's own network namespace, so its outbound packets go
# through the pod's egress chain like any other -- the rule holds against it.
# `port-forward` opens an inbound path to a listener and these four pods have
# none, so it is not a way out of them. And kube-router's node-local acceptance
# is a rule about a packet's SOURCE address, which says nothing about a packet
# leaving a pod. So an egress rule below is a real bound on what that workload
# can reach even from a shell inside it, and the ingress exemptions are not a
# hole in it.
#
# THESE POLICIES ARE NOT VERIFIED AGAINST LIVE TRAFFIC. They were built and
# checked against the API server, and their selectors were checked against the
# labels the cluster actually carries -- Traefik's, CoreDNS's, PostgreSQL's --
# but nothing here has been applied to the running rig, so no probe has been run
# through them. Two are worth watching on the first reconcile: the ingress rule
# on chuggy-api, which is the only rule here that stands in front of something
# that already works, and the egress rule on chuggy-migrate, which stands in
# front of something that has to work before anything else does -- and whose
# failure mode, a database the Job cannot reach, is one chuggy-migrate.yaml
# reports as a could-not-run rather than as a policy.
#
# ---------------------------------------------- what "egress: nothing" means ----
#
# A pod named by ANY egress policy is isolated for egress, so each rule below is
# a complete statement of where that workload may go. Replies are not egress --
# the pod's chain accepts RELATED,ESTABLISHED before consulting a policy -- so
# an admitted connection is answered whatever these say.
#
# A ClusterIP is not what a rule matches. Service addresses are translated
# before the filter chain sees the packet, so a destination is written here as
# the pod that answers it: CoreDNS by its label, PostgreSQL by its, the API by
# its. The one place that fails is the Kubernetes API server, and that is argued
# where the scheduler's rule is.
---
# Nothing may open a connection to the four loop processes or to the migration
# Job, because none of them listens. They have no port, no Service and no probe;
# a rule that admitted anything would be admitting it to a closed port.
#
# This is the cheapest half of D14's "internal control ports remain
# cluster-internal": there are no internal control ports, and this is what says
# so in a form a negative probe can fail against rather than in a comment.
#
# The five are named rather than carrying a shared label. A label would have to
# be added to five pod templates and could be dropped from one of them silently;
# the list is the record, the same choice as enumerating tunnel hostnames. The
# Job's entry is its `app` label and not its name, which carries the image tag
# and changes with it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chuggy-control-plane-denies-ingress
  namespace: chuggy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - chuggy-selector
          - chuggy-scheduler
          - chuggy-ticket-service
          - chuggy-finalizer
          - chuggy-configuration-importer
          - chuggy-migrate
  # THE ABSENT `ingress:` KEY IS THE RULE. `ingress: [{}]` admits everything and
  # looks almost identical -- do not "complete" this object.
  policyTypes:
    - Ingress
---
# The API is reachable from Traefik, which is how the internet reaches it, and
# from the selector, which is the only in-cluster client it has. Nothing else on
# the pod network may open a connection to it.
#
# Before this rule any pod in any namespace could reach `/api/v1` directly and
# present a token to it. That is not a hole -- the API authenticates -- but it
# is a surface with no reason to exist, and the console reaches the API through
# Traefik like every other browser.
#
# THE KUBELET IS NOT ADMITTED HERE AND DOES NOT NEED TO BE. Both probes come
# from the node's own address, which kube-router accepts above the jump to this
# chain. Under a different CNI that is a fact to re-establish, and the symptom
# of getting it wrong would be a pod that never becomes ready.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chuggy-api-admits-traefik-and-the-selector
  namespace: chuggy
spec:
  podSelector:
    matchLabels:
      app: chuggy-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Traefik, by the namespace it runs in and the label its chart gives it.
        # Both were read off the running cluster rather than assumed.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # A bare podSelector is scoped to this policy's own namespace, so this
        # admits a labelled pod in `chuggy` and nothing another namespace
        # labels the same way.
        - podSelector:
            matchLabels:
              chuggy.dev/api-client: "true"
      ports:
        - protocol: TCP
          port: 3000
---
# The ticket service reaches the database and the resolver, and nothing else.
# It is the tightest of the five because it is the only one whose whole world is
# the journal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chuggy-ticket-service-egress
  namespace: chuggy
spec:
  podSelector:
    matchLabels:
      app: chuggy-ticket-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chuggy-git
          podSelector:
            matchLabels:
              app.kubernetes.io/name: git
      ports:
        - protocol: TCP
          port: 8080
---
# The selector adds the API to the same two destinations, because its project
# view comes through `/api/v1` rather than out of the database.
#
# It does NOT reach the trusted selector policy host, and that is not an
# omission: no such Service exists in this directory, so there is nothing to
# name. Adding one is an edit to this rule as well as to
# chuggy-selector.yaml -- and until then the workload's own precondition is
# what reports the absence, not this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chuggy-selector-egress
  namespace: chuggy
spec:
  podSelector:
    matchLabels:
      app: chuggy-selector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: chuggy-api
      ports:
        - protocol: TCP
          port: 3000
---
# The finalizer adds the rig's own git service, and nothing else. A promotion
# pushes to `rig.git` in `chuggy-git`, so the remote is one pod in one namespace
# on one port and this rule names exactly that.
#
# THE PORT IS THE POD'S AND NOT THE SERVICE'S, and getting that wrong looks
# exactly like getting the selectors wrong. The URL names port 80 because that is
# what `Service/git` publishes, but the Service's `targetPort` is the container's
# `http`, which is 8080 -- and `ports` here is matched against the destination
# POD after the ClusterIP has been translated away, so 80 matches nothing and the
# connection is refused with the rule sitting there looking correct. Read the
# endpoints, not the Service, when changing this: `kubectl -n chuggy-git get
# endpointslice` prints the port that belongs in this field.
#
# THERE IS NO PUBLIC-INTERNET RULE HERE, AND THAT IS A CHANGE. This policy used
# to admit 443 to `0.0.0.0/0` with the pod network, the service network, every
# RFC1918 range and link-local in an `except` list -- the shape of the defence
# D25 asks for, on the argument that a promotion pushes to a remote that is not
# on this cluster. That argument is no longer true: the remote is on this
# cluster, so the rule it justified is gone rather than left standing beside a
# reason that has stopped applying.
#
# WHAT THAT COSTS IS THE ABILITY TO PUSH ANYWHERE EXTERNAL, deliberately. An
# external repository wants the short-lived minting D31 asks for and the egress
# proxy with an allow list that PR 5 carries -- a `NetworkPolicy` could never
# have bounded WHICH public host anyway, because an `ipBlock` cannot express a
# hostname and a rule written against today's GitHub addresses would be wrong
# within the month. Re-adding blanket 443 is not the way back to that.
#
# A NAMED POD IS A STRONGER STATEMENT THAN THE `except` LIST WAS. The one
# internal destination admitted is selected by namespace and pod label, so every
# other address inside this site -- including the cloud metadata address the
# `except` list was there for -- is refused by this rule having nothing that
# matches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chuggy-finalizer-egress
  namespace: chuggy
spec:
  podSelector:
    matchLabels:
      app: chuggy-finalizer
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chuggy-git
          podSelector:
            matchLabels:
              app.kubernetes.io/name: git
      ports:
        - protocol: TCP
          port: 8080
---
# The scheduler reaches the Kubernetes API server, and that is why its rule is
# the loosest of the four.
#
# A SERVICE ADDRESS IS TRANSLATED BEFORE THIS RULE SEES IT. `kubernetes.default`
# resolves to a ClusterIP whose only endpoint is the API server on the node's
# own LAN address, so an `ipBlock` naming the ClusterIP matches nothing and the
# destination this rule would have to name is the node's address -- which the
# README is explicit is a DHCP lease. Writing that address here would be the
# same failure the README warns about for the router's port forward, arriving
# weeks later as a scheduler that stopped placing anything.
#
# So the rule permits everything except the pod and service networks. What it
# buys is real -- this workload cannot open a connection to any other pod on
# this cluster except the two named above -- and what it costs is named: the
# house LAN and the public internet are both reachable from this pod, and
# nothing here narrows that.
#
# What would narrow it is a stable address for the API server: the node holding
# a reserved lease, or `chuggy.k3s` publishing one. Both are the machine layer's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chuggy-scheduler-egress
  namespace: chuggy
spec:
  podSelector:
    matchLabels:
      app: chuggy-scheduler
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: chuggy-worker-plane
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
---
# The migration Job, which is the sixth pod in this namespace and was the only
# one no policy selected.
#
# It matters more than its uptime suggests: it is the pod that holds
# `chuggy_owner`, the one credential here that owns the relations and carries
# CREATEROLE, and until this rule existed that credential ran in a pod that
# could open a connection to anything on the pod network, the house LAN or the
# internet. It lives for a minute at a time, which bounds the window and does
# not bound the reach.
#
# The rule is chuggy-ticket-service-egress with a different selector, because
# the two pods want the same world: the resolver and the database. The Job
# mounts no service account token and talks to no API server, and the image is
# already on the node, so nothing else has to be admitted.
#
# It selects by `app`, which the Job's pod template carries and which does NOT
# change with the tag -- the object's name does. A re-tag makes a new Job and
# this rule covers it without an edit, which is the property the name
# deliberately does not have.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chuggy-migrate-egress
  namespace: chuggy
spec:
  podSelector:
    matchLabels:
      app: chuggy-migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# The importer resolves and reads the internal repository, then appends through
# its own database role. Those are its only two application destinations.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chuggy-configuration-importer-egress
  namespace: chuggy
spec:
  podSelector:
    matchLabels:
      app: chuggy-configuration-importer
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chuggy-git
          podSelector:
            matchLabels:
              app.kubernetes.io/name: git
      ports:
        - protocol: TCP
          port: 8080
