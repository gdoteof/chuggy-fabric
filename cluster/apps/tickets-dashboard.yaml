# How chuggy's tickets are going, on one page: how many were released, landed
# and revoked, how often a result sent one back and from where, how long one
# took to land, how long one stood escalated and what one cost, read from the
# series chuggy-metrics-plane-monitor.yaml has Prometheus scrape.
#
# THE DASHBOARD'S UID IS AN ADDRESS. `/d/chuggy-tickets` is the page, and a
# link handed to someone is not this file's to change: renaming the uid breaks
# every one already given out.
#
# NO TICKET IS A LABEL. The plane counts tickets and never names one, so the
# page shows how many and how long, and its header links to the console, where
# each ticket is.
#
# WHO IS A VIEW, NOT A BOUNDARY. Every selector matches `owner=~"$owner"`, a
# ticket's owner being the member who first wrote its draft, the same subject
# a run's `owner` names. Everyone is `.*`, and Me is `${__user.login}`, which
# Grafana fills with the signed-in person's login; monitoring.yaml's
# `login_attribute_path` makes that login the subject the plane cuts its
# `owner` label from. Every member signed in can query every series whatever
# this page shows.
#
# EVERY QUERY SUMS, AND ONLY BY ITS FAMILY'S OWN LABELS, so a release
# replacing the plane's pod draws no new line, and each ratio divides two sums
# grouped alike, as an alert rule would read them.
#
# A STAGE READS AS ITS CONFIGURATION NAMES IT. A configuration that names no
# stage leaves the plane its number, so one stage can read as a number on
# older tickets and a name on newer ones, and the descriptions say so.
#
# A RANGE COUNTS A SERIES FROM ITS FIRST VALUE, as on the usage page: the
# plane names when each series began, as its OpenMetrics `_created`, and
# Prometheus writes a zero at that time (cluster/apps/monitoring.yaml's
# created-timestamp-zero-ingestion).
#
# It is a plain ConfigMap for the reason release-dashboard.yaml's is: the
# sidecar finds it by label and nothing mounts it. dashboards/tickets.py writes
# this file whole; tests/tickets-dashboard.py holds it to that writer and to
# what its own header lists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chuggy-tickets-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  chuggy-tickets.json: |-
    {
      "uid": "chuggy-tickets",
      "title": "Chuggy tickets",
      "description": "How chuggy's tickets are going: released, landed and revoked, how often a result sent one back and from where, how long one took, how long one stood escalated and what one cost, from the metrics plane. Costs are estimates at list price. Who narrows the page to the tickets the signed-in person created; it is a view, not a boundary.",
      "tags": [
        "chuggy"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "graphTooltip": 1,
      "timezone": "browser",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "refresh": "5m",
      "templating": {
        "list": [
          {
            "name": "tenant",
            "label": "Tenant",
            "description": "The tenants whose tickets the plane has counted.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(chuggy_tickets, tenant)",
            "definition": "label_values(chuggy_tickets, tenant)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "project",
            "label": "Project",
            "description": "The selected tenants' projects.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(chuggy_tickets{tenant=~\"$tenant\"}, project)",
            "definition": "label_values(chuggy_tickets{tenant=~\"$tenant\"}, project)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "owner",
            "label": "Who",
            "description": "Everyone's tickets, or only those the signed-in person created.",
            "type": "custom",
            "query": "Everyone : .*,Me : ${__user.login}",
            "multi": false,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": "Everyone",
              "value": ".*"
            },
            "options": [
              {
                "selected": true,
                "text": "Everyone",
                "value": ".*"
              },
              {
                "selected": false,
                "text": "Me",
                "value": "${__user.login}"
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "At a glance",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Released",
          "description": "Tickets released over the selected time.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum (increase(chuggy_ticket_events_total{tenant=~\"$tenant\", project=~\"$project\", owner=~\"$owner\", event=\"TicketCreated\"}[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 3,
