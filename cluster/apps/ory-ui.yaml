# The self-service UI, and the Ingress for the host it shares with Kratos.
#
# One app, two jobs: it renders Kratos's login, registration and settings flows,
# and it is also Hydra's consent endpoint. Ory ships it as a reference
# implementation, which is what it is here -- a rig needs a login page, not a
# product.
#
# ------------------------------------------------------- the id.vteng.io split ----
#
# The UI holds the root path; Kratos holds `/self-service`, the one prefix a
# browser is sent to directly. They must be one origin: a Kratos flow sets a
# CSRF cookie that the form posted from the UI has to carry back, and a cookie
# does not cross hosts. That is why this is a path split on one hostname and not
# a second hostname.
#
# Traefik orders Ingress rules by the length of the matcher it builds, so the
# prefix below wins over `/` without anything here saying so. The rules are also
# disjoint, so that ordering is a convenience and not the mechanism.
#
# ONE PREFIX, AND ADDING A SECOND TAKES A PAGE OFF THIS APP. Every path but
# `/self-service` belongs to a route this image registers -- `/sessions`,
# `/consent`, `/welcome` and the rest -- so an arm added here for a Kratos
# endpoint under one of those names does not sit beside the UI's page, it
# replaces it, and the symptom is Kratos's 401 where a redirect to /login
# should be. Kratos's own paths are not needed at the edge for this app anyway:
# it is server-rendered and calls Kratos over KRATOS_PUBLIC_URL in-cluster, and
# a browser on another origin could not use an edge route either, because
# Kratos serves no CORS headers.
#
# Kratos's admin API is on another port entirely and is not in `kratos-public`;
# its `/schemas` and `/.well-known/ory` endpoints are reached by this app over
# the cluster network, so a browser has no reason to and does not.
#
# --------------------------------------------------------------- the consent ----
#
# `/consent` answers with a redirect to `/404` unless HYDRA_ADMIN_URL,
# CSRF_COOKIE_SECRET and CSRF_COOKIE_NAME are all three set -- the route is
# registered either way, so a missing variable presents as a broken OAuth2 flow
# and not as a failure to start.
#
# It echoes Hydra's `requested_access_token_audience` back as
# `grant_access_token_audience`, which is the half of the audience chain that
# lives here. The other half is the client's registered allow-list and the
# `audience=` parameter on the authorize request: Hydra puts the GRANTED
# audience in the token, so a client that never asks gets `aud: []` and the API
# rejects it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ory-ui
  namespace: ory
  labels: { app: ory-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ory-ui }
  template:
    metadata:
      # No postgres-client label: this app holds no database role and reaches
      # PostgreSQL through nothing.
      labels: { app: ory-ui }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
      containers:
        - name: ory-ui
          image: oryd/kratos-selfservice-ui-node:v26.2.0@sha256:46a7bac1ad0c67c692b37d0380613fd4618fd751afac2c5314aa8d3ae77ef1f0
          # The image starts this through `npm run serve`, and npm insists on a
          # writable $HOME for its cache before it will run anything -- which
          # the read-only root filesystem below refuses. Running node directly
          # is the same process without the package manager in front of it.
          command: [node]
          args: [lib/index.js]
          ports:
            - name: http
              containerPort: 3000
          env:
            # Where this app calls Kratos, and where it tells a browser to. The
            # two differ because only one of them crosses the edge.
            - name: KRATOS_PUBLIC_URL
              value: http://kratos-public.ory.svc.cluster.local:4433
            - name: KRATOS_BROWSER_URL
              value: https://gumbo-nuc-0.tail20c474.ts.net/id
            # `app.use(BASE_PATH, router)` in the image: this app mounts itself
            # under the prefix rather than being handed a stripped path, which
            # is why the Ingress below passes `/id` through and only the Kratos
            # rule beside it strips. Every link it renders carries the prefix
            # because of this line.
            - name: BASE_PATH
              value: /id
            - name: KRATOS_ADMIN_URL
              value: http://kratos-admin.ory.svc.cluster.local:4434
            - name: HYDRA_ADMIN_URL
              value: http://hydra-admin.ory.svc.cluster.local:4445
            # `__Secure-` RATHER THAN `__Host-`, AND THE PREFIX IS WHY. A
            # `__Host-` cookie must be set with `Path=/`, and this app now
            # lives under `/id` and scopes its cookie there, so the browser
            # would reject the cookie and every form would fail its CSRF
            # check. `__Secure-` keeps the part that still applies -- HTTPS
            # only -- and gives up the path and Domain guarantees, which on a
            # single-origin deployment bound nothing another prefix here could
            # not already reach.
            - name: CSRF_COOKIE_NAME
              value: __Secure-ory-ui-csrf
            - name: CSRF_COOKIE_SECRET
              valueFrom:
                secretKeyRef: { name: ory-ui, key: csrf-cookie-secret }
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef: { name: ory-ui, key: cookie-secret }
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            # PREFIXED, BECAUSE THE WHOLE APP IS. `BASE_PATH` mounts every
            # route under /id, health included, so a probe at the root gets
            # the app's own 404 and the pod never becomes ready.
            httpGet: { path: /id/health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /id/health/alive, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: ory-ui
  namespace: ory
spec:
  selector: { app: ory-ui }
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ory-id
  namespace: ory
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gumbo-nuc-0.tail20c474.ts.net
      secretName: tailnet-tls
  rules:
    - host: gumbo-nuc-0.tail20c474.ts.net
      http:
        paths:
          - path: /id
            pathType: Prefix
            backend:
              service:
                name: ory-ui
                port: { number: 3000 }
---
# THE FLOW ENDPOINTS, AND A SECOND OBJECT BECAUSE THEY ARE STRIPPED AND THE APP
# ABOVE IS NOT. Kratos serves `/self-service` at its root and carries the prefix
# in `serve.public.base_url`, so it needs `/id` taken off; the console app
# mounts itself under `/id` and needs it left on. A Traefik middleware is
# selected per Ingress and not per path, so one rule cannot do both.
#
# Traefik matches the longer prefix first, so this wins over `/id` above for
# exactly the paths Kratos serves.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-id
  namespace: ory
spec:
  stripPrefix:
    prefixes:
      - /id
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ory-id-flows
  namespace: ory
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ory-strip-id@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gumbo-nuc-0.tail20c474.ts.net
      secretName: tailnet-tls
  rules:
    - host: gumbo-nuc-0.tail20c474.ts.net
      http:
        paths:
          - path: /id/self-service
            pathType: Prefix
            backend:
              service:
                name: kratos-public
                port: { number: 4433 }
