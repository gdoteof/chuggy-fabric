# No `dsn` and no `secrets` here -- both arrive as environment variables
# from the `kratos` Secret.
serve:
  public:
    port: 4433
    host: 0.0.0.0
    # Kratos builds every URL it hands a browser from this, and decides
    # whether its cookies are Secure from this scheme. The pod is reached
    # over plain HTTP; the browser is not, and this is where that is said.
    base_url: https://id.vteng.io/
  admin:
    port: 4434
    host: 0.0.0.0
    base_url: http://kratos-admin.ory.svc.cluster.local:4434/

selfservice:
  default_browser_return_url: https://chuggy.vteng.io/
  # An exhaustive list of where a flow may deposit a browser afterwards.
  # Anything absent is refused, which is what stops `?return_to=` being an
  # open redirect out of the login page.
  #
  # NO auth.vteng.io, AND THAT IS NOT AN OMISSION. This list bounds
  # `?return_to=`, which Kratos checks when the flow is created. An OAuth2
  # login arrives as `?login_challenge=` with no `return_to` at all, and
  # where it lands afterwards comes back from Hydra's accept-login call --
  # Hydra's own registered redirect, not a parameter anyone can set. Adding
  # the issuer here would widen the open-redirect surface to buy nothing.
  allowed_return_urls:
    - https://id.vteng.io
    - https://chuggy.vteng.io

  methods:
    password:
      enabled: true
    # Both of these deliver a secret by mail. See the header.
    code:
      enabled: false
    link:
      enabled: false
    # SIGN-IN WITH GITHUB, FOR AN IDENTITY THAT ALREADY HOLDS THE ACCOUNT.
    # Kratos looks the account's numeric id up among the credentials its
    # identities carry, as `github:<id>`, and signs in the one that holds it.
    # An account no identity holds falls through to registration, which is
    # closed below: that person is returned to the login page under
    # "Registration is not allowed because it was disabled." and no identity
    # is made. So this method opens nothing `registration` closes, and
    # tests/kratos-github.py holds the two together -- with it on, an open
    # registration flow is an identity for every GitHub account that asks.
    #
    # An identity comes to hold an account in one of two ways. Its owner,
    # signed in by password, links it on the settings page; or whoever writes
    # the identity through the admin API gives it the `oidc` credential. The
    # settings page does not unlink an account from an identity it is the only
    # way into.
    #
    # LINKING KEEPS A TOKEN, WHICH SIGNING IN DOES NOT. Kratos stores the
    # GitHub access token a link was made with in the credential, encrypted
    # under `secrets-cipher`, and its admin API returns it decrypted to
    # whoever asks. That is the person's own token for chuggy-portal, good for
    # whatever the App and they may both do; ory-kratos.yaml says what bounds
    # the port that returns it. A credential written through the admin API
    # carries none.
    #
    # ONE PROVIDER, AND ITS `id` IS IN TWO PLACES THIS FILE DOES NOT REACH:
    # the callback URL registered on the GitHub App,
    # https://id.vteng.io/self-service/methods/oidc/callback/github, and the
    # `github:` every stored credential begins with. Renaming it sends
    # GitHub's redirect to a path Kratos does not serve and strands every
    # identity that linked an account.
    #
    # `github-app` BECAUSE chuggy-portal IS ONE. Such an App is granted
    # permissions rather than scopes, and a scope on its authorize request
    # gives the token nothing, so `scope` is empty. With this provider type
    # Kratos also lists the account's email addresses on every sign-in and
    # fails the sign-in when GitHub refuses, though nothing here uses the
    # answer: the App has to hold the account permission "Email addresses",
    # read-only. The README says what has to be true at GitHub and on the node
    # before this is deployed, and what each omission looks like.
    #
    # NO `client_secret`, AND KRATOS DOES NOT START ON A PROVIDER WITHOUT ONE.
    # It arrives as an environment variable that addresses this list by
    # position; ory-kratos.yaml carries it. The client id is no secret: GitHub
    # publishes it at https://api.github.com/apps/chuggy-portal and writes it
    # into the address bar of everyone who presses the button.
    #
    # NO `after` HOOK ON LOGIN, AS THE PASSWORD METHOD HAS NONE. Kratos issues
    # the session and answers Hydra's login challenge itself, for whichever
    # method signed the person in.
    oidc:
      enabled: true
      config:
        providers:
          - id: github
            provider: github-app
            label: GitHub
            client_id: Iv23liGOoLdpeiDAFoWh
            mapper_url: file:///etc/config/oidc.github.jsonnet
            scope: []

  flows:
    error:
      ui_url: https://id.vteng.io/error
    login:
      ui_url: https://id.vteng.io/login
      lifespan: 10m
    # CLOSED, AND THIS HOST IS ON THE OPEN INTERNET. Kratos serves
    # id.vteng.io through the tunnel with nothing in front of it, so an
    # enabled registration flow is an invitation to the whole internet to
    # create identities -- and `verification` and `recovery` below are off,
    # so nothing would even establish that an address belongs to whoever
    # typed it.
    #
    # What that would NOT grant is worth stating, because it is the reason
    # this is a decision rather than an emergency: an identity carries no
    # authorization here. Access is a relation tuple in Keto, and registering
    # writes none: a stranger who registered would hold a valid token and see
    # 404 on every resource no tuple grants them. The cost is unbounded
    # identity creation, not access to anything already here.
    #
    # Disabling the flow is what refuses it. Removing `ui_url` alone would
    # not: the flow would still be created and the browser sent nowhere
    # useful, which reads as a broken page rather than a closed door.
    #
    # Identities are created administratively instead, through Kratos's
    # admin API, which no Ingress and no tunnel hostname reaches --
    # ory-network-policy.yaml is what bounds who can.
    registration:
      enabled: false
      ui_url: https://id.vteng.io/registration
      lifespan: 10m
      after:
        password:
          hooks:
            # Without this a new account is created and then asked to log
            # in again -- which drops the OAuth2 flow it was registering in
            # the middle of. Kept against the flow being reopened: it is
            # the hook's absence that breaks a registration mid-OAuth2,
            # and that is not a thing to rediscover.
            - hook: session
    settings:
      ui_url: https://id.vteng.io/settings
      privileged_session_max_age: 15m
    logout:
      after:
        default_browser_return_url: https://id.vteng.io/login
    recovery:
      enabled: false
    verification:
      enabled: false

# Where Kratos accepts and resolves Hydra's login challenge. Hydra's admin
# API, in-cluster, never through the edge.
oauth2_provider:
  url: http://hydra-admin.ory.svc.cluster.local:4445

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/identity.default.schema.json

session:
  lifespan: 24h
  cookie:
    same_site: Lax

log:
  level: info
  format: json
