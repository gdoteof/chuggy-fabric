<!-- chuggy's favicon, as kasofsk/chuggy@1713af0ccec570b4da1e3f386b444582594d8a39
     serves it from `ui/chuggy-ui/public/favicon.svg`, so the tab of a sign-in
     page shows the console's mark and not Ory's. Mounted into the image's
     `public/`, which it serves at the root of the host, and named by
     `standard_headers.hbs`.

     READ AGAINST THE IMAGE
     sha256:46a7bac1ad0c67c692b37d0380613fd4618fd751afac2c5314aa8d3ae77ef1f0
     because that image is what serves `public/` at the root. Under one that
     served it from elsewhere the tab would show the browser's blank page.
     So tests/ory-ui-view.py holds ory-ui.yaml to that image and to the path
     this file is served from. -->
