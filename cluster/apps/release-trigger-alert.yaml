# What announces a release trigger that has stopped.
#
# A TRIGGER THAT IS NOT SUSPENDED AND HAS NOT SUCCEEDED. Each minute's Job
# exits 0 or fails, and the CronJob records when one last succeeded. When none
# has inside the window in the expression, and that has been so for the `for`
# as well, nothing is comparing the sources and no commit starts a release.
# Failed minutes between two that succeed, fewer than the two together, never
# fire.
#
# SILENT WHILE THE TRIGGER IS SUSPENDED, which is how
# cluster/build-system/release-trigger.yaml declares it: a trigger a person
# switched off has not stopped. The `for` is also what a trigger just resumed
# is given to succeed once, before a last success from before it was
# suspended counts against it.
#
# NOT A FAILED JOB. The chart's `KubeJobFailed` waits on a failed Job and then
# fires for as long as that Job is there. A trigger failing every minute keeps
# three and each is gone before the wait is over, and release-trigger.yaml
# gives a finished Job a time to live so that one failed minute is not there
# for good either.
#
# NOT A FAILED RUN. The trigger succeeds when it starts a run and when it
# finds one failed; what a run did is on the release dashboard.
#
# The `release` label is what this Prometheus selects a rule by, in every
# namespace. tests/release-alert.py evaluates the rule over each of the cases
# above.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: release-trigger
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: release-trigger
      rules:
        - alert: ReleaseTriggerNotSucceeding
          expr: |-
            kube_cronjob_spec_suspend{namespace="chuggy-release-trigger", cronjob="release-trigger"} == 0
            unless on (namespace, cronjob)
            time() - kube_cronjob_status_last_successful_time{namespace="chuggy-release-trigger", cronjob="release-trigger"} < 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The release trigger is not suspended and no Job of it has succeeded.
            description: >-
              No commit starts a release until one does.
              `kubectl -n chuggy-release-trigger get jobs` lists the last ones,
              and each one's log says why it failed.
