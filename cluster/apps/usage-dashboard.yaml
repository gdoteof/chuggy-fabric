        "chuggy"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "graphTooltip": 1,
      "timezone": "browser",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "refresh": "5m",
      "templating": {
        "list": [
          {
            "name": "tenant",
            "label": "Tenant",
            "description": "The tenants whose tickets or chat the plane has counted.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values({__name__=~\"chuggy_tickets|chuggy_session_turns_ended_total\"}, tenant)",
            "definition": "label_values({__name__=~\"chuggy_tickets|chuggy_session_turns_ended_total\"}, tenant)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "project",
            "label": "Project",
            "description": "The selected tenants' projects.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values({__name__=~\"chuggy_tickets|chuggy_session_turns_ended_total\", tenant=~\"$tenant\"}, project)",
            "definition": "label_values({__name__=~\"chuggy_tickets|chuggy_session_turns_ended_total\", tenant=~\"$tenant\"}, project)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "owner",
            "label": "Who",
            "description": "Everyone's work and chat, or only the signed-in person's.",
            "type": "custom",
            "query": "Everyone : .*,Me : ${__user.login}",
            "multi": false,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": "Everyone",
              "value": ".*"
            },
            "options": [
              {
                "selected": true,
                "text": "Everyone",
                "value": ".*"
              },
              {
                "selected": false,
                "text": "Me",
                "value": "${__user.login}"
              }
            ]
