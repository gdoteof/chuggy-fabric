# The finalizer: the only process trusted to turn an accepted result into a
# commit, and the only writer of the artifact store.
#
# One responsibility, one pod, one command, one database role. The shared image,
# the seven places its digest is written, the login-role-becomes-group connection,
# the password's URL-reserved-character constraint and the absence of a health
# listener are argued in chuggy-ticket-service.yaml.
#
# THE IMAGE IS NO LONGER THE OPEN QUESTION. The finalizer's first precondition is
# `git-available`: it runs `git --version` and requires a version that writes
# merge trees. That was the second of two blockers here for as long as the pin
# named an image built on bare `node:26.7.0-trixie-slim`, which carries no git.
# The tag below carries git 2.47.3 and the certificate bundle a remote needs --
# verified by running `git --version` in a pod on this rig at that tag, not read
# off the Dockerfile.
#
# The fourth precondition is `repository-credentials-available`. The internal
# handoff credential is provisioned once, while the GitHub credential is a
# rotating installation token supplied by the host. Both are mounted as files
# and read for each remote act.
#
# THE MODE ON THE CREDENTIAL VOLUME BELOW IS NOW OBSERVABLE, and it was not
# before: `git-available` used to fail ahead of it, so getting that mode wrong
# was invisible. On this tag the credential precondition is the first thing that
# can report it, which is the argument for reading that mode before changing it
# rather than after.
#
# ---------------------------------------------------------- the recovery epoch ----
#
# `CHUG_FINALIZER_RECOVERY_EPOCH` must equal the newest row in the database's
# `recovery_epoch` table, and the finalizer refuses to run when it does not.
# NO MIGRATION WRITES THAT ROW: the table is created empty, and reading it when
# it is empty raises "this database has no recovery epoch, so no lease can be
# issued under one" -- which arrives here as an unmet `recovery-epoch-current`.
#
# So a fresh database needs one deliberate insert before the finalizer or the
# scheduler can start. It is an installation step, not a recovery one; the
# operator operations that establish a *later* epoch after a restore belong to
# PR 7 of kasofsk/chuggy#197 and are not here.
#
#   epoch="epoch-$(uuidgen)"
#   kubectl -n chuggy create secret generic chuggy-recovery-epoch \
#     --from-literal=epoch="$epoch"
#   kubectl -n chuggy exec -i postgres-0 -- \
#     psql -U chuggy_owner -d chuggy \
#     -c "INSERT INTO recovery_epoch (epoch) VALUES ('$epoch')"
#
# The value is not written in this repository. `schema.ts` requires the epoch be
# unpredictable and never reused -- it exists to defeat a counter restored from
# the past -- and a literal in a public directory is neither: it is published to
# everyone who clones this, and a revert of the directory reinstates a retired
# epoch as the current one. Those two are what the Secret restores, and not
# confidentiality: k3s on this rig stores Secrets unencrypted, and whoever can
# read this namespace's Secrets already holds chuggy-postgres-credentials. Both
# this file and chuggy-scheduler.yaml read the one Secret, which is what makes
# them name the same epoch.
#
# ---------------------------------------------------------- the artifact store ----
#
# Read-write here and read-only in chuggy-api.yaml, which is the whole
# asymmetry: this process is the producer and the API is the reader. Both mount
# the claim in chuggy-artifacts.yaml, whose volume is `Retain` over a host
# directory -- which is the ARGUMENT that what this writes outlives this pod,
# this Deployment and the node's next boot, and not the evidence. Nothing has
# replaced this pod and read the bytes back through the API, and nothing has
# rebooted the box. The README says the same and says what would settle it.
#
# `artifact-root-writable` is a precondition rather than a runtime error, so a
# root this process cannot write is reported by name before anything is
# promoted. A volume the kubelet could not mount at all is earlier than that and
# is not this command's to report: the container is never built, which is what
# the missing credential Secret looks like above.
#
# --------------------------------------------------------------- the git side ----
#
# THE CREDENTIAL IS A PATH AND NEVER A VALUE. The command is given the file each
# repository's credential stands in and reads one at the moment a single remote
# act needs it, so no token is in this process's environment, its arguments or
# its diagnostics -- and a git child inherits an allowlist of variables rather
# than this environment.
#
# The scratch is an `emptyDir` on purpose. A working tree is not state: it is
# rebuilt from the remote for each promotion, and a copy of it surviving the pod
# would be a stale checkout the next promotion has to decide whether to trust.
# The artifact store is the thing that must persist, and it is the other volume.
#
# `HOME` points at the scratch because git writes there, and the root filesystem
# below refuses writes. Without it git fails on a home directory it cannot use,
# with a message about configuration rather than about permissions.
#
# `kasofsk/chuggy` is the authoritative development repository. Its credential
# is a short-lived installation token refreshed by the host; the full Secret
# mount lets kubelet replace that token without restarting this process.
# `rig.git` remains the destination for deployment handoffs and retains its
# separate internal operator credential.
#
# The internal credential is provisioned out of band because this repository is
# public:
#
#   password="$(kubectl -n chuggy-git get secret git-operator \
#     -o jsonpath='{.data.password}' | base64 -d)"
#   kubectl -n chuggy create secret generic chuggy-finalizer-credentials \
#     --from-literal=rig-git="$password"
#
# `operator` is required by the internal service and is also accepted by GitHub,
# which authenticates the installation token supplied as the password.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chuggy-finalizer
  namespace: chuggy
  annotations:
    fabric.chuggy.dev/source-commit: 492efa4
  labels: { app: chuggy-finalizer }
spec:
  replicas: 1
  # Recreate, and here it is load-bearing rather than tidy: the rolling default
  # would start a second finalizer while the first still held the artifact
  # volume and a promotion in flight. One producer at a time.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: chuggy-finalizer }
  template:
    metadata:
      labels:
        app: chuggy-finalizer
        chuggy.dev/postgres-client: "true"
    # This workload's egress -- including to remote git, which is off this
    # cluster -- is admitted by `chuggy-finalizer-egress` in
    # chuggy-control-plane-network-policy.yaml, and that policy selects on
    # `app: chuggy-finalizer` above. There is no capability label for it: one
    # would read as the thing egress is keyed on while keying nothing, and a
    # pod selected by no egress policy is not egress-isolated at all.
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # No fsGroup, because the artifact volume is a host directory the
        # machine layer already owns 1000:1000 -- the uid and gid below. An
        # fsGroup would be a second declaration of an ownership that is stated
        # once, in the layer that creates the directory, and two statements of
        # one fact is how they come to disagree.
        #
        # THE COST ARGUMENT FOR OMITTING IT DOES NOT HOLD, and it is worth
        # saying so rather than leaving it standing. `fsGroupChangePolicy:
        # OnRootMismatch` has been GA since 1.23 and is unrestricted under
        # baseline; it skips the recursive walk whenever the top-level ownership
        # already matches, which on this directory is every start after the
        # first. So the choice is not bought by avoiding a chgrp of a growing
        # store. What it is bought by is the Secret mode below, which is the
        # only thing an fsGroup would change here.
      containers:
        - name: finalizer
          image: registry.chuggy.internal/chuggy/api@sha256:e517c0084f1c15754ff375c63f5d3425be7bc91fae3f91b4cb5f50c48088aa13
          imagePullPolicy: IfNotPresent
          command:
            [
              node,
              --experimental-strip-types,
              src/roots/finalizer.ts,
            ]
          env:
            - name: CHUG_FINALIZER_PASSWORD
              valueFrom:
                secretKeyRef:
                  {
                    name: chuggy-postgres-credentials,
                    key: finalizer-password,
                  }
            - name: CHUG_FINALIZER_DATABASE_URL
              value: postgres://chuggy_finalizer_login:$(CHUG_FINALIZER_PASSWORD)@postgres.chuggy.svc.cluster.local:5432/chuggy?options=-c%20role%3Dchuggy_finalizer
            # The claim holder's name, taken from the pod so that two live
            # processes can never hold one finalization request under one
            # identity.
            - name: CHUG_FINALIZER_OWNER
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: CHUG_FINALIZER_RECOVERY_EPOCH
              valueFrom:
                secretKeyRef: { name: chuggy-recovery-epoch, key: epoch }
            - name: CHUG_FINALIZER_ARTIFACT_ROOT
              value: /var/lib/chuggy/artifacts
            - name: CHUG_FINALIZER_GIT_SCRATCH_ROOT
              value: /var/lib/chuggy/git
            # What the commits this process makes are attributed to. A machine
            # account rather than a person, because a person did not write them.
            - name: CHUG_FINALIZER_GIT_COMMIT_NAME
              value: chuggy finalizer
            - name: CHUG_FINALIZER_GIT_COMMIT_EMAIL
              value: finalizer@chuggy.vteng.io
            # The repository is the string handed to git as the remote, which is
            # also the key a credential is looked up under, so the two cannot
            # drift apart.
            - name: CHUG_FINALIZER_GIT_CREDENTIAL_USERNAME
              value: operator
            - name: CHUG_FINALIZER_CREDENTIAL_SOURCES
              value: |
                [
                  {
                    "repository": "http://git.chuggy-git.svc.cluster.local./rig.git",
                    "path": "/var/run/chuggy/credentials/rig-git"
                  },
                  {
                    "repository": "https://github.com/kasofsk/chuggy.git",
                    "path": "/var/run/chuggy/github-app/token"
                  }
                ]
            # git writes into HOME, and the root filesystem below refuses
            # writes. The scratch is the one writable place this process has
            # that is not the artifact store, which git has no business in.
            - name: HOME
              value: /var/lib/chuggy/git
            # AND THE SAME ARGUMENT REACHES ONE MORE VARIABLE. `TMPDIR` is in
            # `finalizerGitEnvironmentNames` -- the allowlist a git child
            # inherits -- so the command's own contract says git may be handed
            # one, and with `readOnlyRootFilesystem: true` and no /tmp mount the
            # default `/tmp` is not writable. git falls back to it for the
            # temporaries a fetch and a pack build, so leaving this unset is
            # leaving one of the two writable-path variables pointed at a path
            # that is not. Pointing it at the same scratch closes it; the
            # scratch is an emptyDir, so a temporary that outlives a promotion
            # does not outlive the pod.
            - name: TMPDIR
              value: /var/lib/chuggy/git
            # Every pass bound the finalizer decides under is left to the
            # defaults its own module publishes, for the reason
            # chuggy-ticket-service.yaml gives about restating a default.
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/chuggy/artifacts
            - name: git-scratch
              mountPath: /var/lib/chuggy/git
            - name: credentials
              mountPath: /var/run/chuggy/credentials
              readOnly: true
            - name: github-app-token
              mountPath: /var/run/chuggy/github-app
              readOnly: true
          resources:
            # More than the other loops: a promotion forks git, which clones a
            # working tree and writes it to the scratch above.
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            # Still true with three writable mounts: what it refuses is a write
            # anywhere this file did not name.
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
      # Longer than the other loops. A drain here may be waiting on a git child
      # that is talking to a remote, and the command's own remote timeout is the
      # bound on that rather than this.
      terminationGracePeriodSeconds: 60
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: chuggy-artifacts
        - name: git-scratch
          emptyDir: {}
        - name: credentials
          secret:
            secretName: chuggy-finalizer-credentials
            # WORLD-READABLE INSIDE THIS CONTAINER, AND THAT IS THE ONLY MODE
            # THAT WORKS HERE. The kubelet writes a Secret volume's files owned
            # by uid 0 whatever `runAsUser` says, and applies `fsGroup` to the
            # group and nothing else. With no `fsGroup` -- which the pod
            # securityContext above declines, for the reason it gives -- the
            # group is 0 too, so any mode without the world bit leaves a file
            # this process cannot open. `0400` here is root-only, and
            # `credentialFilesPrecondition` reports
            # `repository-credentials-available` unmet against it.
            #
            # What the world bit costs is bounded by the mount namespace it is
            # in: one container, running one process, which is the process the
            # file is for. There is no second uid in this pod to read it.
            #
            # THE ALTERNATIVE IS AN `fsGroup`, AND IT IS NOT THE EXPENSIVE ONE
            # IT LOOKS LIKE. `fsGroup: 1000` with
            # `fsGroupChangePolicy: OnRootMismatch` would put this file in group
            # 1000 and buy `0440`, and it would not walk the artifact store
            # after the first start, because that directory's top-level
            # ownership already matches. So the choice between them is not a
            # performance one. It is that an fsGroup restates the ownership the
            # machine layer declares -- see the pod securityContext above -- to
            # remove a world bit from one file in a pod with one uid in it.
            defaultMode: 0444
        - name: github-app-token
          secret:
            secretName: chuggy-github-finalizer-token
            defaultMode: 0444
