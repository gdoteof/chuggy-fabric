# node_exporter on the Mac behind the macmini-m1 virtual kubelet.
#
# The chart's node-exporter is a DaemonSet of Linux containers and cannot run
# there, so node_exporter runs natively on the Mac as a LaunchDaemon on :9100
# and is scraped here by address. The Service carries `jobLabel: node-exporter`
# so its samples land in the same job as the chart's, which is what the chart's
# "Node Exporter / MacOS" dashboard reads.
---
apiVersion: v1
kind: Service
metadata:
  name: macos-node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: macos-node-exporter
    jobLabel: node-exporter
spec:
  clusterIP: None
  ports:
    - name: http-metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: macos-node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: macos-node-exporter
subsets:
  - addresses:
      - ip: 192.168.0.175
        nodeName: macmini-m1
    ports:
      - name: http-metrics
        port: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: macos-node-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobLabel: jobLabel
  selector:
    matchLabels:
      app.kubernetes.io/name: macos-node-exporter
  endpoints:
    - port: http-metrics
      scheme: http
