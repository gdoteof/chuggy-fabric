# The chuggy console, and the Ingress for the host it owns.
#
# nginx over the bundle `images/chuggy-ui/Dockerfile` in kasofsk/chuggy builds:
# the install and the bundle happen inside that image, so what it serves is a
# function of the source commit and not of whichever Node the build host had.
# No server side. Everything the console decides it decides in the browser, and
# everything it decides about is behind the API next door.
#
# ------------------------------------------------- the chuggy.vteng.io split ----
#
# ONE ORIGIN, AND THAT IS THE WHOLE REASON FOR THIS SHAPE. The API implements no
# cross-origin preflight -- no OPTIONS handler and no Access-Control-Allow-Origin
# anywhere in it -- so a console served from any other hostname could not read it
# at all. `/api/v1` and `/` are therefore two backends behind one Ingress rather
# than two Ingresses, and moving either to a host of its own breaks the console
# without breaking anything a curl would notice.
#
# Traefik orders rules by the length of the matcher it builds, so `/api/v1` wins
# over `/` without anything here saying so.
#
# `pathType: Prefix` IS A STRING PREFIX TO TRAEFIK, not a path-segment one, so
# `/api/v1foo` reaches the API rather than the console. Harmless -- the API
# answers it with its own 404 and the console has no such route to lose -- but
# the two rules are disjoint by intent and not by the matcher, and a future rule
# that assumed segment boundaries would be wrong here.
#
# The image proxies nothing. `/api/v1` reaches the API because this Ingress sends
# it there and for no other reason -- there is no proxy_pass in the container, so
# a request that arrives at the console's port under that path is served the
# index like any other unresolved route.
#
# `/api/v1/tenants/:tenant/projects/:project/events` is under that prefix, so the
# stream needs no rule of its own. What it does need is a heartbeat, and
# chuggy-api.yaml carries the measured timeout that bounds it.
#
# NEITHER PROBE PATH IS PUBLISHED, and that is a decision rather than an
# omission. `/health/live` and `/health/ready` are unauthenticated and the
# kubelet reaches them on the pod address, which is the only reader that acts on
# them. `/health/ready` runs a database query for every request it answers, so
# publishing it would put an unauthenticated round trip to the durable authority
# on the open internet with nothing throttling it and no consumer asking for it.
# What that costs is a `kubectl` away from anyone who needs the answer. Both
# paths therefore fall to the console below and are served its index.
#
# --------------------------------------------------------- the runtime config ----
#
# The console reads `/config.json` at start-up, so one image serves every
# installation and the deployment is what tells it which one it is. The image
# serves that path by `alias` from OUTSIDE the document root, which is why the
# ConfigMap mounts at /etc/chuggy/web and not into the site: a copy of the file
# inside the site is then unreachable rather than silently authoritative, and an
# unmounted config is a 404 rather than the index -- a console handed HTML where
# its configuration should be cannot tell what went wrong.
#
# Every value in it is public by construction. `chuggy-ui` is a public client:
# it holds no secret, it proves possession of the authorization code with PKCE,
# and the redirect below is registered with Hydra. What stops someone else's page
# using this client id is that registration, not the secrecy of this file.
#
# `audience` is not decoration, and it names the API rather than a host. Hydra
# puts the GRANTED audience in the token, so a console that does not ask for one
# is issued `aud: []` and every read the API serves it is a 401 -- with a token
# that verifies perfectly. The API takes `CHUG_API_OIDC_AUDIENCE` as one required
# string -- see `oidcAudienceVariable` in kasofsk/chuggy's
# `src/roots/nativeHttp.ts` -- so there is one audience for one API, and it is
# the same string chuggy-selector.yaml registers its own client with.
#
# `offline_access` is what makes the session survive a reload: without it Hydra
# issues no refresh token and the console is signed out fifteen minutes later,
# which is `ttl.access_token` in ory/hydra.yaml.
#
# The Hydra client this names is registered on the admin port and not by
# anything in this directory. ory-hydra.yaml's header is where that mechanism
# is; `skip_consent` on this client is what removes the consent step, and it is
# set because the console and the API are one first party.
#
# CHANGING THE ConfigMap BELOW DOES NOT RESTART ANYTHING, and here it does not
# need to: nginx re-reads the file per request and the browser is told not to
# store it. A change is live on the next reload of the page.
#
# ---------------------------------------------------------------- the image ----
#
# The digest is the release identity. Every node maps the logical
# `registry.chuggy.internal` name to the private registry through k3s, so a new
# node can pull these bytes without an archive imported into its own containerd.
#
# A DIGEST AND A SOURCE COMMIT, which `scripts/check-release-consistency` reads
# here as it reads them on every control-plane manifest: one source, and no
# release that moves the console without the rest.
#
# THE BUILD IS GIVEN ITS REFERENCE RATHER THAN PRODUCING IT.
# `deploy/rig/images/build-and-import.sh` defaults `CHUG_IMAGE_PREFIX` to
# `chuggy.invalid` and `CHUG_IMAGE_TAG` to the short commit of a clean tree, so
# this image is built with both set: the prefix this cluster resolves, and a tag
# the release names. It is published under the `chuggy/web` repository, which is
# the registry path and not a second image.
#
# ------------------------------------------------------- the security headers ----
#
# Content-Security-Policy, Referrer-Policy, X-Content-Type-Options and
# X-Frame-Options are the image's, not this Ingress's. They describe the
# document, so they travel with whatever serves it -- and the ingress-level
# alternative could not be scoped to the console anyway: a Traefik middleware
# annotation applies to every router an Ingress generates, which was checked on
# this cluster and not assumed, so it would stamp `frame-ancestors` onto the
# API's JSON or force splitting the origin the console cannot be split from.
#
# `Referrer-Policy: no-referrer` is the load-bearing one: /auth/callback carries
# the authorization code in its query string, and a weaker policy sends that URL
# to every subsequent request the page makes. kasofsk/chuggy#216 argues the rest.
#
# ----------------------------------------------------------- the host, three ways ----
#
# `chuggy.vteng.io` reaches this cluster only when all three of these are true,
# and each is in a different place:
#
#   1. this Ingress, so Traefik has a router for the Host header;
#   2. `chuggy.tunnel.hostnames` in hosts/gtr/default.nix, so cloudflared
#      forwards it rather than answering the 404 its `default` rule gives every
#      name it does not know -- and that one needs a `nixos-rebuild switch` on
#      the node before it is true of the running system;
#   3. a CNAME to the tunnel, which `cloudflared tunnel route dns` creates.
#
# Single-label, for the reason ory-hydra.yaml's Ingress gives: Cloudflare's
# Universal SSL covers `vteng.io` and one level of `*.vteng.io`, so
# `ui.chuggy.vteng.io` would be a certificate this zone does not have. No `tls:`
# block, because TLS terminates at Cloudflare and Traefik is reached over plain
# HTTP.
#
# ------------------------------------------------- the network policy posture ----
#
# NONE. No policy in this directory selects this console in either direction, so
# nothing restricts what may reach this pod or where it may go. That is the state
# chuggy-control-plane-network-policy.yaml leaves it in; bounding it is worth
# doing and is not that change.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chuggy-ui-config
  namespace: chuggy
data:
  config.json: |
    {
      "issuer": "https://gumbo-nuc-0.tail20c474.ts.net/oauth",
      "clientId": "chuggy-ui",
      "audience": "https://gumbo-nuc-0.tail20c474.ts.net/api",
      "redirectUri": "https://gumbo-nuc-0.tail20c474.ts.net/auth/callback",
      "scopes": ["openid", "offline_access"]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chuggy-ui
  namespace: chuggy
  annotations:
    fabric.chuggy.dev/source-commit: 9607f218
  labels: { app: chuggy-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: chuggy-ui }
  template:
    metadata:
      # No postgres-client label: this holds no database role and reaches
      # PostgreSQL through nothing. Everything it reads it reads through the
      # API, with the caller's own token.
      labels: { app: chuggy-ui }
    spec:
      # An nginx over a directory of files calls no Kubernetes API, so the token
      # the kubelet would mount here is a cluster credential on the disk of a
      # pod the internet can reach. Nothing reads it; refusing it costs nothing.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numeric for the reason chuggy-api.yaml gives. 101 is this image's
        # `nginx` user.
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: registry.chuggy.internal/chuggy/web@sha256:05d4e72312866e66b0ae002bdca76c700eda735ef71d7dd8b08cbbee8dd28169
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # nginx writes its pid and every temporary path under /tmp, and the
            # root filesystem below refuses writes. Without this the master
            # process cannot start and the container never listens.
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/chuggy/web
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          # /healthz belongs to the image and reports the server rather than the
          # site, so liveness and readiness are the same path: this server has no
          # upstream, no database and no warm-up.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap: { name: chuggy-ui-config }
---
apiVersion: v1
kind: Service
metadata:
  name: chuggy-ui
  namespace: chuggy
  labels: { app: chuggy-ui }
spec:
  selector: { app: chuggy-ui }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# NAMED FOR THE HOST AND NOT FOR THE WORKLOAD, which is what makes this a patch
# of the object already serving chuggy.vteng.io rather than a second router for
# it. The console this replaces carried an Ingress of this name; applying and
# pruning are not ordered against each other, so an Ingress under a new name
# would leave two routers claiming the same host and path for as long as the
# reconcile took, with Traefik free to pick either.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chuggy
  namespace: chuggy
spec:
  ingressClassName: traefik
  # The certificate Tailscale issues for this node's own name. It is a real
  # publicly-trusted certificate for a name only the tailnet resolves, which is
  # what lets the console be reached over https without a tunnel, a zone or a
  # certificate authority of this cluster's own. `tailnet-tls` is written by the
  # host, not by this repository -- see the trial notes; it expires, and nothing
  # here renews it.
  tls:
    - hosts:
        - gumbo-nuc-0.tail20c474.ts.net
      secretName: tailnet-tls
  rules:
    - host: gumbo-nuc-0.tail20c474.ts.net
      http:
        paths:
          # Unrewritten: the API serves this prefix itself, so Traefik passes
          # the path through and a rewrite here would take the version out of
          # every route.
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: chuggy-api
                port: { number: 3000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chuggy-ui
                port: { number: 8080 }
