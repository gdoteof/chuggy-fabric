# What Track Record saved, what earning its passes cost and how its server is
# doing, on one page, read from the series track-record-monitor.yaml has
# Prometheus scrape.
#
# THE DASHBOARD'S UID IS AN ADDRESS. `/d/track-record` is the page, and a link
# handed to someone is not this file's to change: renaming the uid breaks every
# one already given out.
#
# TIME SAVED IS WHAT THE SERVER WAS TOLD. Each hit adds how long the pass it
# reused took to run, which a client sends from track-record v0.2.0 on; a hit
# on a record made before adds nothing. The server hears only of passes, so a
# failing run is in no panel here, and CI time as a whole is chuggy's to
# report.
#
# TIME SAVED, ESTIMATED, IS EACH HIT AT ITS COMMAND'S MEAN PASS: a command's
# hits over the range times its pass seconds over its passes. It counts a hit
# on a record that never said how long its pass took, at what the command's
# passes take now, so where it exceeds Time saved, hits reused such records.
# A command with no pass in the range has no estimate.
#
# A RANGE COUNTS A SERIES FROM ITS FIRST VALUE. The server keeps its counters
# in memory, from zero at each start, and `increase` allows for that. Its
# client library names when each series began, and Prometheus writes a zero
# at that time (cluster/apps/monitoring.yaml's
# created-timestamp-zero-ingestion), so a series' first value counts.
# `increase` extrapolates to the range's end from the samples it has, though,
# so for a few minutes after a command's first hit or pass since a start its
# series spans seconds and every total reads high. The page's description
# says so.
#
# NAMESPACE NARROWS WHAT IS COUNTED BY RECORD, NOT THE SERVER. Every selector
# of a series that carries `record_namespace` matches the variable; the
# server's own series carry none, and the Server row's description says so.
#
# It is a plain ConfigMap for the reason release-dashboard.yaml's is: the
# sidecar finds it by label and nothing mounts it.
# tests/track-record-dashboard.py holds what its header lists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: track-record-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  track-record.json: |-
    {
      "uid": "track-record",
      "title": "Track Record",
      "description": "What Track Record's hits saved, what earning its passes cost, and how its server is doing. Time saved counts only hits on records made by track-record v0.2.0 or later, and failing runs are in no panel: the server hears only of passes. For a few minutes after a command's first hit or pass since the server started, every total reads high: Prometheus extrapolates a series only seconds old.",
      "tags": [
        "track-record"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "graphTooltip": 1,
      "timezone": "browser",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "refresh": "5m",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "description": "The Track Record namespaces to count records in.",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values({__name__=~\"track_record_(hits|misses|passes)_total\"}, record_namespace)",
            "definition": "label_values({__name__=~\"track_record_(hits|misses|passes)_total\"}, record_namespace)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "What hits saved",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Time saved",
          "description": "For each hit in the range, how long the pass it reused took to run. A hit on a record made before track-record v0.2.0 adds nothing.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum (increase(track_record_saved_seconds_total{record_namespace=~\"$namespace\"}[$__range]))",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Time earning passes",
          "description": "How long each pass recorded in the range took to run. A failing run is not here: the server hears only of passes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
