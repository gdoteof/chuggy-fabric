              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Share saved",
          "description": "Time saved, of time saved and time spent earning passes together: of what the passing commands would have taken to run, the share hits skipped.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum (increase(track_record_saved_seconds_total{record_namespace=~\"$namespace\"}[$__range])) / (sum (increase(track_record_saved_seconds_total{record_namespace=~\"$namespace\"}[$__range])) + sum (increase(track_record_pass_seconds_total{record_namespace=~\"$namespace\"}[$__range])))",
              "legendFormat": "__auto",
