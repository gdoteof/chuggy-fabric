# Cluster access for a second person, without a shell on the box.
#
# Two grants, deliberately different in shape:
#
#   view   cluster-wide -- see everything, change nothing. The built-in role
#          carries pods/log and omits secrets, which is why it is the right
#          first rung rather than `edit` everywhere.
#   edit   in the `chuggy` namespace only -- where they may actually break
#          things. It adds pods/exec and pods/portforward, and full read/write
#          on secrets *in that namespace*. Scoped, but not nothing.
#
# AND `edit` HERE IS ADMINISTRATIVE OVER THE IDENTITY PROVIDER. pods/exec into
# postgres-0 lands on a `trust` socket as superuser, and the `kratos` database
# is on that server -- so this grant can write a credential into the identity
# table and then sign in as anyone. cluster/apps/ory-namespace.yaml carries the
# argument. Read the two roles above as "everywhere, read-only" and "one
# namespace, and the identity store with it".
#
# `create pods` is the other half of what `edit` is worth here, and it reaches
# past this namespace unless admission stops it. The Namespace below carries
# the labels that stop it, and says why they belong to more than this file.
#
# WHAT ADMISSION DOES NOT STOP IS THE ARTIFACT STORE. Baseline refuses a
# `hostPath` volume and says nothing whatever about a PVC -- so a pod created
# here may mount `chuggy-artifacts`, which is a `local` volume over a directory
# on the node, and read and write it. That is a host directory reached without a
# `hostPath`, through a claim `edit` already covers. It is modest beside the
# postgres-0 exec above -- one directory, not the identity store -- but it is
# the second host resource this grant reaches, and it is named here because
# nothing else would name it. chuggy-artifacts.yaml argues the directory.
#
# Identity is a ServiceAccount, not an x509 client certificate. The API server
# has no CRL support, so an issued client cert cannot be revoked short of
# rotating the cluster CA -- whereas deleting this ServiceAccount invalidates
# every token ever minted for it, immediately. That is the whole reason.
#
# Mint a credential (the API server caps duration at 365 days):
#
#   kubectl create token dev2 -n chuggy --duration=720h
#
# One consequence of reaching the cluster through GitOps: kustomize-controller
# applies this directory as cluster-admin, so anyone who can merge to main can
# grant themselves anything, this file included. Branch protection is the real
# boundary here -- RBAC only constrains what they do with kubectl.
---
# The app's namespace, not a personal sandbox -- chuggy is what this cluster
# exists to run. dev2 gets `edit` here; anything that must survive belongs on
# the durable node, see the nodeSelector note in whoami.yaml.
#
# BASELINE IS LOAD-BEARING, AND IT IS LOAD-BEARING FOR ANOTHER FILE. `edit`
# carries `create pods`, and without an enforce label the cluster default is
# `privileged` -- so one `hostNetwork: true` produces a pod whose traffic
# carries the node address, which k3s's kube-router accepts ahead of any
# NetworkPolicy chain. Every policy in this tree that names a source would then
# be one field away from irrelevant, ory-network-policy.yaml included. That is
# the same reason `chuggy-work` carries these labels, and kasofsk/chuggy's
# deploy/rig/isolation/README.md is where the argument is worked through.
#
# Baseline and not restricted: restricted additionally requires a seccomp
# profile and a non-root user on every pod, which is a bar for the workloads
# here to clear on their own schedule. Baseline is the one that closes the
# host namespaces, and the host namespaces are what the policies depend on.
apiVersion: v1
kind: Namespace
metadata:
  name: chuggy
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev2
  namespace: chuggy
---
# Read-only everywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev2-view
subjects:
  - kind: ServiceAccount
    name: dev2
    namespace: chuggy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
# `view` grants nodes only under metrics.k8s.io -- enough for `kubectl top`, not
# for `kubectl get nodes`, which is among the first things anyone types when
# debugging. Read-only and cluster-scoped, so it is a papercut fix, not a hole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev2-node-reader
subjects:
  - kind: ServiceAccount
    name: dev2
    namespace: chuggy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-reader
---
# Read/write, the chuggy namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev2-edit
  namespace: chuggy
subjects:
  - kind: ServiceAccount
    name: dev2
    namespace: chuggy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
