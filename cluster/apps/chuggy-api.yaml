# The chuggy web API: the native HTTP surface over the journal, and the only
# thing on this cluster that holds the `chuggy_api` database role.
#
# It answers under `/api/v1` on chuggy.vteng.io. The Ingress that puts it there
# is in chuggy-web.yaml, beside the console that holds `/` on the same host --
# one origin, because the API implements no cross-origin preflight and a console
# served from anywhere else could not read it at all.
#
# ------------------------------------------------------------- the image ----
#
# THE NAME IS API-SPECIFIC AND THE IMAGE IS NOT. It copies the whole of `src/`
# and sets a default CMD of this root alone, so the same bytes carry the
# selector, the scheduler, the ticket service, the finalizer and the migration
# command, and the four files beside this one select theirs from it. Renaming it
# to the control-plane image is revised PR 2 of kasofsk/chuggy#197, in the
# repository that builds it; nothing here can rename an image it does not build.
#
# The digest is written in seven `image:` lines, one per file -- this, the five
# workloads and the migration Job -- and they move together.
# chuggy-ticket-service.yaml argues what catches a bump that misses one, what
# does not, and what else a re-pin has to touch beyond those seven.
#
# Every node maps `registry.chuggy.internal` to the retained private registry
# through k3s. Promotion records a digest only after CRI has pulled it, so a
# second node and a rebuilt image store recover from the same declaration.
#
# -------------------------------------------------- the database, and role ----
#
# The API asserts at start-up that `current_user` is `chuggy_api` and refuses to
# listen otherwise. `chuggy_api` is NOLOGIN -- it is a group the login role
# holds by grant -- so the connection authenticates as `chuggy_api_login` and
# then becomes the group. `?options=-c%20role%3Dchuggy_api` is what does that,
# and it is in this file rather than inside the Secret so that a reader can
# check it: without it the pod starts, connects, and exits on an assertion whose
# message names neither the option nor this line.
#
# The URL is assembled here from a password the Secret holds. Kubernetes expands
# `$(NAME)` in an env value against variables defined earlier in the same list,
# so the shape of the connection stays public and reviewable while the
# credential does not. A `$(NAME)` with no such variable is left in the value
# verbatim -- which would be a connection failure and not a silent empty
# password -- and a `secretKeyRef` naming a key that is not there refuses to
# start the pod at all.
#
# TWO POOLS, TWO ROLES, ONE PROCESS. The API also opens a second connection as
# `chuggy_selector_review`, which reads the selector's proposal deliveries and
# reviews and nothing else, and it refuses to listen unless that connection is
# that role. It is a separate least-authority credential rather than a widening
# of `chuggy_api`, which is why it is a second URL and not a second query.
#
# THE GRANT THAT MAKES IT WORK IS IN NO MIGRATION. The migration creates
# `chuggy_selector_review` NOLOGIN and grants it its two reads; what grants the
# group to a login role is kasofsk/chuggy's
# `deploy/rig/postgres/postgres-roles.sql`, in a copy of it carrying
#
#   GRANT chuggy_selector_review TO chuggy_api_login;
#
# NOT EVERY #242 COMMIT CARRIES IT. That line and the membership grant beside it
# arrive part-way along the branch, so "from #242" is not the check. The
# README's prerequisite 1 pre-filters the checkout in hand for both grants and
# then reads `pg_auth_members` on the server, which is the only thing that
# settles whether they landed. The selected release image carries both.
#
# It is on this rig: `pg_auth_members` carries
# `chuggy_selector_review|chuggy_api_login` and this API is listening. A
# database rolled out from an older copy of that file has neither grant, and
# then no credential here can become the role and the API refuses to listen.
#
# THE REMEDY THERE IS NOT TO RUN THAT ONE STATEMENT BY HAND. Running it closes
# that gap and leaves the one beside it -- the same file is what makes
# `chuggy_owner` a member of `chuggy_boundary_owner`, without which 17 commits
# while granting nothing and no re-run repairs it. chuggy-migrate.yaml argues
# that at length, including why it has to happen BEFORE the Job runs. Re-run the
# whole file, once, before any of this starts -- and read prerequisite 4 first,
# because the file re-issues every login password.
#
# What the grant widens is what `chuggy_api_login` inherits on its ordinary
# connection -- two more SELECTs, on tables this same process already reads
# through the other pool. What it buys is that the review reads arrive under a
# role that can do nothing else.
#
# `sslmode` is unset and therefore `prefer`, which this server answers with
# plaintext because it serves no TLS. Read that as a statement of what is NOT
# protected here: what bounds the link instead is postgres-network-policy.yaml
# plus both ends being pods on one node.
#
# THE DATABASE IS `chuggy`, and two things in kasofsk/chuggy now mean THIS one.
# `deploy/rig/durability/rehearse.sh` defaults `CHUG_RIG_DATABASE` to `chuggy`
# and has a destroy phase; `deploy/rig/postgres/README.md` points the PostgreSQL
# suite at `chuggy` too. Both named the leftover fixtures until the rename and
# name the control plane after it, so each is now a drop or a refill of the
# database this API serves. Rehearsing durability against the real database is
# what that script is for, so neither is wrong to run -- but neither is
# survivable by accident any more, and the default is what changed under them.
#
# `chuggy_suite_fixtures` is where those leftovers went, under a name nothing
# points at. Every tenant in it is named `tenant-<case>-<uuid>`, and its ledger
# stops at migration 2 -- far enough behind that nothing has tried to carry it
# forward. Migration 5 is where an attempt would be decided: it backfills
# `journal_entry.cause_id` from a `cause_operation` column and then makes it
# NOT NULL, and that table there carries none of the three. It is kept, not
# cleaned up.
#
# ---------------------------------------------------------- the artifacts ----
#
# `CHUG_API_ARTIFACT_ROOT` names a directory the API only ever reads from. The
# producer has arrived: chuggy-finalizer.yaml writes this store, so the emptyDir
# that stood here -- correct while every read was a miss -- is now the claim in
# chuggy-artifacts.yaml, which is the shared volume that file predicted.
#
# Mounted read-only, which is the same claim the composition makes: the web
# composition is handed the store through one read port and holds no write. The
# finalizer mounts the same claim writable, and that asymmetry is the whole
# division of labour between the two.
#
# Repository configuration imports use a separate empty Git scratch and the
# read-only `chuggy-git-sync` Secret. That Secret is host-local and copies the
# password from `chuggy-git/git-sync`; the Git service also admits the adapter's
# fixed `chuggy` username as a reader. No repository credential belongs in this
# public tree.
#
# THE PV PINS THIS POD. Its node affinity is `chuggy.dev/durable=true`, so this
# Deployment is now schedulable on the durable node alone -- which it already
# Deployment is schedulable on the durable node alone.
#
# ------------------------------------------------------------ the Secrets ----
#
# Out of band, because this repository is public. `chuggy-postgres-credentials`
# holds one key per control-plane login role -- `owner-password`,
# `api-password`, `ticket-service-password`, `selector-service-password`,
# `scheduler-password`, `finalizer-password` -- and every workload in this
# namespace borrows its own from it rather than keeping a second copy that could
# drift from the role's.
#
# D21 SAYS THE HOST GENERATES THOSE AND SYNCHRONIZES THEM HERE, and fabric's PR
# 9 is what does it: generated once into a root-only state directory outside the
# Nix store, and pushed into this Secret without the values reaching a process
# argument, a build log or this repository. Until that lands they are
# kasofsk/chuggy's `deploy/rig/postgres/README.md` issued by hand.
#
# ALL SEVEN KEYS ARE ALREADY THERE, and so is every login role they name -- read
# off the rig, not assumed. Six of the seven are the credentials this namespace
# presents; the seventh, `chuggy_dispatcher_login`, is legacy and no workload
# here names it. So no workload here is waiting on a key. What the roles file
# still has to fix is the two MEMBERSHIPS below it, not a missing credential:
# `chuggy_selector_review` has no members and `chuggy_owner` is not in
# `chuggy_boundary_owner`. Which makes prerequisite 4 the hazard rather than the
# gap -- the roles file re-issues the six passwords it names unconditionally, so
# a re-run with values that are not the ones in this Secret leaves the Secret
# wrong and every pod here dies at its next restart.
#
# A `secretKeyRef` NAMING A KEY THAT IS NOT THERE REFUSES TO START THE POD,
# which is the ordering this stage relies on: a workload whose credential has
# not been synchronized yet does not run with a wrong one.
#
# The keying secret is this workload's own:
#
#   kubectl -n chuggy create secret generic chuggy-api --from-env-file=/dev/stdin <<EOF
#   idempotency-keying={"current":"v1","versions":[{"version":"v1","secret":"$(openssl rand -hex 32)"}]}
#   EOF
#
# It is the HMAC key a client idempotency key is stored under, never the key
# itself. ROTATING IT IS NOT A REPLACEMENT: a retry of a request accepted before
# the rotation must still find its operation, so a rotation appends a new
# version, points `current` at it, and keeps the old one in `versions` for as
# long as rows written under it are still worth matching. Dropping a version
# strands every row that names it -- those retries stop being recognised as
# retries and are executed again.
#
# --------------------------------------------------------------- the OIDC ----
#
# The issuer string is compared for equality against the one the discovery
# document returns, so `https://auth.vteng.io` here and `urls.self.issuer` in
# ory-hydra.yaml are one fact written twice; a trailing slash on either side is
# an outage. The audience is what Hydra must have GRANTED, not merely what the
# client registered: a console that omits `audience=` from its authorize request
# gets a token with an empty audience and every read here is refused.
#
# DISCOVERY LEAVES THE CLUSTER. The pod resolves auth.vteng.io publicly, egresses
# to the Cloudflare edge and comes back in through the tunnel to Traefik, rather
# than reaching hydra-public over the pod network -- because the issuer must be
# the string in the token and that string is an HTTPS URL this cluster cannot
# serve itself. So the hostname's tunnel route is a start-up dependency of this
# workload, not only of anyone's browser.
#
# WHAT NO RULE HERE BOUNDS. Nothing restricts this pod's egress. The namespace
# has no default-deny, and postgres-denies-egress selects the database and not
# this, so the API may open a connection to anywhere -- the issuer above is
# where it is pointed, not where it is confined. Every other pod in this
# namespace carries an egress rule, the migration Job included; this one does
# not, because narrowing the egress of
# the only service the internet reaches is a change whose failure mode is an
# outage, and nothing in this repository can rehearse it before it lands.
#
# What IS bounded now is the other direction:
# chuggy-control-plane-network-policy.yaml admits Traefik and the selector to
# port 3000 and refuses every other pod on the cluster.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # The namespace is declared in dev2-access.yaml, which owns it.
  name: chuggy-api
  namespace: chuggy
  annotations:
    fabric.chuggy.dev/source-commit: 9e0d22e
  labels: { app: chuggy-api }
spec:
  # One. The journal makes concurrent writers safe, so this is not a
  # correctness bound -- but a rolling second replica would hold a second set of
  # database connections against a server sized for this rig, and nothing here
  # needs the capacity.
  replicas: 1
  selector:
    matchLabels: { app: chuggy-api }
  template:
    metadata:
      labels:
        app: chuggy-api
        # What postgres-network-policy.yaml admits, together with this
        # namespace. Drop this label and every connection to the database is
        # refused, with no error anywhere to say the label is why.
        #
        # EXPECT `RESTARTS 1` ON EVERY ROLLOUT, and do not read it as a fault.
        # The policy controller learns a new pod's labels on its own schedule,
        # so the first connection races it and loses -- kube-router REJECTs
        # rather than drops, so it arrives as `ECONNREFUSED` from the database's
        # correct and current address, which reads like a server that is down
        # and is not. The process has no retry around its first connection: it
        # exits 1, the kubelet restarts it, and the second attempt is after the
        # controller has caught up. Reproduced on all three rollouts of this
        # Deployment. What would remove it is a retry in the composition root
        # of kasofsk/chuggy, not anything in this file -- an initContainer here
        # would only move the same wait somewhere quieter.
        #
        # WHAT MAKES THAT RESTART WORK IS THAT IT IS THE SAME POD, and the
        # distinction is the whole difference between "retry" and "retry in the
        # same pod". kube-router admits an IP, not a label as such: the label
        # decides which IP goes into the set, and the set is what the packet is
        # matched against. A kubelet restart keeps the sandbox and so keeps the
        # address the controller has by then admitted, which is why the second
        # attempt is free. A REPLACEMENT pod is issued a new address and starts
        # the same wait over from nothing.
        #
        # That is why chuggy-migrate.yaml cannot get past this the way this
        # Deployment does. It is a Job, its pods are replaced rather than
        # restarted, and no `backoffLimit` reaches the state a restart reaches
        # for free -- so it waits inside its pod instead. Measured there.
        chuggy.dev/postgres-client: "true"
    spec:
      # This process calls no Kubernetes API, so the token the kubelet would
      # otherwise mount into it is a cluster credential sitting on the disk of
      # the one pod reachable from the internet. Nothing here reads it, so
      # refusing it costs nothing and removes it from what a request-side flaw
      # could reach.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numeric because `runAsNonRoot` is checked by the kubelet against a
        # number: it cannot tell that the image's `node` user is not root.
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          image: registry.chuggy.internal/chuggy/api@sha256:b37b38687aa2278e1d63c4df7fe22ce73be8268aca058edb3717e8823a1adfc8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Defined before the URLs that expand it, which is the ordering
            # Kubernetes resolves `$(...)` in.
            - name: CHUG_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  { name: chuggy-postgres-credentials, key: api-password }
            - name: CHUG_API_DATABASE_URL
              value: postgres://chuggy_api_login:$(CHUG_API_PASSWORD)@postgres.chuggy.svc.cluster.local:5432/chuggy?options=-c%20role%3Dchuggy_api
            # The same credential becoming a different group. One password,
            # because one process holds both pools and a second password would
            # be a second thing to rotate for no separation it does not already
            # have; the separation is the role, and it is in the option.
            - name: CHUG_API_SELECTOR_REVIEW_DATABASE_URL
              value: postgres://chuggy_api_login:$(CHUG_API_PASSWORD)@postgres.chuggy.svc.cluster.local:5432/chuggy?options=-c%20role%3Dchuggy_selector_review
            - name: CHUG_API_IDEMPOTENCY_KEYING
              valueFrom:
                secretKeyRef: { name: chuggy-api, key: idempotency-keying }
            - name: CHUG_API_OIDC_ISSUER
              value: https://auth.vteng.io
            - name: CHUG_API_OIDC_AUDIENCE
              value: https://chuggy.vteng.io/api
            # RS256 alone. The list is what `jwtVerify` will accept, so leaving
            # it wider than what Hydra signs with is the algorithm-confusion
            # surface and nothing else; `none` is refused by the API whatever is
            # written here.
            - name: CHUG_API_OIDC_ALGORITHMS
              value: RS256
            - name: CHUG_API_ARTIFACT_ROOT
              value: /var/lib/chuggy/artifacts
            - name: CHUG_API_GIT_SCRATCH_ROOT
              value: /var/lib/chuggy/git
            - name: CHUG_API_REPOSITORY_CREDENTIAL_SOURCES
              value: |
                [
                  {
                    "repository": "http://git.chuggy-git.svc.cluster.local./chuggy.git",
                    "path": "/var/run/chuggy/repository-credentials/chuggy-git"
                  },
                  {
                    "repository": "https://github.com/kasofsk/chuggy.git",
                    "path": "/var/run/chuggy/repository-credentials/chuggy-github"
                  }
                ]
            # The image already sets this. Repeated because the source default
            # is loopback and a container's loopback is its own namespace's --
            # an inherited value that no manifest states is one an image rebuild
            # can quietly drop, and the symptom would be probes that never
            # connect.
            - name: CHUG_API_HOST
              value: 0.0.0.0
            # ------------------------------------------- the /events stream ----
            #
            # THE PUBLIC PATH CLOSES AN IDLE RESPONSE AFTER 125 SECONDS, AND THE
            # HOP THAT CLOSES IT IS CLOUDFLARE'S EDGE. Measured 2026-08-26 with
            # an SSE responder behind this cluster's Traefik and this node's
            # tunnel, sending one event and then nothing: five runs -- four from
            # the node, one from a LAN client -- were each closed with an HTTP/2
            # INTERNAL_ERROR, all five within a fifth of a second of each other.
            # The same responder read directly on its pod address, and through
            # Traefik with the Host header, was still open when the client gave
            # up at 400 seconds. So the bound is not Traefik's
            # `respondingTimeouts` and not cloudflared's forwarding timeouts:
            # neither is configured on this node, both were measured past the
            # number that matters, and no middleware, IngressRoute or
            # ServersTransport is what keeps a stream alive here. There are none
            # of any of those three on this cluster.
            #
            # NOTHING ON THE PATH BUFFERS `text/event-stream`. The same
            # responder emitting every 20 seconds was read at the far end within
            # milliseconds of each write, through the edge and through Traefik.
            #
            # RE-MEASURE RATHER THAN TRUST THE NUMBER: it is Cloudflare's, this
            # repository does not set it, and it can therefore change without a
            # commit here. What establishes it is an SSE responder on a
            # tunnelled host that sends one event and then goes silent, timed
            # until the client sees the close.
            #
            # THE HEARTBEAT IS STATED HERE BECAUSE THE BOUND IT CLEARS IS THIS
            # CLUSTER'S AND NOT THE IMAGE'S. kasofsk/chuggy#318 named all five
            # `CHUG_API_STREAM_*` variables and the image above reads them; its
            # own default interval clears the close measured above with room for
            # a missed one, and that is two repositories agreeing by accident
            # rather than by anything either of them checks. Written down here,
            # a rebuild cannot move it past a number measured on the path in
            # front of this pod -- the same reason `CHUG_API_HOST` is repeated.
            #
            # THE TWO BESIDE IT ARE THE RIG'S NUMBERS RATHER THAN A REPLICA'S.
            # The connection cap bounds one process and this Deployment is one
            # process, so it is what the installation will hold open; the
            # maximum age is how long a connection lives before the client is
            # made to reconnect, which is also how a client that fell behind the
            # retained log is reset. Both are the image's defaults today.
            #
            # THE SWEEP PAIR IS DELIBERATELY LEFT TO THE IMAGE.
            # `CHUG_API_STREAM_SWEEP_MS` and `CHUG_API_STREAM_SWEEP_ROWS_MAX`
            # are the whole of the change log's retention, and what makes a pair
            # of them right is that their quotient outpaces the appends -- a
            # claim about chuggy's own defaults, made and revised where they are.
            #
            # ONE REPLICA IS WHY NOTHING PROVES ANYTHING ACROSS REPLICAS. Every
            # stream is served by the process holding the one change-log
            # listener, so a browser's events and the sequence they carry come
            # from one cursor. At two replicas that stops being true and no
            # proof anywhere says what happens instead; the gap is named here so
            # that raising `replicas` above is not how it gets discovered.
            - name: CHUG_API_STREAM_CONNECTIONS_MAX
              value: "256"
            - name: CHUG_API_STREAM_MAX_AGE_MS
              value: "300000"
            - name: CHUG_API_STREAM_HEARTBEAT_MS
              value: "20000"
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/chuggy/artifacts
              readOnly: true
            - name: git-scratch
              mountPath: /var/lib/chuggy/git
            - name: repository-credentials
              mountPath: /var/run/chuggy/repository-credentials
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          # /health/ready asks the database whether this process is connected as
          # the role it must be and may call what it must call; /health/live
          # asks the process only. Using the first for liveness would restart
          # the API every time PostgreSQL was briefly away, which is the
          # opposite of what should happen -- the pod should leave the Service
          # and come back, not lose its process.
          #
          # BOTH PROBES ARE INSIDE THE SERVER'S OWN CONCURRENCY CAP, and that is
          # accepted here rather than solved. `registerCapacity` in
          # kasofsk/chuggy's `src/adapters/http/server.ts` is an onRequest hook
          # over every route, so a caller holding the cap's worth of requests
          # open against the public `/api/v1` starves the kubelet too: these
          # probes answer 503, readiness fails within its threshold and liveness
          # restarts the container a few minutes later. It costs availability
          # and nothing else -- no data, no authorization -- against a rig
          # behind Cloudflare, and the pod that dies comes back. The fix, if it
          # is ever worth one, is a Traefik `inFlightReq` bounding the API
          # backend; it is not taken now because an Ingress-level middleware
          # here applies to every router this Ingress makes, the console
          # included, which is a worse trade for a rehearsal.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
      # The drain in the process outlasts the default grace period's usefulness
      # only if the kubelet waits for it: SIGTERM starts a drain bounded by
      # CHUG_API_SHUTDOWN_DRAIN_MS, which is unset here and therefore its own
      # default. This budget is what keeps the kubelet from killing the process
      # in the middle of that.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: chuggy-artifacts
            # Read-only on the claim as well as on the mount. The mount is what
            # the process sees; this is what the kubelet is asked for, and a
            # read-only claim cannot be made writable by a mount that forgot to
            # say so.
            readOnly: true
        - name: git-scratch
          emptyDir: {}
        - name: repository-credentials
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: chuggy-git-sync
                  items:
                    - key: password
                      path: chuggy-git
              - secret:
                  name: chuggy-github-reader-token
                  items:
                    - key: token
                      path: chuggy-github
---
apiVersion: v1
kind: Service
metadata:
  name: chuggy-api
  namespace: chuggy
  labels: { app: chuggy-api }
spec:
  selector: { app: chuggy-api }
  ports:
    - name: http
      port: 3000
      targetPort: http
