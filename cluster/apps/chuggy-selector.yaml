# The selector: the process that decides which dispatchable ticket to take
# next, from the project view the API serves it and the advisory context beside
# it.
#
# One responsibility, one pod, one command, one database role. What this file
# shares with the other five -- the shared image, the digest that moves in seven
# places, the login-role-becomes-group connection, the URL-reserved-character
# constraint on the password, the absence of any health listener -- is argued in
# chuggy-ticket-service.yaml and is not repeated.
#
# THIS WORKLOAD RUNS. Neither of the two preconditions that kept it from
# running is left. `selector-source` was answered: the credential below is what
# it was missing, and the client that credential names is registered out of
# band, which is the whole of what it takes -- an empty project list is a pass,
# so the membership row further down is what turns the pass into work rather
# than what makes it one. `selector-policy` is not answered but withdrawn:
# kasofsk/chuggy#503 deletes the protocol it asks after, in favour of what
# decides instead, and the digest below is built from a commit that carries
# that deletion. So this file describes the image it pins rather than one it is
# waiting for. Each is stated where the value that depends on it is written.
#
# ------------------------------------------------ what it reaches, and how ----
#
# It is a client of the API, not of the API's database: `source.baseUrl` is the
# in-cluster Service, and every project read goes through `/api/v1` with a
# bearer token, exactly as a console would. Its own database role is for the
# selector's own state -- interactions, attempts, deliveries, planning intents
# -- and for nothing it could read through the API instead.
#
# The base URL is the ORIGIN and not a path. The client builds `/api/v1/...`
# itself, and asks `/health/ready` at the root; a base URL carrying the version
# prefix would send both somewhere that does not exist.
#
# -------------------------------------- the token, and where it comes from ----
#
# THE SELECTOR MINTS ITS OWN AND REPLACES IT BEFORE IT EXPIRES. `ory/hydra.yaml`
# -- the document kustomization.yaml turns into the ConfigMap ory-hydra.yaml
# mounts -- sets `ttl.access_token` to fifteen minutes, deliberately, because
# nothing revokes an offline-verified JWT, so a token written into this file by
# hand is refused 401 a quarter of an hour after somebody typed it while the pod
# stays up. `source.credential` therefore names a token endpoint and a client
# rather than a token, and kasofsk/chuggy's `clientCredentialsTokenSource` asks
# Hydra for a grant and asks again before the granted expiry.
#
# THE TOKEN ENDPOINT IS REACHED IN-CLUSTER AND THE ISSUER IS NOT. Minting only
# needs the endpoint to answer; the issuer string is Hydra's own configuration
# and is in the token whichever address minted it, so `hydra-public` over the
# pod network is enough here -- and it is a destination the selector's egress
# rule has to name, which chuggy-control-plane-network-policy.yaml does.
# Verification is the opposite case and chuggy-api.yaml argues it there: the
# issuer is compared for equality, so that pod leaves the cluster for the keys.
#
# `scope` IS EMPTY BECAUSE NOTHING READS ONE. The API decides by the issuer, the
# audience and the project membership of the principal the token names, and a
# scope requested here would be a string no reader checks -- which is worse than
# none, because it reads like an authorization that is being enforced.
#
# THE TWO DURATIONS ARE THIS DEPLOYMENT'S AND NOT THE ISSUER'S. A held token
# stops being handed out `refreshMarginMs` before its expiry -- a minute, so a
# mint that fails has a minute of still-good token to be retried in.
# `mintCooldownMs` bounds grant requests to one per ten seconds however many
# reads arrive and however many of them fail, and the command refuses to start
# unless it is shorter than the margin, because a cooldown that is not shorter
# is one that leaves no room for that retry.
#
# THE CLIENT ITSELF IS OUT OF BAND, like the secret it authenticates with, and
# so is the API's opinion of it: a project membership row for the principal its
# tokens carry is what turns a verified token into a project this selector may
# read. The client and the secret are named under the Secrets below. The
# membership row is not, and nothing here can write one -- it is granted through
# the API, like any other project access.
#
# ------------------------------------------- the policy, and where it lives ----
#
# THE PROJECT'S LEAD IS THE POLICY, AND IT IS NOT A SERVICE. A decision is a
# turn offered on the lead session's mailbox: the selector writes the turn,
# waits for it to be answered, and reads the answer back as the decision. The
# mailbox is a set of definer functions on the database this pod already
# connects to, granted to the role the URL below selects, so the whole of the
# policy protocol is the connection the first section of this file argues.
#
# NOTHING HERE NAMES A POLICY HOST, BECAUSE THE IMAGE THIS PINS DOES NOT READ
# ONE. The trusted selector policy protocol -- a base URL, a bearer token, a
# media type and a client -- was retired by kasofsk/chuggy#503, which deletes
# `src/adapters/http/trustedSelectorPolicy.ts` and composes `leadPolicyHost`
# over `postgresLeadMailbox` in its place. Every image built before that commit
# requires the `policy` block and refuses without it, which is why the block
# and the digest move in the same commit and neither may move alone. There is
# no `policy` block here, no second Secret key and no egress arm; the network
# policy file states the same thing from the other side.
#
# WHAT RUNS THE TURN IS NOT THE SELECTOR'S TO CONFIGURE. A lead turn is placed
# as a session pod by `chuggy-scheduler.yaml` and claimed through
# `chuggy-worker-plane.yaml`; this Deployment offers the turn and reads the row.
# So a selector that cannot get an answer is a scheduler or a plane finding, and
# the decision it records says which.
#
# ------------------------------------------------------------- the Secrets ----
#
# Out of band, because this repository is public. The value is the selector's
# own, so it is its own Secret rather than another key on the credential Secret
# the machine layer synchronizes:
#
#   kubectl -n chuggy create secret generic chuggy-selector \
#     --from-literal=source-client-secret=<the client secret Hydra returned>
#
# THERE IS ONE KEY NOW AND THERE WERE TWO. `policy-bearer-token` authenticated
# the retired policy protocol and nothing reads it; a Secret already carrying it
# keeps a value no pod mounts, which is worth deleting where it stands rather
# than leaving as a credential nobody can account for.
#
# The client that secret belongs to is registered on the admin port, and its id
# is the `clientId` below rather than a generated one, so the configuration can
# name it and so the subject its tokens carry is readable in the API's records:
#
#   kubectl -n ory exec deploy/hydra -c hydra -- hydra create oauth2-client \
#     --endpoint http://127.0.0.1:4445 --id chuggy-selector \
#     --name chuggy-selector --grant-type client_credentials \
#     --audience https://chuggy.vteng.io/api
#
# The audience there is what Hydra must GRANT, and chuggy-api.yaml states the
# same string as what the API requires; a client registered without it gets
# tokens every read is refused on. The default token-endpoint authentication is
# `client_secret_basic`, which is what the command presents.
#
# A `secretKeyRef` naming a key that is not there refuses to start the pod,
# which is the right failure: a selector with no credential should not run.
#
# THE DATABASE PASSWORD IS NOW THE ONLY SECRET INTERPOLATED INTO A JSON STRING,
# and it alone carries the constraint chuggy-ticket-service.yaml states in full:
# a `"` or a `\` in it makes the configuration below unparseable, and a `$(` is
# expanded by the kubelet before the process ever reads it. The client secret is
# read from a variable of its own instead of being interpolated into that
# document, so whatever Hydra generates is safe there. Nothing else is
# substituted into the document but the pod's own name.
#
# That constraint was worth stating twice while a hand-typed token was in the
# document too. It is not any more: the password comes from the machine layer's
# hex generator, which satisfies the whole list by construction, and there is no
# longer a value here that somebody invents.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chuggy-selector
  namespace: chuggy
  annotations:
    fabric.chuggy.dev/source-commit: d8821c10
  labels: { app: chuggy-selector }
spec:
  # ONE, BECAUSE THERE IS FINALLY SOMETHING FOR IT TO ASK. The zero here was
  # argued from `selector-policy` alone: a precondition asking a protocol
  # nothing served, which no release could clear and which a replica would have
  # restated every backoff interval as one more red pod for a real one to hide
  # behind. That precondition no longer exists -- the section above says what
  # decides in its place -- so the number that was argued from it goes with it.
  #
  # ONE AND NOT MORE, and that is a bound rather than a resource decision. Every
  # decision this process writes is named after the instance that wrote it, and
  # two instances sweeping one installation would offer two turns to one lead
  # for one project's change. `strategy: Recreate` is the same rule during a
  # roll: the old pod is gone before the new one starts, so a rollout never puts
  # a second sweeper beside the first.
  #
  # THIS NUMBER, THE CONFIGURATION BELOW AND THE IMAGE ABOVE MOVE TOGETHER, and
  # unlike at zero that is now visible. An image built before the retirement,
  # handed this document, writes `selector configuration:` and exits; at one
  # replica a pod that exits is a CrashLoopBackOff rather than a manifest nobody
  # parses. The digest above is built from a commit after 5b3f381, the commit
  # that retires the protocol; release 18 was the first that could raise the
  # number, no earlier one could have, and every release since carries a digest
  # from a later commit.
  #
  # A Deployment with no available replica never passes `wait: true`, which
  # health-checks every object in this directory; at zero this object was out of
  # that set and it is now in it, beside chuggy-finalizer.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: chuggy-selector }
  template:
    metadata:
      labels:
        app: chuggy-selector
        chuggy.dev/postgres-client: "true"
        # This is the only workload in this namespace that calls the API from
        # inside the cluster, and chuggy-control-plane-network-policy.yaml
        # admits port 3000 by this label. Traefik reaches the API by a rule of
        # its own; nothing else here may.
        chuggy.dev/api-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: selector
          image: registry.chuggy.internal/chuggy/api@sha256:42a7d0fcc1e7b89dfae3e2d5653bda589dc0e6c02bc3a3d84a3f3446d2559145
          imagePullPolicy: IfNotPresent
          command:
            [
              node,
              --experimental-strip-types,
              src/roots/selector.ts,
            ]
          env:
            - name: CHUG_SELECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  {
                    name: chuggy-postgres-credentials,
                    key: selector-service-password,
                  }
            # The one value the configuration document below does not carry.
            # The command reads it from here directly and joins it to the rest
            # of `source.credential`, which is how a public repository can hold
            # every other field of a credential.
            - name: CHUG_SELECTOR_SOURCE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  { name: chuggy-selector, key: source-client-secret }
            # Every operation and decision this process writes is named after
            # the instance that wrote it, so the pod is the instance. A fixed
            # string would make two pods' work indistinguishable in the journal.
            - name: CHUG_POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            # `selector` is omitted: its three bounds have defaults in
            # kasofsk/chuggy's selector runtime, and restating a default is how
            # two copies of one number come to disagree.
            #
            # THE DOCUMENT'S SHAPE IS `selectorConfiguration`'s AND THAT SCHEMA
            # IS STRICT: a key it does not name refuses the process as surely as
            # a key it requires and does not find. `policy` is required by every
            # image built before the retirement and named by none built after,
            # and `lead` is the exact converse, which is why this document and
            # the digest above have to move together and why neither half of the
            # swap is a separable edit.
            #
            # `lead` IS THE LEAD HOST'S TWO NUMBERS AND ONE NAME, AND NO
            # DESTINATION. The host offers a turn on the lead session's mailbox
            # and reads the row back until it settles, so `pollIntervalMs` is how
            # often it asks the database a question it already holds a connection
            # for -- two seconds, because a lead turn is minutes long and a
            # shorter interval buys latency nobody observes at the cost of a
            # query per pod per tick. `controlDeadlineMs` bounds the OTHER two
            # calls, `cancel` and `inspect`, which is what the retired block's
            # field of the same name bounded; the value is carried across
            # unchanged, because the thing it bounds did not change when the
            # protocol under it did. Neither number bounds a decision: the turn's
            # own envelope is a per-project setting and is not written here.
            #
            # `credentialSlot` IS THE ONE FIELD OF THE THREE THAT PLACES A POD.
            # The image this pins opens a project's lead itself where none is
            # open, and the session row it writes carries the slot a pod for that
            # lead will speak through; `kubernetesSessionPodRequest` denies a
            # placement whose slot `CHUG_SCHEDULER_SESSION_POLICY`'s grant does
            # not name, so this value is one of that grant's credentials or every
            # lead turn is denied at pod time rather than here. Of the two it
            # grants, `chuggy-git-worker` is a git password and `claude-code` is
            # the model credential -- and it is the same slot the api names in
            # `CHUG_API_THREAD_CREDENTIAL_SLOT` for a member's thread, because a
            # lead and a thread reach the model the same way on this site. It is
            # required and the schema is strict, so an image built after
            # kasofsk/chuggy#545 refuses a document without it: the field arrives
            # in the same commit as the digest that requires it, for the reason
            # the swap above arrived in one.
            #
            # CHUG_SELECTOR_THREAD_WAKES_PER_PASS_MAX is unset, and unset is not
            # unbounded. The wake pass caps what it asks for at the contract's
            # own ceiling however this reads, so an unset variable is that
            # ceiling and a larger one would be a configured bound that is not
            # the bound that runs. A deployment writes it to go LOWER; this one
            # has no reason to.
            #
            # `identity.principal` is not what gets this workload past the
            # API -- the token is, and the HTTP client discards this value on
            # every call, so nothing observable turns on what is written here
            # today. It is written as the principal the API derives from the
            # same token anyway, because the day something does read it, a value
            # that was never that principal is two names for one actor.
            #
            # That derivation is `oidcPrincipal` in kasofsk/chuggy: the issuer's
            # length, a colon, the issuer, then the subject, so that no pair of
            # issuer and subject encodes to another pair's string. The issuer is
            # the one chuggy-api.yaml verifies against and the subject of a
            # client-credentials token is the client's id, which is why that id
            # is set by hand where the client is created.
            - name: CHUG_SELECTOR_CONFIG
              value: |
                {
                  "database": {
                    "url": "postgres://chuggy_selector_service_login:$(CHUG_SELECTOR_PASSWORD)@postgres.chuggy.svc.cluster.local:5432/chuggy?options=-c%20role%3Dchuggy_selector_service"
                  },
                  "runtime": {
                    "idleIntervalMilliseconds": 1000,
                    "shutdownDrainMilliseconds": 15000
                  },
                  "identity": {
                    "principal": "21:https://auth.vteng.iochuggy-selector",
                    "instance": "$(CHUG_POD_NAME)"
                  },
                  "source": {
                    "baseUrl": "http://chuggy-api.chuggy.svc.cluster.local:3000",
                    "requestDeadlineMs": 10000,
                    "responseBytesMax": 1048576,
                    "responseReadsMax": 1024,
                    "credential": {
                      "tokenUrl": "http://hydra-public.ory.svc.cluster.local:4444/oauth2/token",
                      "clientId": "chuggy-selector",
                      "audience": ["https://chuggy.vteng.io/api"],
                      "scope": [],
                      "refreshMarginMs": 60000,
                      "mintCooldownMs": 10000
                    }
                  },
                  "lead": {
                    "pollIntervalMs": 2000,
                    "controlDeadlineMs": 30000,
                    "credentialSlot": "claude-code"
                  }
                }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
