# How long chuggy's tickets take, and where the time goes, on one page: how
# long work and evaluation cycles took, how a landed ticket's time divides
# between its phases, how long evaluation stages, the agent's runs and the
# wait for a runner took, and lead and run time, read from the series
# chuggy-metrics-plane-monitor.yaml has Prometheus scrape. It is the tickets
# page's deep dive on time, and each page's header links to the other.
#
# THE DASHBOARD'S UID IS AN ADDRESS. `/d/chuggy-ticket-timings` is the page,
# and a link handed to someone is not this file's to change: renaming the uid
# breaks every one already given out.
#
# A DISTRIBUTION IS A HISTOGRAM'S BUCKETS, COUNTED OVER THE SELECTED TIME, or
# over each day in a heatmap. Its query sums every bucket of one family by
# `le` alone and is read as a heatmap, so Grafana takes from each bucket the
# one below it and a bar or cell counts what fell in its bucket alone. A bar
# is named by its bound, the one named for five minutes counting what fell
# over the bound before it and up to five minutes.
#
# WHO AND REPOSITORY ARE VIEWS, NOT BOUNDARIES, as on the tickets page. Every
# selector matches `owner=~"$owner"` and `repository=~"$repository"`.
# Repository is the clone URL a ticket names, shown as owner and name; All is
# `.*`, which matches a ticket that names none too. Whoever signs in can
# query every series whatever this page shows.
#
# EVERY QUERY SUMS, AND ONLY BY ITS FAMILY'S OWN LABELS, so a release
# replacing the plane's pod draws no new line, and each ratio divides two sums
# grouped alike.
#
# A STAGE READS AS ITS CONFIGURATION NAMES IT, or as its number where the
# configuration names none, as on the tickets page.
#
# A RANGE COUNTS A SERIES FROM ITS FIRST VALUE, as on the usage page: the
# plane names when each series began, as its OpenMetrics `_created`, and
# Prometheus writes a zero at that time (cluster/apps/monitoring.yaml's
# created-timestamp-zero-ingestion).
#
# It is a plain ConfigMap for the reason release-dashboard.yaml's is: the
# sidecar finds it by label and nothing mounts it. dashboards/ticket_timings.py
# writes this file whole; tests/ticket-timings-dashboard.py holds it to that
# writer and to what its own header lists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chuggy-ticket-timings-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  chuggy-ticket-timings.json: |-
    {
      "uid": "chuggy-ticket-timings",
      "title": "Chuggy ticket timings",
      "description": "How long chuggy's tickets take and where the time goes: work and evaluation cycles, a landed ticket's phases, evaluation stages, the agent's runs, the wait for a runner, and lead and run time, from the metrics plane. Who narrows the page to the tickets the signed-in person created, and Repository to those of a repository; each is a view, not a boundary.",
      "tags": [
        "chuggy"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "graphTooltip": 1,
      "timezone": "browser",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "refresh": "5m",
      "templating": {
        "list": [
          {
            "name": "tenant",
            "label": "Tenant",
            "description": "The tenants whose tickets the plane has counted.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(chuggy_tickets, tenant)",
            "definition": "label_values(chuggy_tickets, tenant)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "project",
            "label": "Project",
            "description": "The selected tenants' projects.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(chuggy_tickets{tenant=~\"$tenant\"}, project)",
            "definition": "label_values(chuggy_tickets{tenant=~\"$tenant\"}, project)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "repository",
            "label": "Repository",
            "description": "The repositories the selected projects' tickets name. All includes a ticket that names none.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(chuggy_tickets{tenant=~\"$tenant\", project=~\"$project\"}, repository)",
            "definition": "label_values(chuggy_tickets{tenant=~\"$tenant\", project=~\"$project\"}, repository)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "regex": "/^(?<value>.*?(?<text>[^\\/:]+\\/[^\\/]+?)(?:\\.git)?)$/"
          },
          {
            "name": "owner",
            "label": "Who",
            "description": "Everyone's tickets, or only those the signed-in person created.",
            "type": "custom",
            "query": "Everyone : .*,Me : ${__user.login}",
            "multi": false,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": "Everyone",
              "value": ".*"
            },
            "options": [
              {
                "selected": true,
                "text": "Everyone",
                "value": ".*"
              },
              {
                "selected": false,
                "text": "Me",
                "value": "${__user.login}"
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "At a glance",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Median work cycle",
          "description": "Half the work cycles that ended over the selected time took longer than this, from the entry that put the ticket in work to its next entry. Approximate: interpolated within coarse buckets.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (increase(chuggy_ticket_work_cycle_duration_seconds_bucket{tenant=~\"$tenant\", project=~\"$project\", repository=~\"$repository\", owner=~\"$owner\"}[$__range])))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No data",
                      "index": 0
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Median evaluation cycle",
          "description": "Half the evaluation cycles that ended over the selected time took longer than this, from the work's acceptance or a resume to the entry that took the ticket out of evaluation. Approximate: interpolated within coarse buckets.",
