# Repository declarations become available without a browser action. The
# importer reads the repositories a project is bound to and writes configuration
# history; it cannot move a ref on the forge or on the internal repository.
#
# THE RUN IS THE ESTATE AND NOT A LIST. A binding is what says a project takes
# its declarations from a repository, so the bindings in the database are the
# list and this file names no repository, no commit and no partition. The
# command refuses a configuration that names one, which is what keeps a second
# copy of the estate from growing back here. Each repository is imported at its
# own head, one binding's failure stops no other, and a run that filled its
# listing bound leaves non-zero saying so.
#
# WHAT IT READS WITH. The portal App key below, minted per repository as it is
# read, so a repository reaches this run by being bound rather than by anything
# arriving in this file. A repository the key does not cover would need an entry
# in `credentialSources` and a Secret projected at the file it names; there is
# none on this site.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chuggy-configuration-importer
  namespace: chuggy
  annotations:
    fabric.chuggy.dev/source-commit: 71916275
  labels: { app: chuggy-configuration-importer }
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: chuggy-configuration-importer
            chuggy.dev/postgres-client: "true"
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          # kube-router admits the pod IP asynchronously. Keep retrying from
          # this same sandbox until its PostgreSQL policy is programmed; a
          # replacement Job pod would receive a new IP and repeat the race.
          initContainers:
            - name: wait-for-postgres
              image: postgres:18.3-trixie
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 15); do
                    pg_isready -h postgres.chuggy.svc.cluster.local -U chuggy_configuration_importer_login -t 2 && exit 0
                    sleep 2
                  done
                  exit 1
              resources:
                requests: { cpu: 25m, memory: 32Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile: { type: RuntimeDefault }
          containers:
            - name: importer
              image: registry.chuggy.internal/chuggy/api@sha256:238a440887a020ad2bcc1fced0f634382118f12638d00ba0a8a0432b315917e9
              imagePullPolicy: IfNotPresent
              command:
                [
                  node,
                  --experimental-strip-types,
                  src/roots/configurationImporter.ts,
                ]
              env:
                - name: CHUG_CONFIGURATION_IMPORTER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: chuggy-postgres-credentials
                      key: configuration-importer-password
                # `credentialSources` is empty and stays a key: there is no
                # repository on this site the App key does not cover, and a run
                # naming neither is refused before the database is opened.
                - name: CHUG_CONFIGURATION_IMPORT_CONFIG
                  value: |
                    {
                      "database": {
                        "url": "postgres://chuggy_configuration_importer_login:$(CHUG_CONFIGURATION_IMPORTER_PASSWORD)@postgres.chuggy.svc.cluster.local:5432/chuggy"
                      },
                      "git": {
                        "scratchDirectory": "/var/lib/chuggy/git",
                        "credentialSources": [],
                        "credentialUsername": "x-access-token",
                        "localTimeoutSecsMax": 120,
                        "remoteTimeoutSecsMax": 120
                      },
                      "forge": {
                        "appId": "4708055",
                        "keyFile": "/var/run/chuggy/forge-app/private-key"
                      }
                    }
              volumeMounts:
                - name: scratch
                  mountPath: /var/lib/chuggy/git
                - name: forge-app
                  mountPath: /var/run/chuggy/forge-app
                  readOnly: true
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: scratch
              emptyDir: {}
            # THE PORTAL APP'S KEY, WHICH EVERY READ THIS RUN MAKES IS MINTED
            # FROM. chuggy-api.yaml holds the command that makes the Secret and
            # argues the mode; what this mount widens is this pod, which can
            # now read any repository on an account a tenant claimed the portal
            # App under, where it previously read the two whose reader tokens
            # it projected.
            - name: forge-app
              secret:
                secretName: chuggy-github-app-portal
                defaultMode: 0444
                items:
                  - key: private-key
                    path: private-key
