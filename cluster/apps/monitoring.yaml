# Prometheus + Grafana, via kube-prometheus-stack.
#
# This is what made helm-controller necessary; see modules/flux.nix. There is no
# sensible plain-manifest equivalent of this chart -- it is the operator, its
# CRDs, node-exporter, kube-state-metrics, and a few dozen dashboards.
#
# The Grafana admin credential is NOT here. It lives in a Secret created out of
# band, the same rule as the cloudflared tunnel credential:
#
#   kubectl create secret generic grafana-admin -n monitoring \
#     --from-literal=admin-user=admin --from-literal=admin-password=<pw>
#
# Without `admin.existingSecret` the chart falls back to the well-known default
# password `prom-operator`, which on a publicly reachable Grafana is the same as
# no password at all.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      # Pinned, like every other version in this repo. Bump deliberately.
      version: "88.5.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: Create
    timeout: 10m
  upgrade:
    crds: CreateReplace
  values:
    # k3s runs the control plane as one process, so these have no separately
    # scrapeable endpoint. Left enabled they become targets that are permanently
    # down and alerts that never clear -- which trains you to ignore the alerts.
    kubeControllerManager: { enabled: false }
    kubeScheduler: { enabled: false }
    kubeEtcd: { enabled: false }
    kubeProxy: { enabled: false }

    # A virtual kubelet serves none of /metrics, /metrics/cadvisor or
    # /metrics/probes, so its kubelet targets would be permanently down for the
    # same reason. Its host is scraped by macos-node-exporter.yaml instead. Each
    # list restates the chart's metrics_path rule, which setting it replaces.
    kubelet:
      serviceMonitor:
        attachMetadata: { node: true }
        relabelings:
          - { action: drop, sourceLabels: [__meta_kubernetes_node_label_type], regex: virtual-kubelet }
          - { action: replace, sourceLabels: [__metrics_path__], targetLabel: metrics_path }
        cAdvisorRelabelings:
          - { action: drop, sourceLabels: [__meta_kubernetes_node_label_type], regex: virtual-kubelet }
          - { action: replace, sourceLabels: [__metrics_path__], targetLabel: metrics_path }
        probesRelabelings:
          - { action: drop, sourceLabels: [__meta_kubernetes_node_label_type], regex: virtual-kubelet }
          - { action: replace, sourceLabels: [__metrics_path__], targetLabel: metrics_path }

    # What each Flux object says of itself, as a series: whether it is ready,
    # whether it is suspended, and the revision it holds. Flux's controllers
    # export how long a reconcile took and never what state an object is in, so
    # kube-state-metrics reads the objects, which is the arrangement Flux
    # documents and these entries are its own (fluxcd/flux2-monitoring-example),
    # for the kinds this cluster has objects of.
    #
    # THE STOCK COLLECTORS STAY. That example also sets `collectors: []` and
    # `--custom-resource-state-only`, for a kube-state-metrics that does nothing
    # else. Here that would take away every `kube_*` series the chart's own
    # rules read, KubeJobFailed among them, which is how a failed dump or
    # migration is announced.
    #
    # A KIND NEEDS BOTH HALVES. One listed under `resources` without its plural
    # in the rule above it is refused by the API server on every list, and the
    # only sign is a line in this pod's log and a table with no rows.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - kustomizations
              - gitrepositories
              - ocirepositories
              - helmrepositories
              - helmcharts
              - helmreleases
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: { group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: OCIRepository }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux OCIRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: HelmChart }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmChart resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      chart_name: [spec, chart]
                      chart_version: [spec, version]
              - groupVersionKind: { group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_app_version: [status, history, "0", appVersion]
                      chart_ref_name: [spec, chartRef, name]
                      chart_source_name: [spec, chart, spec, sourceRef, name]

    # Rules still evaluate and show as firing in the UI; there is simply nowhere
    # to route them yet. Turn this on when there is an actual destination for a
    # page.
    alertmanager:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 15d
        # local-path PVCs are directories on the node that created them, so this
        # pod is pinned here regardless. Saying so explicitly is the habit that
        # keeps stateful work off spot agents later.
        nodeSelector:
          chuggy.dev/durable: "true"
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 3Gi }
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests: { storage: 20Gi }

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      nodeSelector:
        chuggy.dev/durable: "true"
      persistence:
        enabled: true
        storageClassName: local-path
        size: 5Gi
      resources:
        # 512Mi was below what this chart's two dozen dashboards need, and the
        # sawtooth was the ceiling rather than a leak.
        #
        # DO NOT ADD GOMEMLIMIT HERE. The chart already emits it, wired to
        # whatever limit this block sets, and a second one from `env` renders a
        # duplicate that the API server rejects on upgrade -- one entry carrying
        # both `value` and `valueFrom`. Raising the limit raises Go's backstop
        # with it, which is the whole of the control available.
        #
        # That backstop was never the problem. Go paces the heap against the
        # live set rather than growing to fill the ceiling, so at 512Mi it was
        # already collecting hard with the heap pressed against the limit --
        # leaving no room for what the Go runtime does not account for, which
        # here is the page cache behind the mmap'd bleve search index. The
        # cgroup went over on memory Go was never counting.
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 1Gi }
      grafana.ini:
        server:
          # Without this, Grafana builds redirect and share links from the
          # in-cluster address and they break the moment you follow one.
          root_url: https://grafana.vteng.io
        users:
          allow_sign_up: false
        auth.anonymous:
          enabled: false
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts: [grafana.vteng.io]
        path: /
        pathType: Prefix
