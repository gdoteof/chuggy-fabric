# The registry releases are published to, and nothing else is.
#
# A REGISTRY OF ITS OWN, BECAUSE WHO MAY WRITE A RELEASE IS DECIDED BY WHO
# REACHES IT. Distribution has no authentication here and a NetworkPolicy
# cannot tell a push from a pull, so the one way to keep a pod from writing a
# release is to keep it from the registry that holds them. `registry` admits
# every build pod, and a build pod runs a Dockerfile; this one admits the pods
# of the `publish-release` Task, which run none, and Flux's source-controller,
# which reads what `chuggy-release` in cluster/flux/sources.yaml names.
#
# THE SAME VOLUME UNDER ANOTHER ROOT. It mounts `registry`'s claim whole and
# keeps everything under `release/` there, which registry/release.yml names:
# a directory `registry` and `registry-public` never read, because neither is
# given a root that holds it. They are three processes of one user on one
# volume all the same. What separates a build pod from a release is that it
# cannot ask `registry` for a path outside that registry's own root, and not
# anything the volume enforces.
#
# AN OPERATOR REACHES IT FROM THE NODE, by this Service's address, as
# README.md's "Registry operations" reaches `registry`. A NetworkPolicy binds
# a pod's connections: a process on the node is not a pod, and a pod on the
# node's network is not bound either.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-registry
  namespace: chuggy-registry
  labels: { app: release-registry }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: release-registry }
  template:
    metadata:
      # Never `app: registry`: the `registry` Service selects that label, and
      # a build's push through it would land on this pod.
      labels: { app: release-registry }
    spec:
      # The volume is a local one on the durable node, so this pod runs where
      # `registry` does.
      nodeSelector:
        chuggy.dev/durable: "true"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: registry
          image: registry:3@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
          imagePullPolicy: IfNotPresent
          args: [/etc/distribution/config.yml]
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet: { path: /v2/, port: registry }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /v2/, port: registry }
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/distribution/config.yml
              subPath: config.yml
              readOnly: true
            - name: storage
              mountPath: /var/lib/registry
      volumes:
        - name: config
          configMap:
            name: release-registry-config
        - name: storage
          persistentVolumeClaim:
            claimName: registry
---
apiVersion: v1
kind: Service
metadata:
  name: release-registry
  namespace: chuggy-registry
spec:
  selector: { app: release-registry }
  ports:
    - name: registry
      port: 5000
      targetPort: registry
---
# `tekton.dev/task` AND NOT `tekton.dev/taskRun`. Every task pod in
# `chuggy-build` carries the second, a build's among them. The first is the
# Task a TaskRun names, written on its pod by Tekton over whatever the run
# carried, and a build is a run of another Task.
#
# A LABEL IS WHAT ITS WRITER SAYS. A run that carries steps of its own and
# names no Task keeps the `tekton.dev/task` it was created with, and so does a
# pod created there by hand. So this admits whoever can create a run or a pod
# in `chuggy-build`. The release trigger's ServiceAccount can create runs
# there, and cluster/build-system/release-trigger.yaml holds those to one by
# admission.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: release-registry-admits-publish-and-flux
  namespace: chuggy-registry
spec:
  podSelector:
    matchLabels: { app: release-registry }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chuggy-build
          podSelector:
            matchLabels: { tekton.dev/task: publish-release }
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels: { app: source-controller }
      ports:
        - { protocol: TCP, port: 5000 }
