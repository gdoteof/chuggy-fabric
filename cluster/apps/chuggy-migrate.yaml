# The schema, applied by the one command in kasofsk/chuggy that applies it.
#
# `src/roots/migrate.ts` plans the ledger already in the database against the
# one this image declares and refuses to touch a database that is not a prefix
# of it. Nothing else in that tree applies the schema, and nothing in this
# repository knows what the schema is -- which is the point: the image carries
# its own migrations and this file only says which database and as whom.
#
# THIS COMMAND DOES NOT EXIST BEFORE kasofsk/chuggy#242. The image tag below
# must be built from a commit that carries it; a tag that does not has no
# `src/roots/migrate.ts` and the container exits on a module that is not there.
#
# ------------------------------------------------------------ the ordering ----
#
# A JOB DOES NOT BLOCK THE DEPLOYMENTS BESIDE IT. kustomize-controller applies
# this directory as one set, so the five control-plane workloads start while
# this is still running, and on a fresh database they start against a schema
# that is not there yet.
#
# That is safe, and it is safe because of the processes rather than because of
# anything here. Every command asserts `schema-compatible` before it serves --
# the applied ledger against the contract its own image declares -- and reports
# a mismatch as could-not-run. So the sequence on a fresh database is: pods
# start, report the schema they do not have, exit, and the kubelet backs them
# off; this Job commits; the next restart finds the schema and the pods come up.
# The ordering is enforced by the thing that would be wrong without it.
#
# The alternative was a second Flux Kustomization with `dependsOn`, which would
# order the apply -- and would buy nothing the precondition does not already
# guarantee, at the cost of splitting `cluster/apps/` into two reconcilers with
# their own intervals and their own failure modes.
#
# ---------------------------------------------------- the name is the tag ----
#
# A Job's pod template is immutable, so re-applying this file with a new image
# under the same name is rejected by the API server -- the reconcile fails and
# nothing migrates. Naming the Job after the tag makes a re-tag a different
# object: Flux creates the new one and, because `prune: true` is set on the
# Kustomization, deletes the old one in the same pass.
#
# It also makes the run visible. `kubectl -n chuggy get jobs` names the exact
# image whose schema this database was last brought to.
#
# NO `ttlSecondsAfterFinished`. A completed Job that deletes itself is one Flux
# re-creates on its next reconcile, so the migration would run every five
# minutes forever. It is idempotent -- a second run applies nothing and says so
# -- but a rerun loop is not what an idempotent command is for.
#
# WHICH MAKES A FAILED MIGRATION TERMINAL, AND THAT NEEDS A HUMAN. The two
# properties above are for a CHANGED tag. When the tag does not change and the
# run exhausts `backoffLimit` below, this object is `Failed` and stays that
# way: Flux re-applies a byte-identical Job every five minutes, the API server
# accepts it as unchanged, and NOTHING RUNS AGAIN. There is no self-healing
# path.
#
# THE KUSTOMIZATION DOES NOT STAY GREEN, AND SAYING IT DID WOULD COST THE ONE
# SIGNAL THERE IS. gotk-sync.yaml sets `wait: true`, which health-checks every
# object this directory applies with kstatus, and kstatus reads a Job carrying
# `Failed=True` as failed rather than as merely finished. So `apps` goes
# `Ready=False` with this Job among the objects its message names, and stays
# there until a human clears it.
#
# WHAT THAT SIGNAL IS WORTH IS LESS THAN IT SOUNDS, for the reason the README's
# "what does not work yet" gives: four of the five Deployments beside this Job
# never reach an available replica either, so `apps` is `Ready=False` before it
# has run at all and a failure here adds a line to a list that is already long.
# Nothing routes it anywhere -- Alertmanager is off and notification-controller
# is not installed -- so it is read by looking. Read the message, not the bit.
#
# The recovery is to read the pod, fix the cause, and delete the Job so the
# next reconcile builds it afresh:
#
#   kubectl -n chuggy logs job/chuggy-migrate-<tag>
#   kubectl -n chuggy delete job chuggy-migrate-<tag>
#
# THIS IS WHERE THIS RIG LANDS TODAY, and the cause is a role membership rather
# than anything about the schema. Migration 17 of the image below is
# `GRANT EXECUTE ON FUNCTION project_capacity_account(text,text) TO chuggy_api`.
# On this rig that function is owned by `chuggy_boundary_owner`, `chuggy_owner`
# -- the role this Job connects as -- is not a member of that role, and the
# function's ACL grants `chuggy_owner` nothing: an earlier migration revoked
# EXECUTE from PUBLIC, so the only entries are the owner's and the ticket
# service's.
#
# THAT LAST DETAIL IS WHAT DECIDES ERROR VERSUS WARNING, and the difference
# matters because one of them is silent. PostgreSQL raises `ERROR: permission
# denied for <object>` when the granting role holds NO privilege on the object
# at all, and downgrades to `WARNING: no privileges were granted` only when it
# holds some without grant option. Here it holds none, so this is the error --
# and the runner applies every pending version in ONE transaction, so it rolls
# migration 16 back with it, `migrate.ts` exits 1 having applied nothing, and
# the second attempt does the same. Loud, and nothing committed.
#
# HAD PUBLIC KEPT ITS DEFAULT EXECUTE, this would have been the warning instead:
# the statement would have succeeded granting nothing, the ledger row beside it
# would have committed, and the API's selector-context reads would fail at
# runtime against a database reporting version 17. The revoke is what turns
# that into a failure someone finds. It is not there for this reason and it does
# this anyway, which is worth knowing before anyone relaxes it.
#
# WHAT FIXES IT IS NOT A RE-RUN OF THIS JOB. Deleting it re-runs a migration
# that fails identically. `GRANT chuggy_boundary_owner TO chuggy_owner` is what
# makes the statement legal, kasofsk/chuggy#242's
# `deploy/rig/postgres/postgres-roles.sql` carries it, and re-running that file
# against this database is a prerequisite this Job cannot express: it is applied
# on the first reconcile after the tag lands, and the roles file is run by a
# human against the server. The ordering is in the README's "Before any of it
# runs" and nowhere else, because there is nowhere else it could be.
#
# The consolation is that nothing commits. The ledger stays where it was, so
# the roles file and then a `kubectl delete job` is the whole recovery, in that
# order.
#
# An image that is simply absent from the node does NOT land here. That pod
# sits in `ImagePullBackOff` and the Job stays `Active`, so importing the image
# is enough and nothing needs deleting. THAT AND THE ABSENT
# `activeDeadlineSeconds` ARE ONE DECISION, not two: a deadline ends a Job by
# the wall clock whatever its pod is doing, so it would turn that wait into the
# terminal `Failed` state above for a cause a `ctr images import` clears on its
# own. What it costs is that a migration wedged on a lock waits forever, which
# is the trade a single-node rig with one operator can make.
#
# ----------------------------------------------------------- the credential ----
#
# `chuggy_owner`, and no `role=` option: it is a login role in its own right and
# it is the role that owns the relations. Every other workload in this namespace
# connects as a login role and then becomes a group; this one is the exception,
# and it is the exception because a migration must own what it creates.
#
# It holds CREATEROLE, which is what lets the migration create its own group
# roles. That is not superuser, and kasofsk/chuggy's `deploy/rig/postgres/postgres-roles.sql`
# carries the argument for why the difference is load-bearing.
#
# OWNING THE RELATIONS IS NOT ENOUGH ON ITS OWN. Part of what the schema
# declares is owned by `chuggy_boundary_owner` rather than by this role -- that
# is the separation the boundary functions exist for -- so a migration statement
# that grants on one of them is granting on an object this credential neither
# owns nor holds grant option for. What makes those statements legal is
# MEMBERSHIP in that role, which the roles file grants and which this Job cannot
# grant itself. A database rolled out before the file carried it is the terminal
# failure argued above.
#
# The database is `chuggy_rehearsal` for the reason chuggy-api.yaml gives at
# length. All six objects in this namespace that hold a chuggy role name the
# same database; the swap that file describes moves all six.
---
apiVersion: batch/v1
kind: Job
metadata:
  # The suffix is the image tag below. Change one and change the other.
  name: chuggy-migrate-3411172
  namespace: chuggy
  labels: { app: chuggy-migrate }
spec:
  # One attempt, then a second. A migration that fails twice fails for a reason
  # a retry does not fix -- a lock it cannot take, a statement the schema
  # refuses, a ledger this image is behind -- and each attempt leaves its own
  # pod, so the diagnostic of the first is still readable after the second.
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: chuggy-migrate
        # postgres-network-policy.yaml admits this label and this namespace and
        # nothing else. Without it the connection is refused by the policy and
        # the migration reports a database that is down.
        chuggy.dev/postgres-client: "true"
    spec:
      # A pod that fails is kept and a new one is made, so the failure is still
      # there to read. `OnFailure` would restart the container in place and
      # overwrite the log of the attempt that explained itself.
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: chuggy.invalid/api:3411172
          imagePullPolicy: IfNotPresent
          # Exec form with node as PID 1, for the reason the image's Dockerfile
          # gives: the process is handed SIGTERM itself rather than through a
          # shell that would swallow it. `npm run` would be that shell.
          command:
            [
              node,
              --experimental-strip-types,
              src/roots/migrate.ts,
            ]
          env:
            # Defined before the URL that expands it, which is the ordering
            # Kubernetes resolves `$(...)` in.
            - name: CHUG_PG_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  { name: chuggy-postgres-credentials, key: owner-password }
            - name: CHUG_MIGRATE_DATABASE_URL
              value: postgres://chuggy_owner:$(CHUG_PG_OWNER_PASSWORD)@postgres.chuggy.svc.cluster.local:5432/chuggy_rehearsal
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
      # A statement that rewrites a table can outlast a short budget, and the
      # command's own statement timeout is longer than this by default. Killing
      # the pod mid-transaction does not corrupt anything -- PostgreSQL rolls
      # the transaction back -- but it loses the report of what was applied.
      terminationGracePeriodSeconds: 120
