# Ory Kratos: who the people are. Hydra knows nothing about them -- it hands a
# login challenge to the app in ory-ui.yaml, that app drives a Kratos flow, and
# only the resulting subject comes back. Swapping Kratos out is a change to that
# app and to nothing Hydra issues.
#
# Reached at https://id.vteng.io, sharing the host with the self-service UI. The
# Ingress that splits them is in ory-ui.yaml, because the UI owns the root path
# and the split only makes sense read as a whole.
#
# NO MAIL. There is no SMTP server on this rig, so account recovery and address
# verification are switched off rather than left at their defaults to fail at
# the point of use, and the one-time-code method is switched off with them --
# it defaults to enabled and delivers its code by mail. What that costs is
# real: a person who forgets their password has no self-service way back, and
# an operator deleting the identity through the admin API is the only recovery
# there is.
#
# 4434 IS THE UNAUTHENTICATED ADMIN API and can mint an identity or a session
# for anyone, and it returns the GitHub token of anyone who linked an account,
# which `ory/kratos.yaml` describes. What holds it to callers inside `ory` is
# the policy in ory-network-policy.yaml, which also states the three ways past
# it and the one road to these same tables it does not touch at all.
#
# The migration initContainer and the DDL/DML role split are as ory-hydra.yaml
# describes, and so is the config file: `ory/kratos.yaml`,
# `ory/identity.default.schema.json` and `ory/oidc.github.jsonnet` are the
# files this pod mounts, and cluster/apps/kustomization.yaml generates the
# hashed ConfigMap that carries them. Editing any of them rolls this
# Deployment, which is gdoteof/chuggy-fabric#7 -- the issue was found on this
# workload.
#
# THE IDENTITY SCHEMA IS IN THAT HASH TOO, which matters more here than the
# server config does: a schema change that did not reach the running pod would
# leave Kratos validating new identities against the old shape.
#
# SIGN-IN WITH GITHUB NEEDS ONE VALUE THIS REPOSITORY CANNOT HOLD, the
# chuggy-portal App's client secret, and `kratos-github-app-portal-client` is
# where this pod reads it from. ory-namespace.yaml records the command that
# makes it.
#
# THAT SECRET COMES BEFORE THE MERGE THAT NAMES IT, AND THE WRONG ORDER DOES
# NOT COST SIGN-IN AT FIRST. The new pod is never built --
# `CreateContainerConfigError`, in an event that names the Secret -- and the
# pod it was to replace keeps serving, because a rolling update of one replica
# takes nothing down until the replacement is Ready. What it costs is
# everything behind it: `apps` waits on the rollout and reads not-Ready when
# its timeout passes, which holds `chuggy-migrate` and `chuggy`, and so every
# release, at `DependencyNotReady`. And the ConfigMap the serving pod mounted
# is pruned by then, as cluster/apps/kustomization.yaml describes, so that pod
# serves until something restarts it and after that nothing signs anyone in.
# Making the Secret is the whole repair: the kubelet retries the container it
# could not build.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
  namespace: ory
  labels: { app: kratos }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kratos }
  template:
    metadata:
      labels:
        app: kratos
        chuggy.dev/postgres-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
      initContainers:
        - name: migrate
          image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
          args: [migrate, sql, up, -e, --yes]
          env:
            - name: DSN
              valueFrom:
                secretKeyRef: { name: kratos, key: migrate-dsn }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: kratos
          image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
          args: [serve, --config, /etc/config/kratos.yaml]
          ports:
            - name: public
              containerPort: 4433
            - name: admin
              containerPort: 4434
          env:
            - name: DSN
              valueFrom:
                secretKeyRef: { name: kratos, key: dsn }
            - name: SECRETS_DEFAULT
              valueFrom:
                secretKeyRef: { name: kratos, key: secrets-default }
            - name: SECRETS_COOKIE
              valueFrom:
                secretKeyRef: { name: kratos, key: secrets-cookie }
            # Encrypts credentials at rest. Exactly 32 characters, because it is
            # an AES-256 key -- ory-namespace.yaml says how that is guaranteed.
            - name: SECRETS_CIPHER
              valueFrom:
                secretKeyRef: { name: kratos, key: secrets-cipher }
            # The client secret `ory/kratos.yaml` leaves out of its one sign-in
            # provider. Kratos reads its environment after its file, and a
            # name of this shape sets one field of the provider at that
            # position in the file's list: the `0` is an index, and
            # tests/kratos-github.py holds it to the provider it is for.
            #
            # REQUIRED, NOT `optional`. Kratos exits on a provider with no
            # client secret, so an optional reference would not start this pod
            # without the Secret either -- it would trade an event that names
            # the missing Secret for a crash loop on a schema error.
            - name: SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kratos-github-app-portal-client
                  key: client-secret
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          # PUBLIC, NOT ADMIN, AND THE REASON IS THE NETWORKPOLICY. A kubelet
          # probe arrives from the node, so no podSelector can ever match it
          # and ory-network-policy.yaml admits it on the admin port only by way
          # of kube-router's node-local ACCEPT. Probing there would make the
          # liveness of this pod a property of the CNI: under one without that
          # rule Kratos would fail its probes and crash-loop minutes after the
          # policy landed. Kratos serves both health endpoints on the public
          # port, which the policy admits from anywhere, so this costs nothing
          # -- and neither path is published, because the Ingress in
          # ory-ui.yaml routes `/self-service` here and nothing else.
          readinessProbe:
            httpGet: { path: /health/ready, port: public }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/alive, port: public }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap: { name: kratos-config }
---
# Public: the browser-facing flow endpoints, routed by the Ingress in
# ory-ui.yaml under the paths Kratos owns on id.vteng.io.
apiVersion: v1
kind: Service
metadata:
  name: kratos-public
  namespace: ory
spec:
  selector: { app: kratos }
  ports:
    - name: public
      port: 4433
      targetPort: public
---
# Admin. A separate object for the reason hydra-admin is one: no Ingress can
# name a port that is not in the Service it points at.
apiVersion: v1
kind: Service
metadata:
  name: kratos-admin
  namespace: ory
spec:
  selector: { app: kratos }
  ports:
    - name: admin
      port: 4434
      targetPort: admin
