# One-time handoff of dev2's credentials over the cluster's own ingress.
#
# What is served is already encrypted: dev2.kubeconfig.age opens only with the
# WireGuard private key dev2 generated and nobody else has ever held. Publishing
# the ciphertext is the point -- it means the delivery channel does not have to
# be trusted, so a public URL is as good as a private one.
#
# The files live on the node at /var/lib/chuggy-share, NOT in this repo. Git
# history is permanent and this repository is public; a served file can be
# deleted, a committed one cannot. Only the machinery to serve them is declared
# here, which is the right split -- infrastructure in git, transient payload not.
#
# Paths are enumerated rather than served as a directory. Same argument as the
# tunnel's hostname list: the manifest is the record of what is reachable, and
# nothing else in that directory can be fetched or enumerated even by accident.
#
# Delete this file once dev2 has collected them. Flux prunes on removal.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: share
  namespace: chuggy
  labels: { app: share }
spec:
  replicas: 1
  selector:
    matchLabels: { app: share }
  template:
    metadata:
      labels: { app: share }
    spec:
      # hostPath binds this pod to the node holding the files.
      nodeSelector:
        chuggy.dev/durable: "true"
      containers:
        - name: nginx
          # Unprivileged variant: binds 8080 as uid 101, so no root and no
          # NET_BIND_SERVICE just to serve two static files.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: files
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: [ALL]
      volumes:
        - name: files
          hostPath:
            path: /var/lib/chuggy-share
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: share
  namespace: chuggy
spec:
  selector: { app: share }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: share
  namespace: chuggy
spec:
  ingressClassName: traefik
  rules:
    - host: share.vteng.io
      http:
        paths:
          # Exact, not Prefix: these two files and nothing else routes at all.
          - path: /dev2.kubeconfig.age
            pathType: Exact
            backend:
              service: { name: share, port: { number: 80 } }
          - path: /wg2age.py
            pathType: Exact
            backend:
              service: { name: share, port: { number: 80 } }
