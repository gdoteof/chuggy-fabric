# The network boundary around the durable authority, declared here because
# postgres.yaml is. A rebuild that restores the database without these restores
# a database any pod on the cluster may open a connection to, and nothing would
# report that as a failure.
#
# Two policies and not one. NetworkPolicies are additive, and the directions are
# different questions -- who may reach the server, and where the server may
# reach -- so one name could not be honest about both.
#
# WHAT SELECTING A POD DOES NOT BOUND. Naming a pod isolates it from the pod
# network and from nothing else, so three paths reach PostgreSQL that no rule
# below can see -- and they are not exempt for the same reason.
#
# Two never reach the pod network at all. `kubectl exec` lands in the server's
# own container and connects over the Unix socket, which this image's pg_hba
# matches with `trust` ahead of its password catch-all. `kubectl port-forward`
# is served by the kubelet from inside the pod's network namespace, so the
# connection is already past the boundary when it is made.
#
# The third crosses the pod network and is exempted anyway, which is a weaker
# guarantee. k3s's embedded kube-router programs each pod's chain with an
# unconditional ACCEPT for a source address local to the node, ABOVE the jump to
# the policy's chain, so the node itself and every host-network pod on it reach
# the server whatever they are labelled. That ACCEPT is this CNI's own doing
# rather than anything Kubernetes guarantees -- under a different one it is a
# fact to re-establish, not a property to assume carried over.
#
# What bounds all three is who may exec in this namespace and who may run on the
# node -- not this file.
#
# A check that reached the server through a forwarded port, from inside its
# containers, or from the node has therefore proved nothing about these
# policies.
#
# The argument in full, and the iptables evidence behind the kube-router claim,
# are in kasofsk/chuggy under deploy/rig/postgres/ and deploy/rig/isolation/.
---
# Ingress: this namespace, this label, this port, and no other pod-network
# client. A label rather than a workload name because the workloads that will
# connect -- the dispatcher, the API -- do not exist yet, and because it is the
# honest description: authorization here is possession of a label, not
# authentication. The database roles are what separate one service from another.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-admits-labelled-clients
  namespace: chuggy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              chuggy.dev/postgres-client: "true"
        # A SECOND ELEMENT, WHICH IS OR. The selector above is bare, and a bare
        # podSelector is scoped to this policy's own namespace -- so it admits
        # labelled pods in `chuggy` and nothing else, whatever another namespace
        # labels itself. sirdocalot runs in its own namespace against its own
        # database and role, so it needs saying separately.
        #
        # The two selectors inside THIS element are AND, not OR: the namespace
        # must be the named one and the pod must still carry the label. That
        # keeps the model above intact -- authorization is possession of a label
        # -- and adds only where a labelled pod may live. Naming namespaces one
        # at a time rather than by a label of their own is the same choice as
        # enumerating tunnel hostnames: the list is the record of who may
        # connect.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sirdocalot
          podSelector:
            matchLabels:
              chuggy.dev/postgres-client: "true"
      ports:
        - protocol: TCP
          port: 5432
---
# Egress: nowhere. PostgreSQL originates no outbound connection in this
# deployment -- no upstream, no archive, no foreign data wrapper -- so refusing
# every destination costs it nothing it does. What it buys is a bound on the
# ways in above: the two that land on a `trust` line arrive as an
# unauthenticated superuser, and this is what such a foothold cannot then reach.
#
# THE ABSENT `egress:` KEY IS THE RULE. Naming Egress in policyTypes with no
# rules beneath it denies every destination. `egress: [{}]` permits every
# destination and looks almost identical -- do not "complete" this object.
#
# Replies are not egress. The pod's chain accepts RELATED,ESTABLISHED before it
# consults any policy, so a connection the policy above admits is answered
# whatever this one says. What stops here is a connection the server opens.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-denies-egress
  namespace: chuggy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Egress
