# chug.gy: chuggy's public site, from kasofsk/chug.gy, at `chug.gy` and
# `www.chug.gy`. One static binary serves the pages embedded in it, keeps each
# request for an invite as one JSON line on the claim below, and serves that
# file back to the holder of the admin token. Its policy admits Traefik, and
# lets it out to the resolver, Hydra's public port and Keto's read port alone:
# the admin pages at https://chug.gy/admin sign a person in through Hydra and
# ask Keto whether they hold `read_marketing` on `Site:main`.
#
# ITS OWN LAYER, cluster/flux/chug-gy.yaml, which says why. Its image is built
# at each commit to kasofsk/chug.gy's `main` by the image trigger,
# cluster/build-system/image-trigger.yaml, from chug-gy-image-run.yaml beside
# it; a new one is admitted by the pull request
# cluster/build-system/chug-gy-admit.yaml opens and merges, which writes the
# digest that run reports into the `web` container below.
#
# THE DOCS ARE AN IMAGE OF THEIR OWN, `chug-gy/docs`, built at each commit
# that changes kasofsk/chuggy-docs by the same trigger from
# chuggy-docs-image-run.yaml and admitted into the `docs` init container by
# the same pull request. That container copies them into a volume the server
# reads them from, and CHUG_SITE_DOCS is set here so that this file, and not
# the image's own ENV, says where. The copy the site's image still bakes in,
# at the commit kasofsk/chug.gy's Dockerfile pins, is no longer read. The
# server reads the docs once, at start, so a new docs image is a new pod,
# which `Recreate` gives it.
#
# THE REQUESTS ARE THE ONE THING HERE WORTH KEEPING, and they are small. The
# claim is `local-path` with no retained volume and no backup: a request is
# read and answered as it arrives, and the file is the record of who asked.
# To read it:
#
#   curl -H "Authorization: Bearer $(kubectl -n chug-gy get secret chug-gy-admin \
#     -o jsonpath='{.data.token}' | base64 -d)" https://chug.gy/admin/requests
#
# THE ADMIN TOKEN IS A Secret CREATED OUT OF BAND, as Track Record's tokens
# are, and never written in this repository. The mount below is optional and
# the server reads the file on each request, so the pod runs without it and
# the route answers 404 until it exists:
#
#   kubectl -n chug-gy create secret generic chug-gy-admin \
#     --from-literal=token="$(openssl rand -hex 32)"
#
# THE ADMIN SIGN-IN IS A HYDRA CLIENT AND A Secret, BOTH OUT OF BAND, the
# same rule as Grafana's and Headlamp's; README.md's "chug.gy's admin sign-in"
# says why the client has no audience. The browser goes to the public issuer;
# the server redeems the code and fetches the signing keys from hydra-public
# over the pod network, so it needs that and not the internet. The mount is
# optional, so the pod runs without the Secret and the site's admin pages stay
# off until it exists:
#
#   kubectl -n ory exec deploy/hydra -c hydra -- hydra create oauth2-client \
#     --endpoint http://127.0.0.1:4445 --id chuggy-chug-gy --name chug.gy \
#     --grant-type authorization_code --response-type code \
#     --scope openid --skip-consent \
#     --redirect-uri https://chug.gy/admin/callback
#   kubectl -n chug-gy create secret generic chug-gy-oidc \
#     --from-literal=client-secret=<the client secret Hydra returned> \
#     --from-literal=session-key=<64 hex characters from a random source>
#
# Site admins hold `read_marketing` with no tuple written; anyone else is
# granted it by a tuple on `Site:main#marketing_readers`.
#
# The site is public only once the two hosts are also in
# `chuggy.tunnel.hostnames` and each has a CNAME to the tunnel, as
# cluster/chuggy/chuggy-ui.yaml's "the host, three ways" describes. chug.gy
# is a second zone on the same Cloudflare account, so the apex and `www` are
# what Universal SSL covers there, as a single label is on vteng.io.
---
apiVersion: v1
kind: Namespace
metadata:
  name: chug-gy
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chug-gy-data
  namespace: chug-gy
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chug-gy
  namespace: chug-gy
  labels: { app: chug-gy }
spec:
  replicas: 1
  # One file on a ReadWriteOnce claim: the old pod stops before the new one
  # opens it.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: chug-gy }
  template:
    metadata:
      labels: { app: chug-gy }
    spec:
      # A local-path claim is a directory on the node that made it.
      nodeSelector:
        chuggy.dev/durable: "true"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: docs
          image: registry.chuggy.internal/chug-gy/docs@sha256:35ce5d62047dff4ac4e73baf838e20d37996010eee0d01eee0f34a3bb5c5d8af
          imagePullPolicy: IfNotPresent
          command: [cp, -R, /docs/., /site-docs/]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: site-docs
              mountPath: /site-docs
      containers:
        - name: web
          image: registry.chuggy.internal/chug-gy/web@sha256:902f84980088cbd1950f7219d0f7b21ca9d7c60e71c555d016f5001853355659
          imagePullPolicy: IfNotPresent
          env:
            - { name: CHUG_SITE_LISTEN, value: ":8080" }
            - { name: CHUG_SITE_DATA, value: /data }
            - { name: CHUG_SITE_HOST, value: chug.gy }
            - { name: CHUG_SITE_ADMIN_TOKEN_FILE, value: /var/run/chug-gy/admin/token }
            - { name: CHUG_SITE_DOCS, value: /site-docs }
            - { name: CHUG_SITE_OIDC_ISSUER, value: "https://auth.vteng.io" }
            - { name: CHUG_SITE_OIDC_INTERNAL_URL, value: "http://hydra-public.ory.svc.cluster.local:4444" }
            - { name: CHUG_SITE_OIDC_CLIENT_ID, value: chuggy-chug-gy }
            - { name: CHUG_SITE_OIDC_CLIENT_SECRET_FILE, value: /var/run/chug-gy/oidc/client-secret }
            - { name: CHUG_SITE_SESSION_KEY_FILE, value: /var/run/chug-gy/oidc/session-key }
            - { name: CHUG_SITE_KETO_READ_URL, value: "http://keto-read.ory.svc.cluster.local:4466" }
          ports:
            - name: http
              containerPort: 8080
          # The one route that reads nothing: the probe names the pod's own
          # address, which the canonical-host redirect leaves alone for it.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: admin
              mountPath: /var/run/chug-gy/admin
              readOnly: true
            - name: oidc
              mountPath: /var/run/chug-gy/oidc
              readOnly: true
            - name: site-docs
              mountPath: /site-docs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chug-gy-data
        - name: admin
          secret:
            secretName: chug-gy-admin
            optional: true
        - name: oidc
          secret:
            secretName: chug-gy-oidc
            optional: true
        # The docs, copied in by `docs` above, with room for them to grow.
        - name: site-docs
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chug-gy
  namespace: chug-gy
spec:
  selector: { app: chug-gy }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Traefik in; out, the resolver, hydra-public to redeem a sign-in's code and
# read Hydra's signing keys, and keto-read to ask whether the person may read
# the dashboard. Each destination is written as the pods that answer it, for
# the reason cluster/apps/chuggy-control-plane-network-policy.yaml gives. The
# kubelet's probes need no element, for the reason that file gives over the
# API's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chug-gy
  namespace: chug-gy
spec:
  podSelector:
    matchLabels: { app: chug-gy }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ory
          podSelector:
            matchLabels:
              app: hydra
      ports:
        - protocol: TCP
          port: 4444
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ory
          podSelector:
            matchLabels:
              app: keto
      ports:
        - protocol: TCP
          port: 4466
---
# Both hosts, the whole site: the server itself redirects `www` to the apex
# and holds back the routes it does not publish. No `tls:`, because TLS
# terminates at Cloudflare and Traefik is reached over plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chug-gy
  namespace: chug-gy
spec:
  ingressClassName: traefik
  rules:
    - host: chug.gy
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chug-gy
                port: { name: http }
    - host: www.chug.gy
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chug-gy
                port: { name: http }
